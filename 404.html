<script>
function shareFallback(t, done){
  const ta=document.createElement('textarea'); ta.value=t;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById('sh').addEventListener('click', e=>{
  e.stopPropagation();
  const msg='I died from '+deathCause.replace(/\.\s+/g,', ')+' '+meters+' m into the Hogsback mist. Beat that: wildlogic.co.za/hogs-back-run';
  const done=()=>{ e.target.textContent='✓ Copied — go paste it on them';
    setTimeout(()=>{ e.target.textContent='⚔️ Challenge a chommie'; },1800); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(msg).then(done, ()=>shareFallback(msg,done));
    else shareFallback(msg,done);
  }catch(err){ shareFallback(msg,done); }
});
// ---- one player, one slot ------------------------------------------------------
// The board used to key rows on the NAME, so every alias minted a brand new row: the live
// all-time board had 6 of its 10 slots held by one person under 6 names, with 4 real people
// pinned underneath. The game now mints a device token once, keeps it, and sends it with
// every score — the Worker keys the row on that token, so submitting a new name RENAMES
// your existing entry instead of adding a second one.
// Honest limits: clearing site data, a private window or a second device all mint a new
// token, and the token is not secret. This removes accidental and casual aliasing. It is
// not identity, and it can be defeated on purpose. Real identity needs accounts, which is
// far too much friction for a 404 easter egg.
const PID_KEY='hogback_pid', NAME_KEY='hogback_name';
function getPid(){
  try{
    let p=localStorage.getItem(PID_KEY);
    if(!p){
      p=Array.from(crypto.getRandomValues(new Uint8Array(16)))
             .map(b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(PID_KEY,p);
    }
    return p;
  }catch(e){ return null; }   // storage blocked / private mode -> fall back to name-keyed
}
const PID=getPid();
const savedName=(()=>{ try{ return localStorage.getItem(NAME_KEY)||''; }catch(e){ return ''; } })();
// The label has to SAY what renaming does. Without this, Matt types a new name, sees no new
// row appear on the board, and files it as a bug — the rename is invisible from his side.
function prefillName(){
  const ni=document.getElementById('ni');
  if(ni.value) return;
  if(savedName){
    ni.value=savedName;
    document.getElementById('nl').textContent='On the board as '+savedName+' — a new name just renames that entry';
  }
}
document.getElementById('ns').addEventListener('click', submitName);
document.getElementById('ni').addEventListener('keydown', e=>{ if(e.key==='Enter') submitName(); });
function submitName(){
  const name=(document.getElementById('ni').value||'').trim();
  if(!name) return;
  // v5.1: a tour run's score IS the world distance reached (stop + metres). That world
  // distance is what posts — the mushroom cost already gated the restart, so the board
  // stays honest without the old points-at-0 rule. v5.2: Mayor fires at 1,020,000 (six
  // laps) but the board's ceiling is 1,000,000 — clamp to the cap so the save is accepted.
  const body={name:name,meters:Math.min(runStart+meters,1000000),cause:deathCause};
  if(PID) body.pid=PID;                     // no token -> Worker falls back to name-keyed
  fetch(API,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify(body)})
    .then(r=>r.json()).then(res=>{
      if(res.ok){
        posted=true; lastPostedM=meters;        try{ localStorage.setItem(NAME_KEY,name); }catch(e){}
        document.getElementById('nm').hidden=true;
        toast = res.weeklyRank
          ? {s:'Yebo — you are #'+res.weeklyRank+' this week!',age:0}
          : {s:"Didn't crack the top 10 this time — go again, boet.",age:0};
        fetchBoard(true).then(refreshQualify);
      }else{
        // A REFUSED save used to be completely silent — no toast, no error, the name box just
        // sat there. From the player's side that is indistinguishable from a broken button,
        // which is exactly how Matt reported it when his 77827 m run tripped the server's
        // distance ceiling ("it won't let me save my name"). Say what happened, and leave the
        // box up so the run can be retried once the cause is fixed.
        toast = res.error==='suspicious meters'
          ? {s:'Not saved — that distance looks impossible to the server.',age:0}
          : {s:'Not saved — '+(res.error||'the server refused it')+'.',age:0};
      }
    }).catch(()=>{
      // Network/offline. Also silent before, so a run could vanish with no explanation.
      toast = {s:'No signal to the leaderboard — run not saved. Try again.',age:0};
    });
}

// LIFTING WAS REJECTED because it is binary: overlap is inversely proportional to speed, so
// slower is always the harder case — any lift that beats the arc at the 880 px/s wave peak
// beats it at every speed, and a partial lift gives the INVERSE curve (duck-only early,
// free late). There is no setting that bites late and spares early.
// So the RIDERS get boxes instead. Measured off drawRider() by _rider_bbox.js, in px
// relative to the rider's draw origin (o.x + o.w*.45) and to the log's top surface:
//   baboon  reaches 36.9 px up  ->  GROUND-91.9  ->  89.9 px of clearance needed, which is
//           ABOVE the 75.85 px apex, so a baboon log is UNCLEARABLE and MUST be ducked.
//           (The head-and-rump mass alone reaches 32.8 px = 85.8 px needed, so the verdict
//            does not hinge on the thin swept tail — it is not a pixel-corner cheat.)
//   toad    reaches 14.9 px up  ->  GROUND-69.9  ->  67.9 px needed: clearable, but only
//           63-79 ms of slack between 720 and 880 px/s. A genuinely risky jump.
//   bare log unchanged, still the free 133 ms jump it has always been.
// v5.0 OWNER RULING (09 Sep 2026): "no riders may be jumpable, with a frog or baboon you
// must duck, so size of rider doesnt matter, if you dont duck you die." BOTH boxes now
// reach 89.9 px above the log surface — above the 75.85 px apex — so ANY rider log is
// duck-only. The art scale-up in drawRider is readability only; the verdict is identical
// for frog and baboon. Bare log stays the free 133 ms jump.
// NOTE: _verify_rider_box.js re-measures the ART and will fail against these owner-ruled

// ============================ v5.0 REST STOPS ==============================
// Owner: "maybe the places should be the stops? you woke up at the inn? you stopped for a
// beer at happy hogs?" The restart points ARE landmarks, and the landmark distances are
// Fibonacci numbers (Miki's list — "not a joke, important message from elsewhere").

// banks roughly 25-35 if you take the risky ones.
const STOPS = [
  {m:420,    label:'CANNACOPIA',          line:'You wake up behind Cannacopia',        cost:1},
  {m:2500,   label:'THE HOG & DRAGON',    line:'You sleep it off at the Hog & Dragon', cost:2},

  {m:46368,  label:'KETTLESPOUT',         line:'You shelter at Kettlespout',           cost:24},
  {m:75025,  label:'SWALLOWTAIL',         line:'You sleep at Swallowtail',             cost:38},

];

const PERMIT_COST = 100;   // opens the gate for the NEXT lap; without it you're escorted back.
const MAYOR_M  = 1020000;  // six full laps of 170,000 — the one and only win: crowned Mayor
const WALLET_KEY = 'hogback_wallet';
let pocket = (()=>{ try{ return Math.max(0, Math.floor(+localStorage.getItem(WALLET_KEY)||0)); }catch(e){ return 0; } })();
function savePocket(){ try{ localStorage.setItem(WALLET_KEY, String(pocket)); }catch(e){} }
function addPocket(n){ pocket += n; savePocket(); }
// deepest stop the wallet can pay for, given how far the run got (you can only continue
// from a stop you actually PASSED this run)
function bestStop(runMeters){
  let best = null;
  for(const s of STOPS) if(runMeters >= s.m && pocket >= s.cost) best = s;
  return best;
}
// v5.3: up to THREE restart options, deepest first — stops the run passed. Affordable ones
// are live buttons; deeper ones are GREYED with the shortfall ("need N more 🍄") so players
// learn the economy: restart higher next time if you bank more mushrooms. (Owner: "i want
// more than one option, so people have to chose and can see if they dont have enough
// shrooms they start to learn they could have restarted higher if they had more")
function contOptionsFor(runMeters){
  const passed = STOPS.filter(s => runMeters >= s.m).sort((a,b)=>b.m-a.m).slice(0,3);
  return passed.map(s => ({stop:s, afford: pocket >= s.cost, short: Math.max(0, s.cost - pocket)}));
}

// ---- hog sprite: proper little boar, drawn from shapes (faces right) ----
const HW = 72, HH = 21;
const FUR='#33313b', SNOUT='#6e5f58', LIGHT='#efe9dd', HOOF='#17161c';

function drawHog(x, phase, squash){
  ctx.save();
  if(squash){ ctx.translate(x+HW/2, GROUND); ctx.scale(1,.5); ctx.translate(-(x+HW/2), -GROUND); }
  const top = hogY - HH - 14;
  // four trotting legs (two-part, with dark hooves)
  const amp = jumping ? 0 : (squash ? 2 : 4);
  [[10,-1],[19,1],[43,-1],[52,1]].forEach(([lx,dir],i)=>{
    const sw = Math.sin(phase + i*Math.PI/2) * amp * dir;
    ctx.fillStyle=FUR; ctx.fillRect(x+lx, top+22, 7, 12);
    ctx.fillRect(x+lx+1+sw*.6, top+30, 5, 6);
    ctx.fillStyle=HOOF; ctx.fillRect(x+lx+1+sw*.6, top+34, 5, 2);
  });
  // tail: thin curl off the rump
  ctx.strokeStyle=FUR; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+8,top+9);
  ctx.quadraticCurveTo(x-3,top+2,x+3,top-2); ctx.stroke();
  ctx.fillStyle=FUR; ctx.beginPath(); ctx.arc(x+3,top-2,2.2,0,7); ctx.fill();   // tuft
  // body: rump + barrel + shoulder hump read as one mass
  ctx.beginPath(); ctx.ellipse(x+16,top+15,12,10.5,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+34,top+16,27,12.5,-.04,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+47,top+11,13,9.5,-.1,0,7); ctx.fill();
  // head + raised snout
  ctx.beginPath(); ctx.ellipse(x+55,top+12,10,9,.05,0,7); ctx.fill();
  ctx.fillStyle=SNOUT; ctx.fillRect(x+61,top+8,11,9);
  ctx.fillStyle=HOOF; ctx.fillRect(x+69,top+11,2.5,3);           // nostril
  // tusk curling up past the jaw
  ctx.strokeStyle=LIGHT; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+62,top+17); ctx.quadraticCurveTo(x+65,top+12,x+63,top+10); ctx.stroke();
  // ear
  ctx.fillStyle=FUR;
  ctx.beginPath(); ctx.moveTo(x+47,top+4); ctx.lineTo(x+52,top-5); ctx.lineTo(x+57,top+3); ctx.closePath(); ctx.fill();
  // mane bristles along the back
  for(let i=0;i<4;i++){
    const mx=x+29+i*7;
    ctx.beginPath(); ctx.moveTo(mx,top+6); ctx.lineTo(mx+2.5,top-(i%2?5:7)); ctx.lineTo(mx+5,top+6); ctx.closePath(); ctx.fill();
  }
  // eye
  ctx.fillStyle=LIGHT; ctx.fillRect(x+56,top+9,2.6,2.6);
  ctx.lineWidth=1;
  ctx.restore();
}

// ---- obstacles ----
// ramp = 0..1 (distance / 10 km). The mix gets less forgiving as you go: more logs
// (you must duck) and more potholes (you must commit earlier), fewer plain stumps.
// Weights always sum to 1.0 whatever ramp is, so the balance stays predictable.

// ============================ v4.4 SIZE GROWTH =============================
// Every other difficulty curve plateaus: `ramp` (the mix) at 30 km, and `tighten` — which
// drives the gap and the speed cap — at 60 km. Past 60 km the game was literally constant:
// same gaps, same speed, same obstacle sizes. That plateau is how one run reached 78 km.
// `grow` never plateaus. It is asymptotic, so it keeps creeping tighter forever without
// ever arriving, which means the game can always get harder and can never cross into
// literally-unclearable.
//
// WHY HEIGHT, AND NOT WIDTH OR SPEED:
//   * HEIGHT does not change the horizontal footprint, so the landing sequence between two
//     obstacles is untouched. WIDTH does: it eats the clear ground you have to land on, and
//     at the 0.66 s gap floor a wide enough obstacle makes pothole->pothole unlandable.
//   * SPEED makes the game EASIER, not harder. The hog must stay above (h-6) for the whole
//     time it overlaps the box, and overlap is (hogW + w - 10)/spd — so a faster game gives
//     you MORE clearance. Raising the 800 px/s cap would loosen the late game further.
// The headroom is real: at speed every jumpable clears up to ~79 px against a 75.85 px apex,
// but the tallest thing the game spawns is 48 px. _clearance_budget.js tabulates it.
//
// THE KNOB THAT MATTERS is not the height, it is the TIMING SLACK: how early or late you can
// press jump and still clear. slack = timeAbove(h-6) - overlap, in seconds. The late game sat
// at 0.22-0.29 s — 13 to 17 frames of leniency. These factors pull it to ~0.11 s, which is
// still looser than the opening already is (the 330 px/s start is the tightest part of the
// game, at 0.09 s, because a slow hog spends longer over the box). _verify_growth.js proves
// the floor at every distance; turn GROW_FLOOR up to tighten further.
//
// WHAT DOES NOT GROW, AND WHY:
//   * pothole — drawPothole never reads o.h; the pit depth is hardcoded (GROUND+7/+11).
//     Growing the height would tighten the hitbox with NO visible change, which is exactly
//     the "too sneaky" trap the owner rejected for the waterfalls.
//   * log — duck-by-design, and its height is the log's thickness, not a jump target.
//   * toadstool width — the cap is drawn with hardcoded 34 px offsets (o.x+2 .. o.x+32), so
//     widening it would desync the art from the hitbox. Height only, and capped at 0.85 so
//     a 34 px cap does not end up on a 68 px stem.
// ===========================================================================
const GROW_START = 30000;    // m. Below this the opening is untouched, exactly as authored.
const GROW_SCALE = 40000;    // m. e-folding distance — smaller tightens faster.
const GROW_FLOOR = 0.075;    // s. Hard floor on timing slack; the gate asserts it everywhere.
// Max growth at the asymptote, per kind. Solved by _verify_growth.js to land every kind at
// ~0.11 s of slack, except the toadstool which is held back so the art stays in proportion.
const GROW_ALOE1 = 0.40, GROW_ALOE2 = 0.74, GROW_CUT = 0.66, GROW_SNAG = 0.41, GROW_TOAD = 0.85;
const growAt = m => m <= GROW_START ? 0 : 1 - Math.exp(-(m - GROW_START) / GROW_SCALE);

function spawn(ramp, grow){
  const r = ramp || 0;
  const g = grow || 0;
  // Difficulty now comes from WHAT spawns, not from impossible spacing. With a hard
  // 0.66 s floor on the gap there is only so much room to squeeze the rhythm, so the
  // late game leans much harder on logs (must duck) and potholes (must commit early)
  // instead. Weights sum to 1.0 at both r=0 and r=1 — the mix check asserts that.
  // STEEPENED for v4.2 (owner: "getting more difficult as the game progresses is good").
  // Total hard share at r=1 is .80 (was .58). At r=0 the opening is unchanged.
  const wA = .26 - .20*r, wS = .22 - .17*r, wT = .18 - .17*r, wP = .16 + .27*r, wL = .18 + .27*r;
  let roll = Math.random();
  if(meters < 400) roll *= .55;           // warm-up: nothing that needs a duck yet
  let o;
  if(roll < wA){
    // bigger than they were — Matt: "the small ones are a bit small" / can't see them
    const n = Math.random() < .22 ? 2 : 1;
    o = {kind:'aloe', n, x:W+40, w:n===2?58:38,
         h:((n===2?28:40)+Math.random()*8)*(1+(n===2?GROW_ALOE2:GROW_ALOE1)*g)};
  } else if(roll < wA+wS){
    // Old 44-58 wide x 22-28 tall read as flower pots. Stumps are roughly 1:1 in cross-section
    // (a sawn base) or clearly taller than wide (a snapped-off trunk). Snag is taller still.
    // HEIGHT IS CAPPED BY PHYSICS, NOT TASTE. The hog must stay above (h-6) for the whole
    // time it overlaps the box, and overlap lasts (hogW + w-10)/speed — so the SLOWEST
    // speed is the worst case, same trap as the old pixel gap floor. At the 330 px/s
    // opening a 34 px-wide snag tops out near 67 px, which is why the first attempt at
    // this (54-68 tall) was literally unclearable — the owner found it by playing.
    // _verify_jumpable.js asserts every variant clears with >=12 px spare at EVERY speed.
    const isSnag = Math.random()<.5;
    o = {kind:'stump', variant: isSnag?'snag':'cut', x:W+40,
         w: isSnag ? 26+Math.random()*8  : 30+Math.random()*10,
         h: isSnag ? (40+Math.random()*8)*(1+GROW_SNAG*g)
                    : (32+Math.random()*8)*(1+GROW_CUT*g)};
  } else if(roll < wA+wS+wT){
    o = {kind:'toadstool', x:W+40, w:34, h:(26+Math.random()*6)*(1+GROW_TOAD*g)};
  } else if(roll < wA+wS+wT+wP){
    // Hogsback's famous road: a WIDE pothole — same hop as a stump, but you must
    // jump earlier because the gap is longer. Rebalanced down from stump/toad
    // (owner: stumps and mushrooms "seem a lot").
    o = {kind:'pothole', x:W+40, w:64+Math.random()*30, h:10};
  } else {
    // The fallen yellowwood is the ONLY thing you must duck, so it's the natural perch.
    // The rider USED to be pure decoration, which is exactly why the duck was never forced:
    // the bare log was freely jumpable, and the log is ~45% of spawns once the ramp clamps,
    // so 0% of the late game actually demanded a duck and the whole endgame was one rhythm.
    // Now the rider carries the collision box it is already drawn in (see RIDER_BOX): a
    // baboon log cannot be jumped at all, a toad log is a tight one, a bare log is free.
    // Baboon was 20% and is now 50% — at 20% it only forced a duck on 9% of late spawns,
    // which was not enough to close the 70k exploit. Owner call, 2 Sep 2026.
    const rr = Math.random();
    const rider = rr < .50 ? 'baboon' : rr < .70 ? 'toad' : null;
    o = {kind:'log', x:W+40, w:86, h:LOGH, rider};
  }
  obs.push(o);
}
// ---- stumps: two Hogsback forest flavours, randomly chosen at spawn ----
//  'cut'  = a sawn-off tree stump: flared trunk, sawn top with growth rings
//  'snag' = a snapped-off broken tree: jagged splintered crown + branch stub
function drawStump(o, gy){
  const w=o.w, h=o.h, left=o.x, right=o.x+w, cx=o.x+w/2, top=gy-h;
  const cut = o.variant!=='snag';
  ctx.beginPath();
  if(cut){
    // STRAIGHT vertical sides. A sawn tree base is a cylinder, not a vase —
    // the flare I had on this made it read as a pot. Flanks stay parallel.
    ctx.moveTo(left+3, gy);
    ctx.lineTo(left+3, top+3);
    ctx.lineTo(right-3, top+3);
    ctx.lineTo(right-3, gy);
  } else {
    // Straight trunk sides too — only the BREAK on top is jagged.
    ctx.moveTo(left+4, gy);
    ctx.lineTo(left+4, top+8);
    ctx.lineTo(left+w*.18, top-4);
    ctx.lineTo(left+w*.31, top+5);
    ctx.lineTo(left+w*.45, top-7);
    ctx.lineTo(left+w*.59, top+3);
    ctx.lineTo(left+w*.73, top-5);
    ctx.lineTo(right-4, top+8);
    ctx.lineTo(right-4, gy);
  }
  ctx.closePath();
  ctx.fillStyle='#6e5638'; ctx.fill();
  if(nightRim>0){ ctx.strokeStyle=`rgba(226,214,180,${.45*nightRim})`; ctx.lineWidth=1; ctx.stroke(); }
  else { ctx.strokeStyle='#4a3826'; ctx.lineWidth=1; ctx.stroke(); }
  if(cut){
    // bark streaks down the trunk
    ctx.strokeStyle='#57432a'; ctx.lineWidth=1;
    for(let i=0;i<3;i++){ const xx=left+7+i*(w-14)/2; ctx.beginPath(); ctx.moveTo(xx,gy-2); ctx.lineTo(xx-2,top+5); ctx.stroke(); }
    // sawn top: a pale wood face big enough to actually read at this scale,
    // a darker heartwood dot, bold concentric rings, and a dark rim.
    ctx.fillStyle='#d8b889'; ctx.beginPath(); ctx.ellipse(cx, top+3, w*.26, 4.6, 0, 0, 7); ctx.fill();
    ctx.fillStyle='#a88054'; ctx.beginPath(); ctx.ellipse(cx, top+3, w*.10, 1.8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle='#5e4220'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.ellipse(cx, top+3, w*.20, 3.4, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, top+3, w*.13, 2.2, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, top+3, w*.06, 1.0, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle='#3a2a18'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.ellipse(cx, top+3, w*.26, 4.6, 0, 0, 7); ctx.stroke();
    // small moss patch on the back of the sawn face (not covering the rings)
    ctx.fillStyle='#5c8a4a';
    ctx.beginPath(); ctx.ellipse(left+w*.18, top+1, w*.18, 3.6, -.15, 0, 7); ctx.fill();
  } else {
    // pale splintered wood along the break — follows the jagged top band only,
    // so the bark below stays dark and the break reads as freshly snapped.
    ctx.fillStyle='#cfa97a';
    ctx.beginPath();
    ctx.moveTo(left+4, top+8);
    ctx.lineTo(left+w*.18, top-4);
    ctx.lineTo(left+w*.24, top+2);
    ctx.lineTo(left+w*.31, top+5);
    ctx.lineTo(left+w*.38, top+1);
    ctx.lineTo(left+w*.45, top-7);
    ctx.lineTo(left+w*.52, top+2);
    ctx.lineTo(left+w*.59, top+3);
    ctx.lineTo(left+w*.66, top);
    ctx.lineTo(left+w*.73, top-5);
    ctx.lineTo(right-4, top+8);
    ctx.lineTo(right-4, top+10);
    ctx.lineTo(left+4, top+10);
    ctx.closePath(); ctx.fill();
    // dark crevices in the two deepest notches so it reads as 'broken'
    ctx.fillStyle='#3a2a18';
    ctx.beginPath(); ctx.moveTo(left+w*.31, top+5); ctx.lineTo(left+w*.38, top+1); ctx.lineTo(left+w*.40, top+9); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(left+w*.59, top+3); ctx.lineTo(left+w*.66, top); ctx.lineTo(left+w*.68, top+8); ctx.closePath(); ctx.fill();
    // bark streaks on the lower trunk
    ctx.strokeStyle='#57432a'; ctx.lineWidth=.9;
    for(let i=0;i<2;i++){ const xx=left+12+i*(w-24)/1.5; ctx.beginPath(); ctx.moveTo(xx,gy-3); ctx.lineTo(xx,top+12); ctx.stroke(); }
    // a short broken branch stub, off the bark below the break
    ctx.strokeStyle='#5d4529'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(left+w*.32, top+18); ctx.lineTo(left+w*.15, top+10); ctx.stroke();
    ctx.lineCap='butt';
    // moss on the bark, below the break (kept clear of the splinters)
    ctx.fillStyle='#5c8a4a';
    ctx.beginPath(); ctx.ellipse(left+w*.72, top+15, w*.16, 3.2, .1, 0, 7); ctx.fill();
  }
}
// ---- riders on the fallen yellowwood. NOT decoration: they carry a collision box ----
// Measured by _rider_bbox.js and mirrored into RIDER_BOX; the gate fails if the two drift.
// The baboon's silhouette reaches higher than the hog can jump, so a baboon log is the one
// thing in the game you cannot clear — you slide under it while it sits there judging you.
function drawRider(kind, x, k){
  const base = LOGY + 2;                    // feet on the log's top surface
  const t = performance.now();
  ctx.save(); ctx.translate(x, base);
  if(kind==='baboon'){
    ctx.scale(1.15,1.15);                   // v5.0: owner — riders must read at a glance
    const sw = Math.sin(t/430)*1.4;         // tail, slow and unbothered
    ctx.strokeStyle = mix('#5b4a3a','#232840',k); ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-9,-17); ctx.quadraticCurveTo(-21,-24+sw,-18,-36+sw*2); ctx.stroke();
    ctx.fillStyle = mix('#5b4a3a','#232840',k);                // rump, back, head
    ctx.beginPath(); ctx.ellipse(-6,-16,7.5,6.5,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-22,6.5,8,-.1,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(2,-31,5,4.6,0,0,7); ctx.fill();
    ctx.fillStyle = mix('#3a2f26','#171b2e',k);                // muzzle
    ctx.beginPath(); ctx.ellipse(6,-30,3.4,2.8,.15,0,7); ctx.fill();
    ctx.fillStyle = mix('#8d7a63','#3b4260',k);                // chest ruff
    ctx.beginPath(); ctx.ellipse(3,-23,3.4,5.2,-.1,0,7); ctx.fill();
    ctx.strokeStyle = mix('#5b4a3a','#232840',k); ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(1,-25); ctx.quadraticCurveTo(7,-20,5,-16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1,-25); ctx.quadraticCurveTo(-5,-20,-3,-16); ctx.stroke();
    ctx.fillStyle = mix('#f0e0b0','#c9b06a',k);                // eye — sells "that's an animal"
    ctx.beginPath(); ctx.arc(6,-32,1.3,0,7); ctx.fill();
  } else {
    // Hogsback toad — squat, warty, entirely unimpressed with you
    ctx.scale(1.25,1.25);                   // v5.0: readability — owner call
    ctx.fillStyle = mix('#6b7a3a','#2a3a24',k);
    ctx.beginPath(); ctx.ellipse(0,-7,10,7,0,0,7); ctx.fill();          // body
    ctx.fillStyle = mix('#8a9a4a','#3a4a2c',k);
    ctx.beginPath(); ctx.ellipse(-2,-9,7,4.4,-.08,0,7); ctx.fill();     // back highlight
    ctx.fillStyle = mix('#5b6a30','#22301e',k);                          // haunches
    ctx.beginPath(); ctx.ellipse(-7,-3,4,3.2,.3,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6,-3,4,3.2,-.3,0,7); ctx.fill();
    ctx.fillStyle = mix('#6b7a3a','#2a3a24',k);
    ctx.beginPath(); ctx.ellipse(6,-11,4.5,3.6,0,0,7); ctx.fill();       // head
    ctx.fillStyle = mix('#d8c860','#8a7a34',k);                          // eyes
    ctx.beginPath(); ctx.arc(7,-12.6,1.8,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-12.6,1.8,0,7); ctx.fill();
    ctx.fillStyle='#14140e';
    ctx.beginPath(); ctx.arc(7.4,-12.6,.9,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4.4,-12.6,.9,0,7); ctx.fill();
    ctx.strokeStyle = mix('#4a5a28','#1a2416',k); ctx.lineWidth=1;       // front toes
    ctx.beginPath(); ctx.moveTo(1,-1); ctx.lineTo(1,1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9,-1); ctx.lineTo(9,1); ctx.stroke();
  }
  ctx.restore();
}
function drawObstacle(o){
  const gy = GROUND;
  if(o.kind==='stump'){
    drawStump(o, gy);
  } else if(o.kind==='toadstool'){
    const ch=o.h;
    ctx.fillStyle='#efe4c8'; ctx.fillRect(o.x+13,gy-ch*.62,8,ch*.62);   // stem
    ctx.fillStyle='#c23b2e';                                            // red cap
    ctx.beginPath(); ctx.moveTo(o.x+2,gy-ch*.58);
    ctx.quadraticCurveTo(o.x+17,gy-ch-6,o.x+32,gy-ch*.58);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f7f1e4';
    [[10,-ch*.72],[20,-ch*.86],[26,-ch*.66]].forEach(([dx,dy])=>ctx.fillRect(o.x+dx,gy+dy,3.5,3));
  } else if(o.kind==='log'){
    ctx.fillStyle='#77593a'; ctx.fillRect(o.x,LOGY,o.w,LOGH);
    ctx.strokeStyle='#5d4529';
    for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(o.x+4,LOGY+i*6.3); ctx.lineTo(o.x+o.w-4,LOGY+i*6.3); ctx.stroke(); }
    ctx.fillStyle='#8a6845'; ctx.beginPath(); ctx.arc(o.x+o.w-7,LOGY+LOGH/2,LOGH/2-4,0,7); ctx.fill();
    ctx.fillStyle='#5c8a4a';                        // moss along the top
    ctx.fillRect(o.x+6,LOGY-3,o.w*.55,5);
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.78,LOGY-2,14,4,.08,0,7); ctx.fill();
    if(o.rider) drawRider(o.rider, o.x + o.w*.45, nightRim);
  } else if(o.kind==='pothole'){
    const cxp = o.x + o.w/2;
    ctx.fillStyle = '#4a3b28';                      // the pit
    ctx.beginPath();
    ctx.moveTo(o.x, GROUND);
    ctx.quadraticCurveTo(o.x+o.w*.12, GROUND+7, o.x+o.w*.3, GROUND+7);
    ctx.quadraticCurveTo(cxp, GROUND+11, o.x+o.w*.7, GROUND+7);
    ctx.quadraticCurveTo(o.x+o.w*.88, GROUND+7, o.x+o.w, GROUND);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.45)';              // depth
    ctx.beginPath();
    ctx.ellipse(cxp, GROUND+5, o.w*.3, 3.5, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a744f'; ctx.lineWidth = 1.5;   // crumbled tar lip
    ctx.beginPath();
    ctx.moveTo(o.x, GROUND);
    ctx.quadraticCurveTo(cxp, GROUND-3, o.x+o.w, GROUND);
    ctx.stroke();
    ctx.lineWidth = 1;
  } else {
    for(let i=0;i<(o.n||1);i++){
      const bx=o.x+i*22+17, bh=o.h-(i?4:0);
      const base=gy-bh*.34;
      ctx.strokeStyle='#3f7d46'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(bx,gy); ctx.lineTo(bx,base); ctx.stroke();
      for(let L=0;L<7;L++){                        // seven-fingered dagga leaf
        const t=L/6-.5;
        const ang=-Math.PI/2 + t*2.5;
        const len=bh*.66*(1-Math.abs(t)*.72);
        const tx=bx+Math.cos(ang)*len, ty=base+Math.sin(ang)*len;
        const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2), hw=len*.14;
        ctx.fillStyle='#43a04e';
        ctx.beginPath();
        ctx.moveTo(bx,base);
        ctx.quadraticCurveTo(bx+(tx-bx)*.45+px*hw, base+(ty-base)*.45+py*hw, tx,ty);
        ctx.quadraticCurveTo(bx+(tx-bx)*.45-px*hw, base+(ty-base)*.45-py*hw, bx,base);
        ctx.closePath(); ctx.fill();
        // rim-light: dark green on a night hill is invisible, so edge it once it's dusk
        if(nightRim>0){ ctx.strokeStyle=`rgba(198,255,212,${.55*nightRim})`; ctx.lineWidth=1; ctx.stroke(); }
        if(Math.abs(t)<.34){
          ctx.strokeStyle='rgba(16,58,28,.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(bx,base); ctx.lineTo(bx+(tx-bx)*.8, base+(ty-base)*.8); ctx.stroke();
        }
      }
      ctx.fillStyle='#2e6b38';                     // little nugs at the node
      ctx.beginPath(); ctx.arc(bx,base-1,2.4,0,7); ctx.fill();
      ctx.lineWidth=1;
    }
  }
}

// ---- palette lerp / backdrop ----
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,k){ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`; }

function backdrop(k){
  ctx.fillStyle = mix(DAY.sky,NIGHT.sky,k); ctx.fillRect(0,0,W,H);
  if(k>.02){ ctx.fillStyle=`rgba(255,255,240,${k})`;
    stars.forEach(([sx,sy,r])=>ctx.fillRect(sx,sy,1+r*1.6,1+r*1.6));
    ctx.fillStyle=`rgba(245,240,215,${.9*k})`;
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
    ctx.fillStyle=mix(DAY.sky,NIGHT.sky,k);
    ctx.beginPath(); ctx.arc(780,58,18,0,7); ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,244,214,.9)';
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
  }
  // ---- distant mountain ranges: jagged peaks, slowest parallax, hazier with distance ----
  const offM = trav*.05 % 760;
  ctx.fillStyle = mix(DAY.mtn,NIGHT.mtn,k);
  for(let i=-1;i<3;i++){ const bx=i*760-offM;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.lineTo(bx+60,178);  ctx.lineTo(bx+108,214); ctx.lineTo(bx+170,132);
    ctx.lineTo(bx+214,186); ctx.lineTo(bx+268,108); ctx.lineTo(bx+330,176);
    ctx.lineTo(bx+392,150); ctx.lineTo(bx+455,196); ctx.lineTo(bx+516,120);
    ctx.lineTo(bx+580,182); ctx.lineTo(bx+648,146); ctx.lineTo(bx+712,200);
    ctx.lineTo(bx+760,GROUND); ctx.closePath(); ctx.fill(); }
  const offM2 = trav*.09 % 620;
  ctx.fillStyle = mix(DAY.mtn2,NIGHT.mtn2,k);
  for(let i=-1;i<3;i++){ const bx=i*620-offM2;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.lineTo(bx+52,208);  ctx.lineTo(bx+112,158); ctx.lineTo(bx+168,222);
    ctx.lineTo(bx+236,140); ctx.lineTo(bx+300,200); ctx.lineTo(bx+362,170);
    ctx.lineTo(bx+430,216); ctx.lineTo(bx+498,152); ctx.lineTo(bx+560,206);
    ctx.lineTo(bx+620,GROUND); ctx.closePath(); ctx.fill(); }
  if(k<.6){                                   // light catching the high peaks, fades into night
    ctx.fillStyle = `rgba(255,255,255,${.22*(1-k/.6)})`;
    for(let i=-1;i<3;i++){ const bx=i*620-offM2;
      [[112,158],[236,140],[498,152]].forEach(([px,py])=>{
        ctx.beginPath(); ctx.moveTo(bx+px,py);
        ctx.lineTo(bx+px+15,py+17); ctx.lineTo(bx+px-15,py+17);
        ctx.closePath(); ctx.fill(); }); }
  }
  const off = trav*.15 % 480;
  ctx.fillStyle = mix(DAY.far,NIGHT.far,k);
  for(let i=-1;i<3;i++){ const bx=i*480-off;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+120,118,bx+240,GROUND);
    ctx.quadraticCurveTo(bx+330,150,bx+430,GROUND); ctx.fill(); }
  const off2 = trav*.35 % 380;
  ctx.fillStyle = mix(DAY.near,NIGHT.near,k);
  for(let i=-1;i<4;i++){ const bx=i*380-off2;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+95,196,bx+190,GROUND);
    ctx.quadraticCurveTo(bx+270,225,bx+350,GROUND); ctx.fill(); }
  ctx.fillStyle = mix(DAY.ground,NIGHT.ground,k);
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle = mix(DAY.line,NIGHT.line,k); ctx.fillRect(0,GROUND,W,2);
  ctx.fillStyle = mix('#b0965c','#333757',k);
  for(let i=0;i<14;i++){ const gx=(i*97 - (trav%97)); ctx.fillRect(gx,GROUND+8+((i*53)%3)*9,7,2); }
}

// ---- waterfalls: canvas-drawn scenery at the waterfall landmarks (no image assets) ----
// One entry per waterfall landmark: w = spout width, h = drop height, jets = streams.
const WATERFALLS = [
  {m:17711,  w:44, h:146, jets:2},   // 39 Steps Falls (also a rest stop)
  {m:28657,  w:34, h:184, jets:2},   // Madonna & Child (also a rest stop)
  {m:46368,  w:62, h:116, jets:1},   // Kettlespout (also a rest stop)
  {m:75025,  w:36, h:206, jets:3},   // Swallowtail (also a rest stop)
  {m:130393, w:30, h:170, jets:2},   // Secret Falls (past the Labyrinth, deep field)
];
// Long runs repeat the set so the tail past ~130 km is not empty scenery.
const FALLS_CYCLE = 160000;
const FALLS = [];
for (const f of WATERFALLS)
  for (let r = 0; r < 4; r++)
    FALLS.push({ m: f.m + r * FALLS_CYCLE, w: f.w * (1 + r * .1), h: f.h * (1 - r * .04), jets: f.jets });
// deterministic jitter: each fall's rock shape stays stable frame-to-frame instead of shimmering
function nse(s){ const x = Math.sin(s*127.1)*43758.5453; return x - Math.floor(x); }
function drawWaterfalls(k, tNow){
  for(const f of FALLS){
    const sx = 60 + f.m*10 + 210 - trav;        // sits just past its signpost
    if(sx < -260 || sx > W+220) continue;
    const baseY = GROUND - 2, topY = baseY - f.h;
    ctx.save();
    // ---- cliff: overlapping boulder masses — no straight edges, no concrete lip ----
    ctx.fillStyle = mix('#6d7482','#232a47',k);
    for(let i=0;i<7;i++){
      const t = i/6;
      const bx = sx + (nse(f.m*3+i*1.7)-.5)*f.w*0.55*(1-t*0.6);
      const by = baseY - t*(f.h+16);
      const rr = f.w*(0.60 - t*0.15) * (0.78 + nse(f.m*5+i*2.3)*0.5);
      ctx.beginPath(); ctx.ellipse(bx, by, rr, rr*1.12, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = mix('#565d6b','#1a2038',k);   // rock strata
    for(let i=0;i<4;i++){
      const t = 0.18 + i*0.19;
      const rr = f.w*(0.48 - t*0.09)*(0.7+nse(f.m*9+i*3.1)*0.45);
      ctx.beginPath();
      ctx.ellipse(sx + (nse(f.m*17+i)-.5)*f.w*0.42, baseY - t*(f.h+16), rr, rr*0.3, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = mix('#4e7a44','#1b3326',k);   // moss and ferns on the ledges
    for(let i=0;i<5;i++){
      const t = 0.12 + i*0.17;
      ctx.beginPath();
      ctx.ellipse(sx + (nse(f.m*23+i*1.3)-.5)*f.w*1.3, baseY - t*(f.h+16),
        f.w*0.24*(0.55+nse(f.m+i)*0.8), f.w*0.085, 0, 0, 7); ctx.fill();
    }
    // ---- water: narrow at the lip, spreading at the base, edges wobbling ----
    const wob = tNow/300;
    for(let j=0;j<f.jets;j++){
      const slot = f.w/f.jets;
      const jx = sx - f.w/2 + (j+.5)*slot + (nse(f.m+j*7)-.5)*slot*0.3;
      const wTop = slot*0.30, wBot = slot*0.56;
      ctx.fillStyle = mix('#e6f4fa','#4a6f96',k);
      ctx.beginPath();
      for(let i=0;i<=7;i++){
        const t=i/7, w=wTop+(wBot-wTop)*t;
        ctx.lineTo(jx - w/2 + Math.sin(wob + t*3.3 + j*1.7)*f.w*0.055*t, topY + t*(f.h-8));
      }
      for(let i=7;i>=0;i--){
        const t=i/7, w=wTop+(wBot-wTop)*t;
        ctx.lineTo(jx + w/2 + Math.sin(wob + t*2.9 + j*2.1)*f.w*0.055*t, topY + t*(f.h-8));
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = mix('#ffffff','#86aecd',k);
      ctx.globalAlpha=.45;
      for(let s=0;s<5;s++){
        const t=((s/5)+(tNow/520)%1)%1, w=wTop+(wBot-wTop)*t;
        ctx.fillRect(jx - w*0.28, topY + t*(f.h-14), w*0.56, 3 + t*5);
      }
      ctx.globalAlpha=1;
    }
    // ---- plunge pool, boulders, spray ----
    ctx.fillStyle = mix('#eef7fb','#55799f',k);
    ctx.beginPath(); ctx.ellipse(sx, baseY + 5, f.w, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = mix('#6d7482','#232a47',k);
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(sx + (i-1)*f.w*0.5 + (nse(f.m*31+i)-.5)*f.w*0.22, baseY + 2,
        f.w*0.17*(0.6+nse(f.m+i*5)*0.7), f.w*0.11, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,255,255,${.18+.14*Math.sin(tNow/240)})`;
    for(let i=0;i<8;i++){
      const px = sx + (nse(f.m*37+i)*2-1)*f.w*0.85;
      ctx.fillRect(px, baseY - 3 - ((tNow/10 + i*29) % 26), 2.5, 2.5);
    }
    ctx.restore();
  }
}

// ---- the Big Tree (v5.0, owner: "big tree getting a big tree would also be cool") ----
// THE BIG TREE is a rest stop at 6,765 m, so it gets scenery worthy of a 1,000-year-old
// yellowwood: a colossal trunk on the LEFT of the track and a canopy that arcs overhead —
// you run BENEATH it. Same contract as the falls: deterministic jitter (nse), scrolls at
// `speed`, drawn behind the obstacles. Repeats with the same cycle so deep runs still see it.
const BIGTREE_CYCLE = 160000;
function drawBigTree(k, tNow){
  for(let r=0; r<4; r++){
    const m = 6765 + r*BIGTREE_CYCLE;
    const sx = 60 + m*10 - trav;               // trunk sits at its signpost
    if(sx < -420 || sx > W+180) continue;
    const sway = Math.sin(tNow/900 + r*1.3)*4; // slow canopy sway — it is alive
    ctx.save();
    // ---- trunk: massive, buttressed, leaning slightly over the road ----
    ctx.fillStyle = mix('#5d4529','#241f33',k);
    ctx.beginPath();
    ctx.moveTo(sx-46, GROUND+4);                          // left root flare
    ctx.quadraticCurveTo(sx-30, GROUND-90, sx-18+8, GROUND-170);
    ctx.quadraticCurveTo(sx-14+10, GROUND-235, sx+2+12, GROUND-262);
    ctx.lineTo(sx+26+12, GROUND-262);
    ctx.quadraticCurveTo(sx+30+6, GROUND-210, sx+34-2, GROUND-140);
    ctx.quadraticCurveTo(sx+38-8, GROUND-60, sx+52-18, GROUND+4);   // right root flare
    ctx.closePath(); ctx.fill();
    // bark ridges
    ctx.strokeStyle = mix('#43311d','#1a1626',k); ctx.lineWidth = 2.2;
    for(let i=0;i<5;i++){
      const bx = sx - 30 + i*9 + (nse(m*7+i)-.5)*5;
      ctx.beginPath(); ctx.moveTo(bx, GROUND-4);
      ctx.quadraticCurveTo(bx + 6, GROUND-110, bx + 14, GROUND-215); ctx.stroke();
    }
    // a low bough reaching over the track (the branch the tourists photograph)
    ctx.fillStyle = mix('#5d4529','#241f33',k);
    ctx.beginPath();
    ctx.moveTo(sx+8, GROUND-225);
    ctx.quadraticCurveTo(sx+95, GROUND-255+sway, sx+150, GROUND-235+sway);
    ctx.quadraticCurveTo(sx+95, GROUND-240+sway, sx+10, GROUND-208);
    ctx.closePath(); ctx.fill();
    // ---- canopy: overlapping ellipse masses arcing over the whole road ----
    const LEAF = ['#4e7a44','#5c8a4a','#43683c','#639257'];
    for(let i=0;i<11;i++){
      const t = i/10;
      const cx = sx - 120 + t*(W*0.95) + (nse(m*11+i)-.5)*40;
      const cy = GROUND - 285 + Math.sin(t*3.1+r)*16 + (nse(m*13+i)-.5)*18 + sway*(.4+.6*t);
      const rr = 55 + nse(m*17+i)*42;
      ctx.fillStyle = mix(LEAF[i%4], '#1b3326', k);
      ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr*.62, (nse(m*19+i)-.5)*.4, 0, 7); ctx.fill();
    }
    // dappled light holes near the top edge (sky poking through)
    ctx.fillStyle = mix('#bfe0f2','#141d38',k); ctx.globalAlpha = .5;
    for(let i=0;i<6;i++){
      const cx = sx - 60 + i*(W*0.14) + (nse(m*23+i)-.5)*50;
      const cy = GROUND - 300 + (nse(m*29+i)-.5)*24 + sway;
      ctx.beginPath(); ctx.arc(cx, cy, 9+nse(m*31+i)*13, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}
function wxLevel(){
  if(!mist) return 0;
  const a = mist.age, d = mist.dur;
  if(a < WX_FADE) return a/WX_FADE;
  if(a > d) return Math.max(0, 1-(a-d)/WX_FADE);
  return 1;
}
const RAIN = Array.from({length:130}, () => [Math.random()*(W+180), Math.random()*GROUND, .6+Math.random()*.8]);
function drawRain(lvl, dt){
  if(lvl<=.01) return;
  ctx.save();
  ctx.strokeStyle = `rgba(196,218,240,${.40*lvl})`; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(const d of RAIN){
    d[1] += (780 + d[2]*280) * dt;      // falling
    d[0] -= 140 * dt;                   // ...and blown back at the runner
    if(d[1] > GROUND+6){ d[1] = -10; d[0] = Math.random()*(W+180); }
    if(d[0] < -20) d[0] += W+180;
    ctx.moveTo(d[0], d[1]); ctx.lineTo(d[0]-7, d[1]+16);
  }
  ctx.stroke();
  ctx.fillStyle = `rgba(30,44,78,${.20*lvl})`; ctx.fillRect(0,0,W,H);   // light goes flat
  ctx.fillStyle = `rgba(224,238,250,${.45*lvl})`;                       // ticks on the track
  for(let i=0;i<12;i++){
    const sx = (i*83 + (trav*1.6)%83) % W;
    const ph = (performance.now()/170 + i*0.37) % 1;
    ctx.fillRect(sx, GROUND+5+ph*11, 2, 1.6);
  }
  ctx.restore();
}
// ---- mist (Hogsback style: brief, soft, and the fairies show you the lane) ----
function drawMist(lvl, tNow){
  if(lvl<=.01) return;
  const p = Math.min(mist.age/mist.dur,1);
  const cxp = W*(1.25 - 1.5*p);
  const g = ctx.createLinearGradient(cxp-W*.33,0,cxp+W*.33,0);
  g.addColorStop(0,'rgba(235,240,244,0)');
  g.addColorStop(.5,`rgba(235,240,244,${.62*lvl})`);
  g.addColorStop(1,'rgba(235,240,244,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(230,236,240,${.12*lvl*Math.sin(p*Math.PI)})`; ctx.fillRect(0,0,W,H);
  if(lvl>.3){
    for(const o of obs){
      if(o.x<-20 || o.x>W+40) continue;
      const cy = GROUND-(o.kind==='log'?LOGH+18:o.h)-14;
      for(let i=0;i<3;i++){
        const a=.45+.4*Math.sin(tNow/130+i*2.1+o.x*.01);
        ctx.fillStyle=`rgba(255,226,122,${a})`;
        ctx.beginPath();
        ctx.arc(o.x+o.w/2+(i-1)*14, cy+(i===1?-8:0), 2.2, 0, 7);
        ctx.fill();
      }
    }
  }
}

// ---- collectable pine mushrooms (GOLD + glowing — the deadly ones are red) ----
function drawShroom(s, tNow){
  const bob = Math.sin(tNow/220 + s.x*.02)*3;
  const y = s.y + bob;
  const pulse = .25 + .15*Math.sin(tNow/180 + s.x*.05);
  ctx.fillStyle = `rgba(255,215,94,${pulse})`;                       // fairy-glow halo
  ctx.beginPath(); ctx.arc(s.x+8.5, y+3, 17, 0, 7); ctx.fill();
  for(let i=0;i<2;i++){                                              // orbiting sparkles
    const a = tNow/300 + i*Math.PI;
    ctx.fillStyle = 'rgba(255,244,200,.9)';
    ctx.fillRect(s.x+8.5+Math.cos(a)*14-1, y+3+Math.sin(a)*10-1, 2, 2);
  }
  ctx.fillStyle='#efe4c8'; ctx.fillRect(s.x+6, y+4, 5, 9);
  ctx.fillStyle='#ffd75e';
  ctx.beginPath(); ctx.moveTo(s.x-1, y+6);
  ctx.quadraticCurveTo(s.x+8.5, y-7, s.x+18, y+6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff7d9'; ctx.fillRect(s.x+4,y+1,2.6,2.6); ctx.fillRect(s.x+11,y,2.6,2.6);
}

// ---- Knysna loerie: Hogsback staple and pure scenery. Green bird, and the whole point
// of it is the crimson flash under the wings when it beats. Never collides with anything.
// Draw order matters: both wings go BEHIND the green body, so the red on the downstroke
// only peeks as a flash below the bird rather than covering the body. On the upstroke the
// wing folds up and mostly disappears behind the body — a thin green strip above.
function drawLoerie(x, y, tNow){
  const flap = Math.sin(tNow/95);            // -1 upstroke .. +1 downstroke
  const down = flap > 0;
  const wingDrop = 1 + flap * 8;             // where the wing sits this beat
  const wingFlare = 12 + (down ? flap*4 : 0);
  ctx.save();
  ctx.translate(x, y);
  // long loerie tail (turaco)
  ctx.strokeStyle='#2f7a41'; ctx.lineWidth=3.6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-9,1); ctx.quadraticCurveTo(-26,-2,-36,6); ctx.stroke();
  // far wing (mostly hidden behind body, peeks as a green edge on the upstroke)
  ctx.fillStyle = down ? '#255630' : '#2f6b3a';
  ctx.beginPath(); ctx.ellipse(1, wingDrop-1, wingFlare-2, 3.5, .15 + flap*.3, 0, 7); ctx.fill();
  // near wing — THIS is the flash. On the downstroke it drops below the body and the
  // crimson underside is the whole point of the bird.
  ctx.fillStyle = down ? '#b3242a' : '#2f6b3a';
  ctx.beginPath(); ctx.ellipse(2, wingDrop+2, wingFlare, 4, .2 + flap*.35, 0, 7); ctx.fill();
  // body — always on top, always green, this is the main read
  ctx.fillStyle='#2f7a41';
  ctx.beginPath(); ctx.ellipse(0,0,11,6.6,-.06,0,7); ctx.fill();
  // head + crest
  ctx.fillStyle='#2b7040';
  ctx.beginPath(); ctx.arc(10,-3,5.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(7,-7); ctx.lineTo(9.2,-12.5); ctx.lineTo(12.2,-7); ctx.closePath(); ctx.fill();
  // eye (yellow ring + black pupil — loerie has a striking eye)
  ctx.fillStyle='#e0d24a'; ctx.beginPath(); ctx.arc(11.4,-4,2.5,0,7); ctx.fill();
  ctx.fillStyle='#1d1f26'; ctx.beginPath(); ctx.arc(11.6,-4,1.2,0,7); ctx.fill();
  // hooked red bill
  ctx.fillStyle='#c2352b';
  ctx.beginPath(); ctx.moveTo(14.2,-3.4); ctx.quadraticCurveTo(19.6,-2.4,15.8,.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function loerieCall(){                       // the "kwa-kwa-kwa" you hear before you see him
  beep(760,430,.16,'triangle');
  setTimeout(()=>beep(700,400,.15,'triangle'),190);
  setTimeout(()=>beep(660,360,.18,'triangle'),380);
}
// ---- landmarks: wooden signs at real Hogsback spots ----
function drawSigns(){
  ctx.font='bold 10px monospace'; ctx.textAlign='center';
  for(const [m,label] of LANDMARKS){
    const sx = 60 + m*10 - trav;
    if(sx < -110 || sx > W+30) continue;
    ctx.fillStyle='#5a4630'; ctx.fillRect(sx+50,GROUND-46,5,46);
    ctx.fillStyle='#c9b184'; ctx.fillRect(sx,GROUND-64,106,22);
    ctx.strokeStyle='#8a744f'; ctx.strokeRect(sx+.5,GROUND-63.5,105,21);
    ctx.fillStyle='#4a3a24'; ctx.fillText(label,sx+53,GROUND-50);
  }
  ctx.textAlign='left';
}

// ---- sound (tiny, lazy, gesture-unlocked) ----
let AC=null;
function beep(f0,f1,t,type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f0,n);
    o.frequency.exponentialRampToValueAtTime(f1,n+t);
    g.gain.setValueAtTime(.08,n); g.gain.exponentialRampToValueAtTime(.001,n+t);
    o.connect(g).connect(AC.destination); o.start(n); o.stop(n+t);
  }catch(e){}
}

// ---- loop ----
// v5.0: fromStop = a STOPS entry (continue run, tour rules) or null (ranked run from 0).
function reset(fromStop){
  tourRun = !!fromStop;
  if(fromStop){
    runStart = fromStop.m;            // world position = the stop; distance counts from 0
    trav = fromStop.m*10;             // trav is decimetres-ish px domain: 10 px per metre
  } else { runStart = 0; trav = 0; }
  meters = 0;
  state='run'; speed=tourRun ? 330*.85 : 330;   // continue spawn: slight ease-in tween
  vy=0; hogY=GROUND; jumping=false;
  obs=[]; nextGap=420; mist=null; wxTimer=22; wxCount=0; lmIdx=0; nextAmb=170; toast=null;
  shrooms=[]; nextShroom=900; sCount=0; queuedAt=-1e9;
  spawnGrace = tourRun ? 2.0 : 0.45;          // 2 s clear runway on a continue, brief warm-up from 0
  floaters=[]; deathCause=''; prevKind=''; bird=null; nextBird=7; permits=0;
  // fast-forward the landmark/weather cursors so the tour run starts in the right scenery:
  while(lmIdx<LANDMARKS.length && LANDMARKS[lmIdx][0] <= runStart) lmIdx++;
  wxTimer = 10+Math.random()*8;               // first weather arrives late — spawn is calm
  try{ document.getElementById('sh').hidden = true; document.getElementById('nm').hidden = true; document.body.classList.remove('has-nm'); }catch(e){}
}
async function fetchBoard(force){
  if(board && !force && performance.now()-boardAt<60000) return board;
  try{ const r=await fetch(API); if(!r.ok) return board; board=await r.json(); boardAt=performance.now(); return board; }
  catch(e){ return board; }
}
function refreshQualify(b){
  const w=(b && b.weekly)||[];
  const nm=document.getElementById('nm');
  qualify = w.length<10 || (runStart+meters) > ((w[w.length-1]||{m:0}).m);
  if(state==='dead' && qualify && !(posted && meters<=lastPostedM)){ nm.hidden=false; prefillName(); }
  else nm.hidden=true;
  // v5.4: body flag — while the name box is up, CSS hides the share button (landscape phones:
  // the two overlays stacked and covered the restart buttons)
  try{ document.body.classList.toggle('has-nm', !nm.hidden); }catch(e){}

function die(kind, variant){

    // ~2.4 km — the moment speed capped — and that plateau is why good runs never end.
    // Two separate curves, because they saturate for different reasons:
    //   ramp    = mix shift. v4 saturated at 12 km (felt too gentle past 20). v4.2
    //             (owner: "getting more difficult as the game progresses is good")
    //             stretches to 30 km so the kind mix keeps shifting past the old
    //             plateau. Steepened weights too (.80 hard at r=1 vs .58).
    //   tighten = gap shrink. v4 saturated at 20 km. v4.2 stretches to 60 km so a
    //             strong runner still sees the gaps tighten past the old plateau.
    // KNOBs: the 30000, the 60000, the weight slopes, and the .20.
    // v5.0: curves key off the ABSOLUTE world position (runStart+meters) so a continue
    // from 17 711 m spawns at 17 711 m difficulty — that is the whole point.

    const tighten = Math.min(worldM/60000, 1);

      // v5.4: landscape phones give the canvas only ~360 px of height — the panel is
      // COMPACT (top-anchored, tighter leading) and the restart buttons stay in the
      // 130-260 band, clear of the DOM name/share boxes pinned to the bottom edge.
      ctx.fillStyle='rgba(20,29,56,.88)';
      const cause = 'You were killed by ' + deathCause + '.';
      ctx.font='bold 14px system-ui';
      const cw = Math.max(360, Math.min(W-20, ctx.measureText(cause).width+44));
      ctx.fillRect(W/2-cw/2,46,cw,96);
      ctx.fillStyle='#ffe9a8'; ctx.font='bold 22px system-ui'; ctx.textAlign='center';
      ctx.fillText(deathHead, W/2, 72);
      ctx.fillStyle='#fff'; ctx.font='bold 13px system-ui';
      ctx.fillText(cause, W/2, 92);
      ctx.fillStyle='#cdd6ee'; ctx.font='13px monospace';
      ctx.fillText(`${runStart+meters} m   ·   HI ${hi} m   ·   🍄 ${pocket}`, W/2, 110);
      ctx.fillStyle='#ffd75e'; ctx.font='bold 11px monospace';
      ctx.fillText('🍄 buy restarts at the stops you passed — and the next lap permit', W/2, 126);
      // v5.3/v5.4: RESTART BUTTONS — up to three, deepest first, always inside the canvas
      // band above the DOM overlays. Affordable stops are live buttons; deeper ones are
      // greyed with the shortfall so players learn that more 🍄 = restart higher.
      contHits = [];
      if(contOptions.length && state==='dead' && deathHead!=='NO PERMIT' && deathHead!=='MAYOR!'){
        ctx.fillStyle='#ffffff'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
        ctx.fillText('WAKE UP AT…', W/2, 142);
        let byy = 148;
        for(const o of contOptions){
          const bl = o.stop.label+' — '+o.stop.cost+' 🍄' + (o.afford ? '' : '  (need '+o.short+' more)');
          ctx.font='bold 13px system-ui';
          const bw = Math.max(300, Math.min(W-24, ctx.measureText(bl).width+36)), bh=26;
          const bx = W/2-bw/2;
          ctx.globalAlpha = 1;
          if(o.afford){
            ctx.fillStyle='rgba(88,60,110,.97)'; ctx.fillRect(bx,byy,bw,bh);
            ctx.strokeStyle='#e8c8ff'; ctx.lineWidth=2; ctx.strokeRect(bx+1,byy+1,bw-2,bh-2);
            ctx.fillStyle='#ffffff'; ctx.fillText(bl, W/2, byy+18);
          } else {
            ctx.fillStyle='rgba(30,36,58,.92)'; ctx.fillRect(bx,byy,bw,bh);
            ctx.strokeStyle='#3a4a78'; ctx.lineWidth=1.5; ctx.strokeRect(bx+1,byy+1,bw-2,bh-2);
            ctx.fillStyle='#8f9bbd'; ctx.fillText(bl, W/2, byy+18);
          }
          contHits.push({x0:bx, y0:byy, x1:bx+bw, y1:byy+bh, opt:o});
          byy += bh+6;
        }
        ctx.fillStyle='#cdd6ee'; ctx.font='10px monospace';
        ctx.fillText('tap a stop to wake there · anywhere else banks your distance', W/2, byy+7);
        byy += 14;
      } else {
        ctx.font='13px system-ui'; ctx.globalAlpha=pulse; ctx.textAlign='center';
        ctx.fillText(tourRun ? 'tap to wake up at the same stop (free)' : 'tap to try again', W/2, 150);
        ctx.globalAlpha=1;
      }
      drawBoard(Math.max(200, (contHits.length ? contHits[contHits.length-1].y1+18 : 0)));
    }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
  ctx.restore();
  requestAnimationFrame(tick);
}
function drawBoard(topMin){
  if(!board || !board.weekly || !board.weekly.length) return;
  const list=board.weekly;
  ctx.textAlign='center';
  // v5.0.1: below ALL death-screen UI. v5.3: pushed further down if three restart buttons
  // are showing — topMin is the lowest pixel the buttons (plus their hint line) reached.
  const by0 = Math.max(190, topMin||0);
  ctx.fillStyle='rgba(20,29,56,.82)';
  ctx.fillRect(W/2-160,by0,320,22+list.length*12);
  ctx.fillStyle='#ffe9a8'; ctx.font='bold 11px monospace';
  ctx.fillText('TOP 10 · '+board.week, W/2, by0+15);
  ctx.font='11px monospace';
  list.forEach((r,i)=>{
    const nm=r.n.length>14?r.n.slice(0,13)+'…':r.n;
    ctx.fillStyle = i===0?'#ffd75e':'#cdd6ee';
    ctx.fillText((i+1)+'. '+nm+' — '+r.m+' m', W/2, by0+29+i*12);
  });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) last=performance.now(); });
requestAnimationFrame(tick);
</script>
</body>
</html>
