<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>404 · Hog's Back Run — WildLogic</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐗</text></svg>">
<style>
  html,body{margin:0;height:100%;background:#bfe0f2;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,1040px);height:auto;display:block}
  #home{position:fixed;top:10px;left:12px;color:#23405c;text-decoration:none;font-size:15px;opacity:.7;z-index:2}
</style>
</head>
<body>
<a id="home" href="/">&#8592; wildlogic.co.za</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* PURPOSE: wildlogic.co.za custom 404 easter egg — "Hog's Back Run", a dino-class
   endless runner starring the WildLogic hog along his own ridge. Vanilla canvas,
   one file, no deps. Signature twist: Hogsback mist banks periodically obscure
   the track. High score in localStorage('hogback_hi'). */
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 900, H = 360, GROUND = 296;
const DPR = Math.min(devicePixelRatio || 1, 2);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);

const DAY  = { sky:'#bfe0f2', far:'#8fb6cf', near:'#5e8aa6', ground:'#c8a86a', line:'#a98f57' };
const NIGHT= { sky:'#141d38', far:'#232f52', near:'#1a2542', ground:'#3a3f63', line:'#2e3352' };
const GRAV = 2700, JUMPV = -567;          // 420ms airtime, ~60px apex (mobile-tuned)
const LOGY = GROUND - 66, LOGH = 38;      // fallen yellowwood: slide-only gap
const LANDMARKS = [
  [60,   'THE EDGE',         'Welkom by die Edge — hou daai voete!'],
  [150,  '39 STEPS FALLS',   '39 trappies op — moenie afkyk nie!'],
  [300,  'MADONNA & CHILD',  "Ag nee, hier's weer daai waterval!"],
  [500,  'DUSK',             'Jislaaik, dis donker soos in die kloof.'],
  [600,  'THE BIG TREE',     'Daai boom is ouer as Oom self.'],
  [1000, 'THE LABYRINTH',    'Moenie verdwaal nie, vark.'],
];
const AMBIENT = [
  'Nee man, kyk uit vir die aalwyne!',
  'Pasop vir daai sampioen!',
  'Hier bly die fairies, moenie trap nie',
  'Loop, vark, loop!',
  'Die varke is wakker vandag.',
  'Lekker loop, boet!',
];
const MISLINE = 'Haai, dis mis, dis nie rook nie!';

let state = 'ready', speed = 330, trav = 0, meters = 0, hi = +(localStorage.getItem('hogback_hi')||0);
let hogY = GROUND, vy = 0, jumping = false, obs = [], nextGap = 420, deadAt = 0;
let mistTimer = 12, mist = null; // {age,dur}
let lmIdx = 0, nextAmb = 170;
let toast = null, last = performance.now();
const stars = Array.from({length:70}, () => [Math.random()*W, Math.random()*GROUND*.65, Math.random()]);

// ---- hog sprite: pixel body (faces right) + animated legs ----
const HB = [
'...............B..B.....',
'..T...........BBBBBB....',
'.BT...........BBBBBBB...',
'..B..........BBBBBBBB...',
'...BBBBBBBBBBBBBBBBBBB..',
'..BBBBBBBBBBBBBBBBBBBBB.',
'..BBBBBBBBBBBBBBBBBBBBWW',
];
const CELL = 3, HW = HB[0].length * CELL, HH = HB.length * CELL;

function drawHog(x, phase, squash){
  ctx.save();
  if(squash){ ctx.translate(x+HW/2, GROUND); ctx.scale(1,.5); ctx.translate(-(x+HW/2), -GROUND); }
  const top = hogY - HH - 14;
  ctx.fillStyle = '#33313b';
  for(let r=0;r<HB.length;r++) for(let c=0;c<HB[r].length;c++){
    const ch = HB[r][c]; if(ch==='.') continue;
    if(ch==='W'){ ctx.fillStyle='#efe9dd'; ctx.fillRect(x+c*CELL, top+r*CELL, CELL, CELL); ctx.fillStyle='#33313b'; }
    else if(ch==='T'){ ctx.fillRect(x+c*CELL, top+r*CELL+Math.sin(phase)*1.5, CELL, CELL); }
    else ctx.fillRect(x+c*CELL, top+r*CELL, CELL, CELL);
  }
  // four trotting legs
  const lb = top + HH - 2, amp = jumping ? 0 : (squash ? 2 : 4);
  [[8,-1],[16,1],[44,-1],[52,1]].forEach(([lx,dir],i)=>{
    const sw = Math.sin(phase + i*Math.PI/2) * amp * dir;
    ctx.fillRect(x+lx, lb, 5, 16+sw);
  });
  ctx.restore();
}

// ---- obstacles ----
function spawn(){
  let roll = Math.random();
  if(meters < 120) roll *= .7;            // fallen logs only after the player has warmed up
  let o;
  if(roll < .30){
    const n = Math.random() < .3 ? 2 : 1;
    o = {kind:'aloe', n, x:W+40, w:n===2?74:34, h:(n===2?30:34)+Math.random()*8};
  } else if(roll < .55){
    o = {kind:'stump', x:W+40, w:44+Math.random()*14, h:22+Math.random()*6};
  } else if(roll < .75){
    o = {kind:'toad', x:W+40, w:34, h:24+Math.random()*6};
  } else {
    o = {kind:'log', x:W+40, w:86, h:LOGH};
  }
  obs.push(o);
}
function drawObstacle(o){
  const gy = GROUND;
  if(o.kind==='stump'){
    ctx.fillStyle='#6e5638';
    ctx.beginPath(); ctx.moveTo(o.x,gy);
    ctx.quadraticCurveTo(o.x+o.w*.06,gy-o.h,o.x+o.w*.3,gy-o.h);
    ctx.lineTo(o.x+o.w*.72,gy-o.h*.96);
    ctx.quadraticCurveTo(o.x+o.w*.95,gy-o.h*.9,o.x+o.w,gy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#57432a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,gy-o.h,o.w*.3,3.4,0,0,7); ctx.stroke();
    ctx.fillStyle='#5c8a4a';                       // moss cap
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.34,gy-o.h-1,o.w*.26,4.5,-.12,0,7); ctx.fill();
    ctx.lineWidth=1;
  } else if(o.kind==='toad'){
    const ch=o.h;
    ctx.fillStyle='#efe4c8'; ctx.fillRect(o.x+13,gy-ch*.62,8,ch*.62);   // stem
    ctx.fillStyle='#c23b2e';                                            // red cap
    ctx.beginPath(); ctx.moveTo(o.x+2,gy-ch*.58);
    ctx.quadraticCurveTo(o.x+17,gy-ch-6,o.x+32,gy-ch*.58);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f7f1e4';
    [[10,-ch*.72],[20,-ch*.86],[26,-ch*.66]].forEach(([dx,dy])=>ctx.fillRect(o.x+dx,gy+dy,3.5,3));
  } else if(o.kind==='log'){
    ctx.fillStyle='#77593a'; ctx.fillRect(o.x,LOGY,o.w,LOGH);
    ctx.strokeStyle='#5d4529';
    for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(o.x+4,LOGY+i*6.3); ctx.lineTo(o.x+o.w-4,LOGY+i*6.3); ctx.stroke(); }
    ctx.fillStyle='#8a6845'; ctx.beginPath(); ctx.arc(o.x+o.w-7,LOGY+LOGH/2,LOGH/2-4,0,7); ctx.fill();
    ctx.fillStyle='#5c8a4a';                        // moss along the top
    ctx.fillRect(o.x+6,LOGY-3,o.w*.55,5);
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.78,LOGY-2,14,4,.08,0,7); ctx.fill();
  } else {
    for(let i=0;i<(o.n||1);i++){
      const bx=o.x+i*40, bh=o.h-(i?4:0);
      ctx.strokeStyle='#4c8b4c'; ctx.lineWidth=5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(bx+17,gy); ctx.lineTo(bx+17,gy-bh*.55); ctx.stroke();
      for(let L=0;L<5;L++){
        const a=-Math.PI/2 + (L-2)*.42;
        ctx.beginPath(); ctx.moveTo(bx+17,gy-bh*.5);
        ctx.quadraticCurveTo(bx+17+Math.cos(a)*bh*.42, gy-bh*.5+Math.sin(a)*bh*.5,
                             bx+17+Math.cos(a)*bh*.72, gy-bh*.5+Math.sin(a)*bh*.78);
        ctx.stroke();
      }
      ctx.lineWidth=1;
    }
  }
}

// ---- palette lerp / backdrop ----
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,k){ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`; }

function backdrop(k){
  ctx.fillStyle = mix(DAY.sky,NIGHT.sky,k); ctx.fillRect(0,0,W,H);
  if(k>.02){ ctx.fillStyle=`rgba(255,255,240,${k})`;
    stars.forEach(([sx,sy,r])=>ctx.fillRect(sx,sy,1+r*1.6,1+r*1.6));
    ctx.fillStyle=`rgba(245,240,215,${.9*k})`;
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
    ctx.fillStyle=mix(DAY.sky,NIGHT.sky,k);
    ctx.beginPath(); ctx.arc(780,58,18,0,7); ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,244,214,.9)';
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
  }
  const off = trav*.15 % 480;
  ctx.fillStyle = mix(DAY.far,NIGHT.far,k);
  for(let i=-1;i<3;i++){ const bx=i*480-off;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+120,118,bx+240,GROUND);
    ctx.quadraticCurveTo(bx+330,150,bx+430,GROUND); ctx.fill(); }
  const off2 = trav*.35 % 380;
  ctx.fillStyle = mix(DAY.near,NIGHT.near,k);
  for(let i=-1;i<4;i++){ const bx=i*380-off2;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+95,196,bx+190,GROUND);
    ctx.quadraticCurveTo(bx+270,225,bx+350,GROUND); ctx.fill(); }
  ctx.fillStyle = mix(DAY.ground,NIGHT.ground,k);
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle = mix(DAY.line,NIGHT.line,k); ctx.fillRect(0,GROUND,W,2);
  ctx.fillStyle = mix('#b0965c','#333757',k);
  for(let i=0;i<14;i++){ const gx=(i*97 - (trav%97)); ctx.fillRect(gx,GROUND+8+((i*53)%3)*9,7,2); }
}

// ---- mist (Hogsback style: brief, soft, and the fairies show you the lane) ----
function drawMist(tNow){
  if(!mist) return;
  const p = Math.min(mist.age/mist.dur,1);
  const cxp = W*(1.25 - 1.5*p);
  const g = ctx.createLinearGradient(cxp-W*.33,0,cxp+W*.33,0);
  g.addColorStop(0,'rgba(235,240,244,0)');
  g.addColorStop(.5,'rgba(235,240,244,.6)');
  g.addColorStop(1,'rgba(235,240,244,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(230,236,240,${.12*Math.sin(p*Math.PI)})`; ctx.fillRect(0,0,W,H);
  if(p<1){
    for(const o of obs){
      if(o.x<-20 || o.x>W+40) continue;
      const cy = GROUND-(o.kind==='log'?LOGH+18:o.h)-14;
      for(let i=0;i<3;i++){
        const a=.45+.4*Math.sin(tNow/130+i*2.1+o.x*.01);
        ctx.fillStyle=`rgba(255,226,122,${a})`;
        ctx.beginPath();
        ctx.arc(o.x+o.w/2+(i-1)*14, cy+(i===1?-8:0), 2.2, 0, 7);
        ctx.fill();
      }
    }
  }
}

// ---- landmarks: wooden signs at real Hogsback spots ----
function drawSigns(){
  ctx.font='bold 10px monospace'; ctx.textAlign='center';
  for(const [m,label] of LANDMARKS){
    const sx = 60 + m*10 - trav;
    if(sx < -110 || sx > W+30) continue;
    ctx.fillStyle='#5a4630'; ctx.fillRect(sx+50,GROUND-46,5,46);
    ctx.fillStyle='#c9b184'; ctx.fillRect(sx,GROUND-64,106,22);
    ctx.strokeStyle='#8a744f'; ctx.strokeRect(sx+.5,GROUND-63.5,105,21);
    ctx.fillStyle='#4a3a24'; ctx.fillText(label,sx+53,GROUND-50);
  }
  ctx.textAlign='left';
}

// ---- sound (tiny, lazy, gesture-unlocked) ----
let AC=null;
function beep(f0,f1,t,type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f0,n);
    o.frequency.exponentialRampToValueAtTime(f1,n+t);
    g.gain.setValueAtTime(.08,n); g.gain.exponentialRampToValueAtTime(.001,n+t);
    o.connect(g).connect(AC.destination); o.start(n); o.stop(n+t);
  }catch(e){}
}

// ---- loop ----
function reset(){
  state='run'; speed=330; trav=0; meters=0; vy=0; hogY=GROUND; jumping=false;
  obs=[]; nextGap=420; mist=null; mistTimer=12; lmIdx=0; nextAmb=170; toast=null;
}
function die(){
  state='dead'; deadAt=performance.now(); beep(160,70,.28,'sawtooth');
  if(meters>hi){ hi=meters; localStorage.setItem('hogback_hi',hi); }
}
function jump(){
  if(state!=='run') return;
  if(!jumping && !slideHeld){ vy=JUMPV; jumping=true; beep(440,660,.09); }
}
function act(){
  if(state==='ready') reset();
  else if(state==='dead' && performance.now()-deadAt>450) reset();
  else jump();
}
let slideHeld=false;
addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); act(); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); slideHeld=true; }
});
addEventListener('keyup', e=>{
  if(e.code==='ArrowDown'||e.code==='KeyS') slideHeld=false;
});
let pStartY=null;
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); pStartY=e.clientY; act(); });
cv.addEventListener('pointermove', e=>{
  if(pStartY!==null && e.clientY-pStartY>26) slideHeld=true;
});
['pointerup','pointercancel'].forEach(ev =>
  cv.addEventListener(ev, ()=>{ pStartY=null; slideHeld=false; }));

function tick(now){
  const dt = Math.min((now-last)/1000,.05); last=now;
  if(state==='run'){
    speed=Math.min(speed+8*dt,720); trav+=speed*dt; meters=Math.floor(trav/10);
    const sliding = slideHeld && !jumping && hogY>=GROUND;
    if(jumping){
      vy += (GRAV + (slideHeld ? 5200 : 0))*dt;   // down = fast-drop
      hogY += vy*dt;
      if(hogY>=GROUND){ hogY=GROUND; jumping=false; }
    }
    nextGap-=speed*dt;
    if(nextGap<=0){
      spawn();
      nextGap+=340+Math.random()*340+(obs[obs.length-1].kind==='log'?140:0);
    }
    for(const o of obs) o.x-=speed*dt;
    obs=obs.filter(o=>o.x>-140);
    // landmarks & Oom
    while(lmIdx<LANDMARKS.length && meters>=LANDMARKS[lmIdx][0]){
      toast={s:LANDMARKS[lmIdx][2],age:0}; beep(880,880,.09,'sine'); lmIdx++;
    }
    if(meters>=nextAmb){
      toast={s:AMBIENT[Math.floor(Math.random()*AMBIENT.length)],age:0};
      nextAmb=meters+160+Math.random()*160;
    }
    mistTimer-=dt;
    if(!mist && mistTimer<=0){
      mist={age:0,dur:2.4};
      if(Math.random()<.5 && !toast) toast={s:MISLINE,age:0};
    }
    if(mist){ mist.age+=dt; if(mist.age>mist.dur+1.6){ mist=null; mistTimer=18+Math.random()*4; } }
    // collision: forgiving AABB insets (squashed box while sliding)
    const hx = 70 + 8, hw = (sliding ? HW - 8 : HW - 28);
    const htop = sliding ? hogY - 15 : hogY - HH - 10, hh = sliding ? 13 : HH + 8;
    for(const o of obs){
      let ox, ow, otop, oh;
      if(o.kind==='log'){ ox=o.x+4; ow=o.w-8; otop=LOGY+4; oh=LOGH-8; }
      else { ox=o.x+5; ow=o.w-10; otop=GROUND-o.h+4; oh=o.h-4; }
      if(hx < ox+ow && hx+hw > ox && htop < otop+oh && htop+hh > otop){ die(); break; }
    }
  }
  if(toast){ toast.age+=dt; if(toast.age>2.4) toast=null; }

  // ---- render ----
  const k=Math.max(0,Math.min(1,(meters-500)/120));
  backdrop(k);
  drawSigns();
  obs.forEach(drawObstacle);
  drawHog(70, trav*.045, slideHeld && !jumping && hogY>=GROUND);
  drawMist(now);
  // HUD
  ctx.fillStyle = k>.5?'#cdd6ee':'#23405c';
  ctx.font='bold 16px monospace'; ctx.textAlign='right';
  ctx.fillText(String(Math.floor(trav/10)).padStart(4,'0')+' m', W-16, 30);
  ctx.font='12px monospace'; ctx.globalAlpha=.7;
  ctx.fillText('HI '+String(hi).padStart(4,'0'), W-16, 48);
  ctx.globalAlpha=1; ctx.textAlign='left';

  if(toast){
    const a=Math.min(1,toast.age/.25,(2.4-toast.age)/.5);
    ctx.globalAlpha=a; ctx.font='17px system-ui';
    const tw=ctx.measureText(toast.s).width;
    ctx.fillStyle='rgba(20,29,56,.82)';
    ctx.fillRect(W/2-tw/2-14,52,tw+28,34);
    ctx.fillStyle='#ffe9a8'; ctx.textAlign='center';
    ctx.fillText(toast.s,W/2,75); ctx.textAlign='left'; ctx.globalAlpha=1;
  }
  if(state!=='run'){
    const pulse=.65+.35*Math.sin(now/280);
    ctx.textAlign='center'; ctx.globalAlpha=pulse;
    if(state==='ready'){
      ctx.fillStyle='#23405c'; ctx.font='bold 30px system-ui';
      ctx.fillText("HOG'S BACK RUN", W/2, 108);
      ctx.font='16px system-ui'; ctx.globalAlpha=.85;
      ctx.fillText('404 — this page wandered into the mist.', W/2, 136);
      ctx.globalAlpha=pulse;
      ctx.fillText('tap / SPACE to run — hold ↓ or swipe down to slide', W/2, 162);
    } else {
      ctx.fillStyle='rgba(20,29,56,.88)';
      ctx.fillRect(W/2-170,84,340,110);
      ctx.fillStyle='#ffe9a8'; ctx.font='bold 22px system-ui';
      ctx.fillText('The hog found it first.', W/2, 122);
      ctx.fillStyle='#fff'; ctx.font='16px monospace';
      ctx.fillText(`${meters} m   ·   HI ${hi} m`, W/2, 152);
      ctx.font='15px system-ui'; ctx.globalAlpha=pulse;
      ctx.fillText('tap to try again', W/2, 178);
    }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
  requestAnimationFrame(tick);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) last=performance.now(); });
requestAnimationFrame(tick);
</script>
</body>
</html>
