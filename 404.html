<body>
<a id="home" href="/">&#8592; wildlogic.co.za</a>
<div id="wrap"><canvas id="cv"></canvas></div>
<button id="sh" hidden>⚔️ Challenge a chommie</button>
<div id="nm" hidden>
  <span>On the board? Name yourself:</span>
  <input id="ni" maxlength="14" placeholder="your name" autocomplete="off">
  <button id="ns">Yebo</button>
</div>
<script>
function shareFallback(t, done){
  const ta=document.createElement('textarea'); ta.value=t;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  document.body.removeChild(ta);
}
document.getElementById('sh').addEventListener('click', e=>{
  e.stopPropagation();
  const msg='I died from '+deathCause.replace(/\.\s+/g,', ')+' '+meters+' m into the Hogsback mist. Beat that: wildlogic.co.za/hogs-back-run';
  const done=()=>{ e.target.textContent='✓ Copied — go paste it on them';
    setTimeout(()=>{ e.target.textContent='⚔️ Challenge a chommie'; },1800); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(msg).then(done, ()=>shareFallback(msg,done));
    else shareFallback(msg,done);
  }catch(err){ shareFallback(msg,done); }
});
document.getElementById('ns').addEventListener('click', submitName);
document.getElementById('ni').addEventListener('keydown', e=>{ if(e.key==='Enter') submitName(); });
function submitName(){
  const name=(document.getElementById('ni').value||'').trim();
  if(!name) return;
  fetch(API,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({name:name,meters:meters,cause:deathCause})})
    .then(r=>r.json()).then(res=>{
      if(res.ok){
        posted=true; lastPostedM=meters;
        document.getElementById('nm').hidden=true;
        toast = res.weeklyRank
          ? {s:'Yebo — you are #'+res.weeklyRank+' this week!',age:0}
          : {s:"Didn't crack the top 10 this time — go again, boet.",age:0};
        fetchBoard(true).then(refreshQualify);
      }
    }).catch(()=>{});
}
/* PURPOSE: wildlogic.co.za custom 404 easter egg — "Hog's Back Run", a dino-class
   endless runner starring the WildLogic hog along his own ridge. Vanilla canvas,
   one file, no deps. Signature twist: Hogsback mist banks periodically obscure
   the track. High score in localStorage('hogback_hi'). */
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 900, H = 360, GROUND = 296;
const DPR = Math.min(devicePixelRatio || 1, 2);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);

const DAY  = { sky:'#bfe0f2', mtn:'#a8c8dd', mtn2:'#8fb0c8', far:'#8fb6cf', near:'#5e8aa6', ground:'#c8a86a', line:'#a98f57' };
const NIGHT= { sky:'#141d38', mtn:'#1c2745', mtn2:'#202c4e', far:'#232f52', near:'#1a2542', ground:'#3a3f63', line:'#2e3352' };
const GRAV = 2700, JUMPV = -640;          // ~470ms airtime, ~76px apex (mobile-tuned)
const LOGY = GROUND - 57, LOGH = 38;      // fallen yellowwood: must duck or jump (run-through blocked)
// Spaced for LONG runs — top scores are ~18 500 m, so landmarks run out to 17 500 m
// with widening gaps (the hog is faster later, so gaps grow with him).
const LANDMARKS = [
  [80,    'THE EDGE',         'Welkom by die Edge — hou daai voete!'],
  [260,   '39 STEPS FALLS',   '39 trappies op — moenie afkyk nie!'],
  [620,   'MADONNA & CHILD',  "Ag nee, hier's weer daai waterval!"],
  [1050,  'DUSK',             'Jislaaik, dis donker soos in die kloof.'],
  [1500,  'KETTLESPOUT',      'Kettlespout — daai pot kook al vandat Oom klein is.'],
  [2200,  'THE BIG TREE',     'Daai boom is ouer as Oom self.'],
  [3000,  'ARBORETUM',        'Die Arboretum — Oom ken elke boom op naam.'],
  [4000,  'TOR DOONE',        'Tor Doone — moenie alleen hier swem nie.'],
  [5200,  'SWALLOWTAIL',      'Swallowtail — 8 km dieper die kloof in. Sterkte.'],
  [6500,  'JIKANI',           'Jikani — die pad raak nou dun, vark.'],
  [8000,  'HOBBITON',         'Hobbiton — klein deure, groot vark.'],
  [9600,  'STARWAYS',         'Starways — kyk op, die sterre is beter hier.'],
  [11300, 'CAPE PARROT',      'Cape Parrot — hy lag vir jou, hy weet.'],
  [13200, 'FAIRY FOREST',     'Fairy Forest — trap nie op die sampioene nie.'],
  [15200, 'SUMMERTON',        'Summerton — amper by die end van die pad.'],
  [17500, 'THE LABYRINTH',    'Moenie verdwaal nie, vark.'],
];
const AMBIENT = [
  'Nee man, kyk uit vir die aalwyne!',
  'Pasop vir daai sampioen!',
  'Hier bly die fairies, moenie trap nie',
  'Loop, vark, loop!',
  'Die varke is wakker vandag.',
  'Lekker loop, boet!',
];
const MISLINE = 'Haai, dis mis, dis nie rook nie!';

let state = 'ready', speed = 330, trav = 0, meters = 0, hi = +(localStorage.getItem('hogback_hi')||0);
let hogY = GROUND, vy = 0, jumping = false, obs = [], nextGap = 420, deadAt = 0;
let mistTimer = 12, mist = null; // {age,dur}
let lmIdx = 0, nextAmb = 170;
let toast = null, last = performance.now();
let queuedAt = -1e9;        // buffered jump timestamp
let logHintShown = false;   // taught once per session, survives restarts
let shroomHintShown = false;
let deathCause = '', deathHead = '', shakeT = 0;
let floaters = [];          // {x,y,t} '+1' pickup puffs
const API='https://lb.wildlogic.co.za/scores';
let board=null, boardAt=0, qualify=false, posted=false, lastPostedM=0;
const stars = Array.from({length:70}, () => [Math.random()*W, Math.random()*GROUND*.65, Math.random()]);
const flies = Array.from({length:9}, () => [Math.random()*W, 60+Math.random()*(GROUND-90), Math.random()*7]);
let shrooms = [], nextShroom = 900, sCount = 0;   // 3 picked = the fairies open the mist
const WANT = (()=>{ try{
  const p = decodeURIComponent(location.pathname).replace(/[^a-zA-Z0-9\/\-. ]/g,'').slice(1,26).trim();
  if(p==='hogs-back-run') return "HOG'S BACK RUN";
  return p || 'This page';
}catch(e){ return 'This page'; }})();
// death-cause reveals — must read grammatically as "You were killed by <line>."
// and "I died from <line> <m> m into the mist"
const KILLERS = {
  aloe:  ['weed (the cops did the actual killing)', 'an aloe — not even the smokable kind',
          "weed. it was legal. you weren't", 'a seven-fingered leaf with an attitude',
          'hemp. tragically, the garden variety', 'a plant. a PLANT, boet',
          "dagga that didn't even get you high first", 'an aloe vera. moisturising and lethal',
          'a leaf. it did not move. you did'],
  toad:  ['way too many magic mushrooms', 'a mushroom. the fairies saw everything',
          'a mushroom that was NOT an edible, boet', 'a fun guy who was not, in fact, fun',
          'the red one. you know better', 'a toadstool. it warned you. it was red',
          'a trip you did not come back from', 'shrooms. should have asked Oom first',
          'three grams and a poor decision'],
  stump: ['a stump. a literal stump', 'firewood. it fought back',
          'the yellowwood. it usually wins', 'a tree that only lost the top half',
          'a stump — 800 years old and still standing', 'wood. entirely stationary wood',
          'a stump you have died on before', 'the remainder of a yellowwood',
          'something that has not moved since 1703'],
  log:   ['a fallen yellowwood (it fell in 1987)', 'skipping duck day',
          'oom told you to duck. oom sees everything', 'a log you elected not to duck',
          'refusing to bend, in the literal sense', 'the one thing Oom said to duck',
          'a tree trunk at exactly head height', 'not ducking. a bold strategy',
          'a log. you met it face-first'],
};
const HEADS = ['AG NEE','EISH','MOER TOG','YOH','Lekker.','HAIBO','JINNE','FOFIES','IS DIT'];

// ---- hog sprite: proper little boar, drawn from shapes (faces right) ----
const HW = 72, HH = 21;
const FUR='#33313b', SNOUT='#6e5f58', LIGHT='#efe9dd', HOOF='#17161c';

function drawHog(x, phase, squash){
  ctx.save();
  if(squash){ ctx.translate(x+HW/2, GROUND); ctx.scale(1,.5); ctx.translate(-(x+HW/2), -GROUND); }
  const top = hogY - HH - 14;
  // four trotting legs (two-part, with dark hooves)
  const amp = jumping ? 0 : (squash ? 2 : 4);
  [[10,-1],[19,1],[43,-1],[52,1]].forEach(([lx,dir],i)=>{
    const sw = Math.sin(phase + i*Math.PI/2) * amp * dir;
    ctx.fillStyle=FUR; ctx.fillRect(x+lx, top+22, 7, 12);
    ctx.fillRect(x+lx+1+sw*.6, top+30, 5, 6);
    ctx.fillStyle=HOOF; ctx.fillRect(x+lx+1+sw*.6, top+34, 5, 2);
  });
  // tail: thin curl off the rump
  ctx.strokeStyle=FUR; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+8,top+9);
  ctx.quadraticCurveTo(x-3,top+2,x+3,top-2); ctx.stroke();
  ctx.fillStyle=FUR; ctx.beginPath(); ctx.arc(x+3,top-2,2.2,0,7); ctx.fill();   // tuft
  // body: rump + barrel + shoulder hump read as one mass
  ctx.beginPath(); ctx.ellipse(x+16,top+15,12,10.5,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+34,top+16,27,12.5,-.04,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+47,top+11,13,9.5,-.1,0,7); ctx.fill();
  // head + raised snout
  ctx.beginPath(); ctx.ellipse(x+55,top+12,10,9,.05,0,7); ctx.fill();
  ctx.fillStyle=SNOUT; ctx.fillRect(x+61,top+8,11,9);
  ctx.fillStyle=HOOF; ctx.fillRect(x+69,top+11,2.5,3);           // nostril
  // tusk curling up past the jaw
  ctx.strokeStyle=LIGHT; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+62,top+17); ctx.quadraticCurveTo(x+65,top+12,x+63,top+10); ctx.stroke();
  // ear
  ctx.fillStyle=FUR;
  ctx.beginPath(); ctx.moveTo(x+47,top+4); ctx.lineTo(x+52,top-5); ctx.lineTo(x+57,top+3); ctx.closePath(); ctx.fill();
  // mane bristles along the back
  for(let i=0;i<4;i++){
    const mx=x+29+i*7;
    ctx.beginPath(); ctx.moveTo(mx,top+6); ctx.lineTo(mx+2.5,top-(i%2?5:7)); ctx.lineTo(mx+5,top+6); ctx.closePath(); ctx.fill();
  }
  // eye
  ctx.fillStyle=LIGHT; ctx.fillRect(x+56,top+9,2.6,2.6);
  ctx.lineWidth=1;
  ctx.restore();
}

// ---- obstacles ----
function spawn(){
  let roll = Math.random();
  if(meters < 120) roll *= .7;            // fallen logs only after the player has warmed up
  let o;
  if(roll < .30){
    const n = Math.random() < .22 ? 2 : 1;
    o = {kind:'aloe', n, x:W+40, w:n===2?54:34, h:(n===2?22:34)+Math.random()*6};
  } else if(roll < .55){
    o = {kind:'stump', x:W+40, w:44+Math.random()*14, h:22+Math.random()*6};
  } else if(roll < .75){
    o = {kind:'toad', x:W+40, w:34, h:24+Math.random()*6};
  } else {
    o = {kind:'log', x:W+40, w:86, h:LOGH};
  }
  obs.push(o);
}
function drawObstacle(o){
  const gy = GROUND;
  if(o.kind==='stump'){
    ctx.fillStyle='#6e5638';
    ctx.beginPath(); ctx.moveTo(o.x,gy);
    ctx.quadraticCurveTo(o.x+o.w*.06,gy-o.h,o.x+o.w*.3,gy-o.h);
    ctx.lineTo(o.x+o.w*.72,gy-o.h*.96);
    ctx.quadraticCurveTo(o.x+o.w*.95,gy-o.h*.9,o.x+o.w,gy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#57432a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(o.x+o.w/2,gy-o.h,o.w*.3,3.4,0,0,7); ctx.stroke();
    ctx.fillStyle='#5c8a4a';                       // moss cap
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.34,gy-o.h-1,o.w*.26,4.5,-.12,0,7); ctx.fill();
    ctx.lineWidth=1;
  } else if(o.kind==='toad'){
    const ch=o.h;
    ctx.fillStyle='#efe4c8'; ctx.fillRect(o.x+13,gy-ch*.62,8,ch*.62);   // stem
    ctx.fillStyle='#c23b2e';                                            // red cap
    ctx.beginPath(); ctx.moveTo(o.x+2,gy-ch*.58);
    ctx.quadraticCurveTo(o.x+17,gy-ch-6,o.x+32,gy-ch*.58);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f7f1e4';
    [[10,-ch*.72],[20,-ch*.86],[26,-ch*.66]].forEach(([dx,dy])=>ctx.fillRect(o.x+dx,gy+dy,3.5,3));
  } else if(o.kind==='log'){
    ctx.fillStyle='#77593a'; ctx.fillRect(o.x,LOGY,o.w,LOGH);
    ctx.strokeStyle='#5d4529';
    for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(o.x+4,LOGY+i*6.3); ctx.lineTo(o.x+o.w-4,LOGY+i*6.3); ctx.stroke(); }
    ctx.fillStyle='#8a6845'; ctx.beginPath(); ctx.arc(o.x+o.w-7,LOGY+LOGH/2,LOGH/2-4,0,7); ctx.fill();
    ctx.fillStyle='#5c8a4a';                        // moss along the top
    ctx.fillRect(o.x+6,LOGY-3,o.w*.55,5);
    ctx.beginPath(); ctx.ellipse(o.x+o.w*.78,LOGY-2,14,4,.08,0,7); ctx.fill();
  } else {
    for(let i=0;i<(o.n||1);i++){
      const bx=o.x+i*22+17, bh=o.h-(i?4:0);
      const base=gy-bh*.34;
      ctx.strokeStyle='#3f7d46'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(bx,gy); ctx.lineTo(bx,base); ctx.stroke();
      for(let L=0;L<7;L++){                        // seven-fingered dagga leaf
        const t=L/6-.5;
        const ang=-Math.PI/2 + t*2.5;
        const len=bh*.66*(1-Math.abs(t)*.72);
        const tx=bx+Math.cos(ang)*len, ty=base+Math.sin(ang)*len;
        const px=Math.cos(ang+Math.PI/2), py=Math.sin(ang+Math.PI/2), hw=len*.14;
        ctx.fillStyle='#43a04e';
        ctx.beginPath();
        ctx.moveTo(bx,base);
        ctx.quadraticCurveTo(bx+(tx-bx)*.45+px*hw, base+(ty-base)*.45+py*hw, tx,ty);
        ctx.quadraticCurveTo(bx+(tx-bx)*.45-px*hw, base+(ty-base)*.45-py*hw, bx,base);
        ctx.closePath(); ctx.fill();
        if(Math.abs(t)<.34){
          ctx.strokeStyle='rgba(16,58,28,.6)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(bx,base); ctx.lineTo(bx+(tx-bx)*.8, base+(ty-base)*.8); ctx.stroke();
        }
      }
      ctx.fillStyle='#2e6b38';                     // little nugs at the node
      ctx.beginPath(); ctx.arc(bx,base-1,2.4,0,7); ctx.fill();
      ctx.lineWidth=1;
    }
  }
}

// ---- palette lerp / backdrop ----
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,k){ const A=hex(a),B=hex(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`; }

function backdrop(k){
  ctx.fillStyle = mix(DAY.sky,NIGHT.sky,k); ctx.fillRect(0,0,W,H);
  if(k>.02){ ctx.fillStyle=`rgba(255,255,240,${k})`;
    stars.forEach(([sx,sy,r])=>ctx.fillRect(sx,sy,1+r*1.6,1+r*1.6));
    ctx.fillStyle=`rgba(245,240,215,${.9*k})`;
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
    ctx.fillStyle=mix(DAY.sky,NIGHT.sky,k);
    ctx.beginPath(); ctx.arc(780,58,18,0,7); ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,244,214,.9)';
    ctx.beginPath(); ctx.arc(790,64,22,0,7); ctx.fill();
  }
  // ---- distant mountain ranges: jagged peaks, slowest parallax, hazier with distance ----
  const offM = trav*.05 % 760;
  ctx.fillStyle = mix(DAY.mtn,NIGHT.mtn,k);
  for(let i=-1;i<3;i++){ const bx=i*760-offM;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.lineTo(bx+60,178);  ctx.lineTo(bx+108,214); ctx.lineTo(bx+170,132);
    ctx.lineTo(bx+214,186); ctx.lineTo(bx+268,108); ctx.lineTo(bx+330,176);
    ctx.lineTo(bx+392,150); ctx.lineTo(bx+455,196); ctx.lineTo(bx+516,120);
    ctx.lineTo(bx+580,182); ctx.lineTo(bx+648,146); ctx.lineTo(bx+712,200);
    ctx.lineTo(bx+760,GROUND); ctx.closePath(); ctx.fill(); }
  const offM2 = trav*.09 % 620;
  ctx.fillStyle = mix(DAY.mtn2,NIGHT.mtn2,k);
  for(let i=-1;i<3;i++){ const bx=i*620-offM2;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.lineTo(bx+52,208);  ctx.lineTo(bx+112,158); ctx.lineTo(bx+168,222);
    ctx.lineTo(bx+236,140); ctx.lineTo(bx+300,200); ctx.lineTo(bx+362,170);
    ctx.lineTo(bx+430,216); ctx.lineTo(bx+498,152); ctx.lineTo(bx+560,206);
    ctx.lineTo(bx+620,GROUND); ctx.closePath(); ctx.fill(); }
  if(k<.6){                                   // light catching the high peaks, fades into night
    ctx.fillStyle = `rgba(255,255,255,${.22*(1-k/.6)})`;
    for(let i=-1;i<3;i++){ const bx=i*620-offM2;
      [[112,158],[236,140],[498,152]].forEach(([px,py])=>{
        ctx.beginPath(); ctx.moveTo(bx+px,py);
        ctx.lineTo(bx+px+15,py+17); ctx.lineTo(bx+px-15,py+17);
        ctx.closePath(); ctx.fill(); }); }
  }
  const off = trav*.15 % 480;
  ctx.fillStyle = mix(DAY.far,NIGHT.far,k);
  for(let i=-1;i<3;i++){ const bx=i*480-off;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+120,118,bx+240,GROUND);
    ctx.quadraticCurveTo(bx+330,150,bx+430,GROUND); ctx.fill(); }
  const off2 = trav*.35 % 380;
  ctx.fillStyle = mix(DAY.near,NIGHT.near,k);
  for(let i=-1;i<4;i++){ const bx=i*380-off2;
    ctx.beginPath(); ctx.moveTo(bx,GROUND);
    ctx.quadraticCurveTo(bx+95,196,bx+190,GROUND);
    ctx.quadraticCurveTo(bx+270,225,bx+350,GROUND); ctx.fill(); }
  ctx.fillStyle = mix(DAY.ground,NIGHT.ground,k);
  ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle = mix(DAY.line,NIGHT.line,k); ctx.fillRect(0,GROUND,W,2);
  ctx.fillStyle = mix('#b0965c','#333757',k);
  for(let i=0;i<14;i++){ const gx=(i*97 - (trav%97)); ctx.fillRect(gx,GROUND+8+((i*53)%3)*9,7,2); }
}

// ---- waterfalls: canvas-drawn scenery at the waterfall landmarks (no image assets) ----
// One entry per waterfall landmark: w = spout width, h = drop height, jets = streams.
const WATERFALLS = [
  {m:260,  w:44, h:146, jets:2},   // 39 Steps Falls
  {m:620,  w:34, h:184, jets:2},   // Madonna & Child
  {m:1500, w:62, h:116, jets:1},   // Kettlespout
  {m:5200, w:36, h:206, jets:3},   // Swallowtail
];
// Long runs repeat the set so the tail past ~5 km is not empty scenery.
const FALLS_CYCLE = 6000;
const FALLS = [];
for (const f of WATERFALLS)
  for (let r = 0; r < 4; r++)
    FALLS.push({ m: f.m + r * FALLS_CYCLE, w: f.w * (1 + r * .1), h: f.h * (1 - r * .04), jets: f.jets });
// deterministic jitter: each fall's rock shape stays stable frame-to-frame instead of shimmering
function nse(s){ const x = Math.sin(s*127.1)*43758.5453; return x - Math.floor(x); }
function drawWaterfalls(k, tNow){
  for(const f of FALLS){
    const sx = 60 + f.m*10 + 210 - trav;        // sits just past its signpost
    if(sx < -260 || sx > W+220) continue;
    const baseY = GROUND - 2, topY = baseY - f.h;
    ctx.save();
    // ---- cliff: overlapping boulder masses — no straight edges, no concrete lip ----
    ctx.fillStyle = mix('#6d7482','#232a47',k);
    for(let i=0;i<7;i++){
      const t = i/6;
      const bx = sx + (nse(f.m*3+i*1.7)-.5)*f.w*0.55*(1-t*0.6);
      const by = baseY - t*(f.h+16);
      const rr = f.w*(0.60 - t*0.15) * (0.78 + nse(f.m*5+i*2.3)*0.5);
      ctx.beginPath(); ctx.ellipse(bx, by, rr, rr*1.12, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = mix('#565d6b','#1a2038',k);   // rock strata
    for(let i=0;i<4;i++){
      const t = 0.18 + i*0.19;
      const rr = f.w*(0.48 - t*0.09)*(0.7+nse(f.m*9+i*3.1)*0.45);
      ctx.beginPath();
      ctx.ellipse(sx + (nse(f.m*17+i)-.5)*f.w*0.42, baseY - t*(f.h+16), rr, rr*0.3, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = mix('#4e7a44','#1b3326',k);   // moss and ferns on the ledges
    for(let i=0;i<5;i++){
      const t = 0.12 + i*0.17;
      ctx.beginPath();
      ctx.ellipse(sx + (nse(f.m*23+i*1.3)-.5)*f.w*1.3, baseY - t*(f.h+16),
        f.w*0.24*(0.55+nse(f.m+i)*0.8), f.w*0.085, 0, 0, 7); ctx.fill();
    }
    // ---- water: narrow at the lip, spreading at the base, edges wobbling ----
    const wob = tNow/300;
    for(let j=0;j<f.jets;j++){
      const slot = f.w/f.jets;
      const jx = sx - f.w/2 + (j+.5)*slot + (nse(f.m+j*7)-.5)*slot*0.3;
      const wTop = slot*0.30, wBot = slot*0.56;
      ctx.fillStyle = mix('#e6f4fa','#4a6f96',k);
      ctx.beginPath();
      for(let i=0;i<=7;i++){
        const t=i/7, w=wTop+(wBot-wTop)*t;
        ctx.lineTo(jx - w/2 + Math.sin(wob + t*3.3 + j*1.7)*f.w*0.055*t, topY + t*(f.h-8));
      }
      for(let i=7;i>=0;i--){
        const t=i/7, w=wTop+(wBot-wTop)*t;
        ctx.lineTo(jx + w/2 + Math.sin(wob + t*2.9 + j*2.1)*f.w*0.055*t, topY + t*(f.h-8));
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = mix('#ffffff','#86aecd',k);
      ctx.globalAlpha=.45;
      for(let s=0;s<5;s++){
        const t=((s/5)+(tNow/520)%1)%1, w=wTop+(wBot-wTop)*t;
        ctx.fillRect(jx - w*0.28, topY + t*(f.h-14), w*0.56, 3 + t*5);
      }
      ctx.globalAlpha=1;
    }
    // ---- plunge pool, boulders, spray ----
    ctx.fillStyle = mix('#eef7fb','#55799f',k);
    ctx.beginPath(); ctx.ellipse(sx, baseY + 5, f.w, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = mix('#6d7482','#232a47',k);
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(sx + (i-1)*f.w*0.5 + (nse(f.m*31+i)-.5)*f.w*0.22, baseY + 2,
        f.w*0.17*(0.6+nse(f.m+i*5)*0.7), f.w*0.11, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,255,255,${.18+.14*Math.sin(tNow/240)})`;
    for(let i=0;i<8;i++){
      const px = sx + (nse(f.m*37+i)*2-1)*f.w*0.85;
      ctx.fillRect(px, baseY - 3 - ((tNow/10 + i*29) % 26), 2.5, 2.5);
    }
    ctx.restore();
  }
}

// ---- mist (Hogsback style: brief, soft, and the fairies show you the lane) ----
function drawMist(tNow){
  if(!mist) return;
  const p = Math.min(mist.age/mist.dur,1);
  const cxp = W*(1.25 - 1.5*p);
  const g = ctx.createLinearGradient(cxp-W*.33,0,cxp+W*.33,0);
  g.addColorStop(0,'rgba(235,240,244,0)');
  g.addColorStop(.5,'rgba(235,240,244,.6)');
  g.addColorStop(1,'rgba(235,240,244,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=`rgba(230,236,240,${.12*Math.sin(p*Math.PI)})`; ctx.fillRect(0,0,W,H);
  if(p<1){
    for(const o of obs){
      if(o.x<-20 || o.x>W+40) continue;
      const cy = GROUND-(o.kind==='log'?LOGH+18:o.h)-14;
      for(let i=0;i<3;i++){
        const a=.45+.4*Math.sin(tNow/130+i*2.1+o.x*.01);
        ctx.fillStyle=`rgba(255,226,122,${a})`;
        ctx.beginPath();
        ctx.arc(o.x+o.w/2+(i-1)*14, cy+(i===1?-8:0), 2.2, 0, 7);
        ctx.fill();
      }
    }
  }
}

// ---- collectable pine mushrooms (GOLD + glowing — the deadly ones are red) ----
function drawShroom(s, tNow){
  const bob = Math.sin(tNow/220 + s.x*.02)*3;
  const y = s.y + bob;
  const pulse = .25 + .15*Math.sin(tNow/180 + s.x*.05);
  ctx.fillStyle = `rgba(255,215,94,${pulse})`;                       // fairy-glow halo
  ctx.beginPath(); ctx.arc(s.x+8.5, y+3, 17, 0, 7); ctx.fill();
  for(let i=0;i<2;i++){                                              // orbiting sparkles
    const a = tNow/300 + i*Math.PI;
    ctx.fillStyle = 'rgba(255,244,200,.9)';
    ctx.fillRect(s.x+8.5+Math.cos(a)*14-1, y+3+Math.sin(a)*10-1, 2, 2);
  }
  ctx.fillStyle='#efe4c8'; ctx.fillRect(s.x+6, y+4, 5, 9);
  ctx.fillStyle='#ffd75e';
  ctx.beginPath(); ctx.moveTo(s.x-1, y+6);
  ctx.quadraticCurveTo(s.x+8.5, y-7, s.x+18, y+6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff7d9'; ctx.fillRect(s.x+4,y+1,2.6,2.6); ctx.fillRect(s.x+11,y,2.6,2.6);
}

// ---- landmarks: wooden signs at real Hogsback spots ----
function drawSigns(){
  ctx.font='bold 10px monospace'; ctx.textAlign='center';
  for(const [m,label] of LANDMARKS){
    const sx = 60 + m*10 - trav;
    if(sx < -110 || sx > W+30) continue;
    ctx.fillStyle='#5a4630'; ctx.fillRect(sx+50,GROUND-46,5,46);
    ctx.fillStyle='#c9b184'; ctx.fillRect(sx,GROUND-64,106,22);
    ctx.strokeStyle='#8a744f'; ctx.strokeRect(sx+.5,GROUND-63.5,105,21);
    ctx.fillStyle='#4a3a24'; ctx.fillText(label,sx+53,GROUND-50);
  }
  ctx.textAlign='left';
}

// ---- sound (tiny, lazy, gesture-unlocked) ----
let AC=null;
function beep(f0,f1,t,type){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), n=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f0,n);
    o.frequency.exponentialRampToValueAtTime(f1,n+t);
    g.gain.setValueAtTime(.08,n); g.gain.exponentialRampToValueAtTime(.001,n+t);
    o.connect(g).connect(AC.destination); o.start(n); o.stop(n+t);
  }catch(e){}
}

// ---- loop ----
function reset(){
  state='run'; speed=330; trav=0; meters=0; vy=0; hogY=GROUND; jumping=false;
  obs=[]; nextGap=420; mist=null; mistTimer=12; lmIdx=0; nextAmb=170; toast=null;
  shrooms=[]; nextShroom=900; sCount=0; queuedAt=-1e9;
  floaters=[]; deathCause='';
  try{ document.getElementById('sh').hidden = true; document.getElementById('nm').hidden = true; }catch(e){}
}
async function fetchBoard(force){
  if(board && !force && performance.now()-boardAt<60000) return board;
  try{ const r=await fetch(API); if(!r.ok) return board; board=await r.json(); boardAt=performance.now(); return board; }
  catch(e){ return board; }
}
function refreshQualify(b){
  const w=(b && b.weekly)||[];
  const nm=document.getElementById('nm');
  qualify = w.length<10 || meters > ((w[w.length-1]||{m:0}).m);
  if(state==='dead' && qualify && !(posted && meters<=lastPostedM)) nm.hidden=false;
  else nm.hidden=true;
}
function die(kind){
  const lines = KILLERS[kind];
  deathCause = lines ? lines[Math.floor(Math.random()*lines.length)] : 'the mist';
  deathHead = HEADS[Math.floor(Math.random()*HEADS.length)];
  state='dead'; deadAt=performance.now(); shakeT=.35; beep(160,70,.28,'sawtooth');
  if(meters>hi){ hi=meters; localStorage.setItem('hogback_hi',hi); }
  try{ document.getElementById('sh').hidden = false; }catch(e){}
  fetchBoard().then(refreshQualify).catch(()=>{});
}
function jump(){
  if(state!=='run') return;
  if(!jumping && !slideHeld){ vy=JUMPV; jumping=true; beep(440,660,.09); }
  else if(jumping) queuedAt = performance.now();   // buffer early taps
}
function act(){
  if(state==='ready') reset();
  else if(state==='dead' && performance.now()-deadAt>450) reset();
  else jump();
}
let slideHeld=false;
const isTyping = e => e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA');
addEventListener('keydown', e=>{
  if(isTyping(e)) return;
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); act(); }
  if(e.code==='ArrowDown'||e.code==='KeyS'){ e.preventDefault(); slideHeld=true; }
});
addEventListener('keyup', e=>{
  if(isTyping(e)) return;
  if(e.code==='ArrowDown'||e.code==='KeyS') slideHeld=false;
});
// ---- unified controls: keyboard, mouse and touch all drive the same two actions ----
// No touch-counting — that was the bug (a gap in finger timing re-fired jump as a hop).
// Two pads stack on the right, in the sky band, clear of the boar and the obstacle lane.
const BTN_R = 30, BTN_X = W - 78, BTN_JUMP_Y = 138, BTN_DUCK_Y = 206;
const DUCK_BAND = 266;                 // below this canvas-y = duck (mouse fallback)
const isTouch = (typeof matchMedia === 'function') && matchMedia('(pointer: coarse)').matches;
let jumpFlash = -1e9;                  // lights the JUMP pad briefly on press
function toCanvas(e){
  if(typeof cv.getBoundingClientRect !== 'function') return {x:-1,y:-1};
  const r = cv.getBoundingClientRect();
  if(!r.width || !r.height) return {x:-1,y:-1};
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
function onPad(p, cy){ const dx=p.x-BTN_X, dy=p.y-cy; return dx*dx + dy*dy <= BTN_R*BTN_R; }
const touches = new Map();
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const p = toCanvas(e);
  const rec = { y:e.clientY, duck:false };
  touches.set(e.pointerId, rec);
  if(onPad(p, BTN_DUCK_Y) || (p.y >= 0 && p.y > DUCK_BAND)){   // hold to duck
    slideHeld = true; rec.duck = true; return;
  }
  jumpFlash = performance.now();
  act();                                                        // tap/click to hop
});
cv.addEventListener('pointermove', e=>{
  const rec = touches.get(e.pointerId);
  if(rec && e.clientY - rec.y > 18){ slideHeld = true; rec.duck = true; }   // swipe-down still works
});
['pointerup','pointercancel'].forEach(ev =>
  cv.addEventListener(ev, e=>{
    touches.delete(e.pointerId);
    let holding = false;
    for(const v of touches.values()) if(v.duck) holding = true;  // another finger still ducking?
    if(!holding) slideHeld = false;
  }));
function drawControls(){
  ctx.save();
  const base = isTouch ? .20 : .12;
  [[BTN_JUMP_Y,'JUMP', performance.now()-jumpFlash < 130],
   [BTN_DUCK_Y,'DUCK', slideHeld]].forEach(([cy,label,lit])=>{
    ctx.beginPath(); ctx.arc(BTN_X, cy, BTN_R, 0, 7);
    ctx.fillStyle = `rgba(255,255,255,${lit ? base+.28 : base})`; ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${lit ? .8 : .38})`; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${lit ? .96 : .62})`;
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(label, BTN_X, cy + 4);
  });
  ctx.restore();
}

function tick(now){
  const dt = Math.min((now-last)/1000,.05); last=now;
  if(state==='run'){
    speed=Math.min(speed+8*dt,720); trav+=speed*dt; meters=Math.floor(trav/10);
    const sliding = slideHeld && !jumping && hogY>=GROUND;
    if(jumping){
      vy += (GRAV + (slideHeld ? 5200 : 0))*dt;   // down = fast-drop
      hogY += vy*dt;
      if(hogY>=GROUND){ hogY=GROUND; jumping=false; }
    }
    nextGap-=speed*dt;
    if(nextGap<=0){
      spawn();
      if(obs[obs.length-1].kind==='log'){
        nextGap+=140;
        if(!logHintShown){ logHintShown=true; toast={s:'Log! Hold the DUCK pad to slide under!',age:0}; }
      }
      nextGap+=340+Math.random()*340;
    }
    for(const o of obs) o.x-=speed*dt;
    obs=obs.filter(o=>o.x>-140);
    // landmarks & Oom
    while(lmIdx<LANDMARKS.length && meters>=LANDMARKS[lmIdx][0]){
      toast={s:LANDMARKS[lmIdx][2],age:0}; beep(880,880,.09,'sine'); lmIdx++;
    }
    if(meters>=nextAmb){
      toast={s:AMBIENT[Math.floor(Math.random()*AMBIENT.length)],age:0};
      nextAmb=meters+160+Math.random()*160;
    }
    mistTimer-=dt;
    if(!mist && mistTimer<=0){
      mist={age:0,dur:2.4};
      if(Math.random()<.5 && !toast) toast={s:MISLINE,age:0};
    }
    if(mist){ mist.age+=dt; if(mist.age>mist.dur+1.6){ mist=null; mistTimer=18+Math.random()*4; } }
    // collision: forgiving AABB insets (squashed box while sliding)
    const hx = 70 + 8, hw = (sliding ? HW - 8 : HW - 28);
    const htop = sliding ? hogY - 15 : hogY - HH - 10, hh = sliding ? 13 : HH + 8;
    for(const o of obs){
      let ox, ow, otop, oh;
      if(o.kind==='log'){ ox=o.x+4; ow=o.w-8; otop=LOGY+4; oh=LOGH-8; }
      else { ox=o.x+5; ow=o.w-10; otop=GROUND-o.h+4; oh=o.h-4; }
      if(hx < ox+ow && hx+hw > ox && htop < otop+oh && htop+hh > otop){ die(o.kind); break; }
    }
    // pine mushrooms: hop through them; 3 = fairies open the mist
    if(trav > nextShroom){
      const sx=W+30, sy=GROUND-46-Math.random()*54;
      if(obs.some(o=>Math.abs(o.x-sx)<80)) nextShroom=trav+120;
      else {
        shrooms.push({x:sx,y:sy}); nextShroom=trav+520+Math.random()*420;
        if(!shroomHintShown){ shroomHintShown=true; toast={s:'Goud sampioene maak die mis oop — rooies vermoor jou.',age:0}; }
      }
    }
    for(const s of shrooms) s.x-=speed*dt;
    shrooms=shrooms.filter(s=>s.x>-30 && !s.got);
    const hcx=hx+hw/2, hcy=sliding ? hogY-8 : hogY-HH/2-4;
    for(const s of shrooms){
      if(Math.abs(s.x+9-hcx)<26 && Math.abs(s.y+5-hcy)<32){
        s.got=true; sCount++; beep(1040,1320,.08,'sine');
        floaters.push({x:s.x+9,y:s.y-6,t:0});
        if(mist && sCount>=3){
          sCount-=3; mist=null; mistTimer=18+Math.random()*4;
          toast={s:'Die fairies maak die mis oop!',age:0}; beep(880,1400,.15,'sine');
        }
      }
    }
    // buffered jump: tapped slightly early still hops on landing
    if(!jumping && hogY>=GROUND && performance.now()-queuedAt<110 && !slideHeld){
      vy=JUMPV; jumping=true; beep(440,660,.09); queuedAt=-1e9;
    }
  }
  if(toast){ toast.age+=dt; if(toast.age>2.4) toast=null; }
  for(const f of floaters) f.t+=dt;
  floaters = floaters.filter(f=>f.t<.8);
  if(shakeT>0) shakeT-=dt;

  // ---- render ----
  ctx.save();
  if(shakeT>0){ const m=9*(shakeT/.35); ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m); }
  // day/night CYCLES every 2400 m (was: ramped to night at 620 m and stayed there forever)
  const k=.5-.5*Math.cos(meters/2400*6.2832);
  backdrop(k);
  drawWaterfalls(k, now);
  drawSigns();
  obs.forEach(drawObstacle);
  shrooms.forEach(s=>drawShroom(s, now));
  drawHog(70, trav*.045, slideHeld && !jumping && hogY>=GROUND);
  drawMist(now);
  for(const f of floaters){
    ctx.globalAlpha=1-f.t/.8; ctx.fillStyle='#ffd75e'; ctx.font='bold 13px monospace';
    ctx.fillText('+1', f.x, f.y - f.t*38);
  }
  ctx.globalAlpha=1;
  if(k>.5){                                    // night fireflies
    for(const [fx0,fy,ph] of flies){
      let fx=(fx0 - trav*.06)%W; if(fx<0)fx+=W;
      const a=k*(.35+.35*Math.sin(now/300+ph));
      ctx.fillStyle=`rgba(217,232,107,${a})`;
      ctx.fillRect(fx+Math.sin(now/700+ph)*16, fy+Math.cos(now/900+ph)*10, 2.4, 2.4);
    }
  }
  drawControls();
  // HUD
  ctx.fillStyle = k>.5?'#cdd6ee':'#23405c';
  ctx.font='bold 16px monospace'; ctx.textAlign='right';
  ctx.fillText(String(Math.floor(trav/10)).padStart(4,'0')+' m', W-16, 30);
  ctx.font='12px monospace'; ctx.globalAlpha=.7;
  ctx.fillText('HI '+String(hi).padStart(4,'0'), W-16, 48);
  if(sCount>0){ ctx.font='13px monospace'; ctx.fillText('🍄 '+sCount+'/3', W-16, 66); }
  ctx.globalAlpha=1; ctx.textAlign='left';

  if(toast){
    const a=Math.min(1,toast.age/.25,(2.4-toast.age)/.5);
    ctx.globalAlpha=a; ctx.font='17px system-ui';
    const tw=ctx.measureText(toast.s).width;
    ctx.fillStyle='rgba(20,29,56,.82)';
    ctx.fillRect(W/2-tw/2-14,52,tw+28,34);
    ctx.fillStyle='#ffe9a8'; ctx.textAlign='center';
    ctx.fillText(toast.s,W/2,75); ctx.textAlign='left'; ctx.globalAlpha=1;
  }
  if(state!=='run'){
    const pulse=.65+.35*Math.sin(now/280);
    ctx.textAlign='center'; ctx.globalAlpha=pulse;
    if(state==='ready'){
      ctx.fillStyle='#23405c'; ctx.font='bold 30px system-ui';
      ctx.fillText("HOG'S BACK RUN", W/2, 108);
      ctx.font='16px system-ui'; ctx.globalAlpha=.85;
      ctx.fillText('404 — '+WANT+' wandered into the mist.', W/2, 136);
      ctx.globalAlpha=pulse;
      ctx.fillText('click / tap = hop   ·   hold DUCK (or Down arrow) = slide', W/2, 162);
    } else {
      ctx.fillStyle='rgba(20,29,56,.88)';
      const cause = 'You were killed by ' + deathCause + '.';
      ctx.font='bold 15px system-ui';
      const cw = Math.max(360, ctx.measureText(cause).width+48);
      ctx.fillRect(W/2-cw/2,84,cw,116);
      ctx.fillStyle='#ffe9a8'; ctx.font='bold 26px system-ui'; ctx.textAlign='center';
      ctx.fillText(deathHead, W/2, 118);
      ctx.fillStyle='#fff'; ctx.font='bold 15px system-ui';
      ctx.fillText(cause, W/2, 144);
      ctx.fillStyle='#cdd6ee'; ctx.font='16px monospace';
      ctx.fillText(`${meters} m   ·   HI ${hi} m`, W/2, 168);
      ctx.font='15px system-ui'; ctx.globalAlpha=pulse;
      ctx.fillText('tap to try again', W/2, 190);
      drawBoard();
    }
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
  ctx.restore();
  requestAnimationFrame(tick);
}
function drawBoard(){
  if(!board || !board.weekly || !board.weekly.length) return;
  const list=board.weekly;
  ctx.textAlign='center';
  ctx.fillStyle='rgba(20,29,56,.82)';
  ctx.fillRect(W/2-160,200,320,24+list.length*13);
  ctx.fillStyle='#ffe9a8'; ctx.font='bold 12px monospace';
  ctx.fillText('TOP 10 · '+board.week, W/2, 216);
  ctx.font='12px monospace';
  list.forEach((r,i)=>{
    const nm=r.n.length>14?r.n.slice(0,13)+'…':r.n;
    ctx.fillStyle = i===0?'#ffd75e':'#cdd6ee';
    ctx.fillText((i+1)+'. '+nm+' — '+r.m+' m', W/2, 232+i*13);
  });
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) last=performance.now(); });
requestAnimationFrame(tick);
</script>
</body>
