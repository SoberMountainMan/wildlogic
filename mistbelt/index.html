<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mistbelt — grow back the Hogsback forest</title>
<meta name="description" content="Clear the alien trees off a Hogsback hillside, plant what belongs here, and watch the Amathole mistbelt forest return.">
<style>
  :root{
    --ink:#3b2a19; --ink2:#6b5537; --paper:#f4e8cd; --tan:#d8ae6b; --tan2:#b8873f;
    --blue:#cfe7ec; --green2:#5aa85a; --shadow:rgba(40,26,10,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#16241d;
    font:15px/1.45 ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
  #app{max-width:520px;margin:0 auto;background:#16241d}
  #stage{position:relative;width:100%;line-height:0}
  canvas#cv{display:block;width:100%;height:auto;touch-action:none;cursor:pointer}
  .ov{position:absolute;z-index:5}
  .wxpill{left:12px;top:12px;display:flex;align-items:center;gap:6px;line-height:1.2;
    background:rgba(255,255,255,.93);border-radius:999px;padding:5px 11px 5px 8px;
    box-shadow:0 2px 6px var(--shadow);font-size:12.5px;font-weight:700;color:#2f4a58}
  .tokens{left:12px;top:44px;display:flex;align-items:center;background:rgba(255,255,255,.95);
    border-radius:999px;padding:5px 6px;box-shadow:0 2px 6px var(--shadow);line-height:1}
  .tk{display:flex;align-items:center;gap:3px;padding:0 6px;font-size:13px;font-weight:800;color:#33424b}
  .tk svg{display:block}
  .gear{left:12px;top:80px;width:31px;height:31px;border-radius:10px;border:none;cursor:pointer;
    background:rgba(255,255,255,.95);box-shadow:0 2px 6px var(--shadow);color:#2f4a58;
    font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
  /* The bin button used to float inside #stage, where it sat on top of the bottom-left tile and
     hid it from the player's finger. It is an action, so it lives in the tool row now. */
  .dockwrap{display:flex;align-items:center;gap:8px;background:#16241d;padding:8px 10px 10px}
  .boxbtn{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:16px;border:none;cursor:pointer;
    background:#fff;box-shadow:0 3px 10px var(--shadow);display:flex;align-items:center;justify-content:center;padding:0}
  .boxbtn .badge{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:999px;
    background:var(--green2);color:#fff;font-size:11px;font-weight:800;display:flex;
    align-items:center;justify-content:center;padding:0 5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .boxbtn.ready{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion: reduce){.boxbtn.ready{animation:none}}

  .dock{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .dock::-webkit-scrollbar{display:none}
  .dock button{flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:800;color:#e8f0e6;
    background:#24382d;border:1.5px solid #34503f;border-radius:13px;padding:7px 11px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;line-height:1.2}
  .dock button span{font-size:10px;color:#8fae9b;font-weight:700}
  .dock button[aria-pressed="true"]{border-color:#7cc47c;background:#2f4c39}
  .dock button.cut[aria-pressed="true"]{border-color:#c9d45a;background:#3d4526}
  .dock button:disabled{opacity:.38}

  .modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(12,20,16,.62);line-height:1.45}
  .modal[hidden]{display:none}
  .sheet{width:100%;max-width:378px;max-height:88vh;overflow:auto;border-radius:22px;padding:16px;
    box-shadow:0 16px 44px rgba(0,0,0,.45)}
  .sheet.tan{background:#d8ae6b;border:3px solid #b8873f}
  .sheet.blue{background:#cfe7ec;border:3px solid #7fb3bf}
  .sheet h2{margin:0 0 2px;font-size:19px;font-weight:800;text-align:center}
  .sheet .sub{text-align:center;font-size:12.5px;color:#6b5537;margin:0 0 12px}
  .card-in{background:#f4e8cd;border-radius:15px;padding:13px}
  .sheet.blue .card-in{background:#fff}
  .task{display:flex;gap:9px;align-items:flex-start;margin-bottom:11px}
  .task .box{width:20px;height:20px;border-radius:6px;border:2px solid #a8905f;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#3f7a3f;font-weight:800;background:#fff}
  .task.done .box{background:#e6f4e6;border-color:#8fc98f}
  .task .body{flex:1;min-width:0}
  .task .label{font-size:13.5px;font-weight:700;margin-bottom:5px}
  .task.done .label{color:#6d8a6d}
  .bar{height:7px;border-radius:99px;background:#e2d6b6;overflow:hidden}
  .bar i{display:block;height:100%;background:#8fc98f;border-radius:99px;transition:width .2s}
  .reward{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:5px;
    font-size:16px;font-weight:800}
  /* A grid, not a row of three: with a fixed row of three the fourth species (knobwood) and the
     last two decorations could never be bought at all. They just wrap now. */
  .shoprow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .item{flex:1;background:#fff;border:2px solid #d6e6ea;border-radius:13px;padding:7px 4px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;color:#3a4b52;text-align:center}
  .item[aria-pressed="true"]{border-color:#5aa85a;background:#f2fbf2}
  .item canvas{width:46px;height:46px}
  .price{display:flex;align-items:center;gap:3px;font-size:12px}
  .buy{width:100%;border:none;border-radius:15px;padding:13px;font:inherit;font-size:16px;font-weight:800;
    color:#fff;background:#5aa85a;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .buy:disabled{background:#b6c6bd;cursor:default}
  .qty{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .qty b{font-size:13px;font-weight:800}
  .qty .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
  .qty .sp button{width:30px;height:30px;border-radius:9px;border:1.5px solid #9dc2ca;background:#fff;
    font:inherit;font-weight:800;cursor:pointer;color:#3a4b52}
  .qty .sp div{min-width:26px;text-align:center;font-weight:800}
  .trade{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:10px;
    font-size:11.5px;color:#4b6169;flex-wrap:wrap}
  .trade button{border:1.5px solid #9dc2ca;background:#fff;border-radius:9px;padding:4px 7px;
    font:inherit;font-size:11.5px;font-weight:800;cursor:pointer;color:#3a4b52}
  .close{width:100%;margin-top:10px;border:none;background:transparent;font:inherit;font-size:13px;
    font-weight:800;color:#5c4a2e;cursor:pointer;padding:8px}
  .notes{background:#16241d;padding:12px 14px 16px;color:#a8c0b0;font-size:12.5px}
  .notes h3{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#5f7a6b}
  .notes p{margin:0 0 5px}
  .notes p.good{color:#8fd08f}
  .notes p.warn{color:#e0b070}
  .notes p.dim{color:#7d9686}
  .coderow{display:flex;gap:6px;margin-top:10px}
  .coderow input{flex:1;min-width:0;font:inherit;font-size:11px;padding:8px;border-radius:9px;
    border:1px solid #2c4436;background:#0f1a14;color:#cfe0d4}
  .coderow button{font:inherit;font-size:11.5px;font-weight:800;padding:8px 10px;border-radius:9px;
    border:1px solid #2c4436;background:#22362b;color:#dbe8de;cursor:pointer}
  footer{padding:10px 14px 24px;background:#16241d;color:#6f8a7a;font-size:11.5px}
  footer a{color:#8fb6a2}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="720" height="1040"></canvas>
    <div class="ov wxpill"><span id="wxIcon"></span><span id="wxText">reading the sky</span></div>
    <div class="ov tokens" id="tokenBar"></div>
    <button class="ov gear" id="btnGear" title="The day's board">&#9881;</button>
  </div>

  <div class="dockwrap">
    <button class="boxbtn" id="btnBox" title="The recycling bin — cuttings go in here">
      <svg width="27" height="27" viewBox="0 0 24 24"><path d="M5 7h14l-1.4 12.2A2 2 0 0 1 15.6 21H8.4a2 2 0 0 1-2-1.8Z" fill="#4f7fa8"/><path d="M4 5.2h16v1.6H4z" fill="#3d6a8f"/><path d="M9.5 3.4h5v1.8h-5z" fill="#3d6a8f"/><path d="M10 10v7M14 10v7" stroke="#dceaf5" stroke-width="1.4"/></svg>
      <span class="badge" id="binBadge">0</span>
    </button>
    <div class="dock" id="dock"></div>
  </div>

  <div class="notes">
    <h3>Field notes</h3>
    <div id="notes"></div>
    <div class="coderow">
      <input id="codeIn" placeholder="paste a save code" spellcheck="false" autocomplete="off">
      <button id="btnSave">Save code</button>
      <button id="btnLoad">Load</button>
    </div>
  </div>

  <footer>
    The Cape Parrot Project works on this forest, out of Hogsback since 2009 —
    <a href="https://www.wildbirdtrust.com/projects/cape-parrot-project" target="_blank" rel="noopener">wildbirdtrust.com</a>.
    Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.
  </footer>
</div>

<div class="modal" id="mBoard" hidden>
  <div class="sheet tan">
    <h2>Mistbelt</h2>
    <p class="sub">a Hogsback hillside</p>
    <div class="card-in">
      <h2 id="boardDate" style="font-size:15px;margin-bottom:12px"></h2>
      <div id="boardList"></div>
      <div class="reward">Reward: <span id="boardReward"></span></div>
    </div>
    <button class="close" id="boardClose">Close</button>
  </div>
</div>

<div class="modal" id="mShop" hidden>
  <div class="sheet blue">
    <h2 id="shopDate" style="font-size:15px;margin-bottom:10px"></h2>
    <div class="shoprow" id="shopSeeds"></div>
    <div class="shoprow" id="shopDecor"></div>
    <div class="card-in">
      <div class="qty">
        <b id="shopName">pick something</b>
        <div class="sp">
          <button id="qMinus">&#8722;</button>
          <div id="qty">1</div>
          <button id="qPlus">+</button>
        </div>
      </div>
      <button class="buy" id="btnBuy">pick something first</button>
      <div class="trade" id="tradeRow"></div>
    </div>
    <button class="close" id="shopClose">Close</button>
  </div>
</div>

<div class="modal" id="mCard" hidden>
  <div class="sheet tan">
    <h2 id="cardTitle"></h2>
    <div class="card-in"><p id="cardBody" style="margin:0;font-size:13.5px;line-height:1.55"></p></div>
    <a id="cardLink" href="#" target="_blank" rel="noopener" style="display:block;text-align:center;margin-top:10px;font-size:12.5px;font-weight:800;color:#7a5a22" hidden>Learn more</a>
    <button class="close" id="cardOk">Right</button>
  </div>
</div>

<script>
(function () {
'use strict';

/* ============================================================ constants */

var VERSION = 2;
var SAVE_KEY = 'mistbelt.save.v2';
var SPOT = { lat: -32.5947, lon: 26.9342 };
var COLS = 9, ROWS = 10, NTILES = COLS * ROWS;
var W = 720, H = 1040;
var Y0 = 380, ROW_STEP = 62, SKY = 380;
var AP_MAX = 12;
var BIN_LOAD = 3;

var TOKENS = ['sun', 'mist', 'rain', 'snow'];
var TOKEN_ICON = {
  sun: '<svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.1" fill="#f0a83c"/><g stroke="#f0a83c" stroke-width="1.9" stroke-linecap="round"><path d="M10 1.4v2.4M10 16.2v2.4M1.4 10h2.4M16.2 10h2.4M4 4l1.7 1.7M14.3 14.3 16 16M16 4l-1.7 1.7M5.7 14.3 4 16"/></g></svg>',
  mist: '<svg width="15" height="15" viewBox="0 0 20 20"><g stroke="#9fb3bd" stroke-width="2.1" stroke-linecap="round"><path d="M3 6.5h14M4.5 10.5h11M3.5 14.5h13"/></g></svg>',
  rain: '<svg width="15" height="15" viewBox="0 0 20 20"><path d="M10 2.2c3.1 3.7 4.9 6.1 4.9 8.1A4.9 4.9 0 0 1 10 15.3a4.9 4.9 0 0 1-4.9-5c0-2 1.8-4.4 4.9-8.1Z" fill="#4f9fd4"/></svg>',
  snow: '<svg width="15" height="15" viewBox="0 0 20 20"><g stroke="#8fc4dc" stroke-width="1.9" stroke-linecap="round"><path d="M10 2.5v15M3.5 6.2l13 7.6M16.5 6.2l-13 7.6"/></g></svg>'
};

/* Real Amathole / Hogsback species. */
var ALIEN_KEYS = ['wattle', 'pine', 'bugweed', 'bramble'];
var ALIENS = {
  wattle:  { name: 'Black wattle',     sci: 'Acacia mearnsii',     ap: 2, bank: 3, spread: 3, fruit: true,
             note: 'Its seed sits in the soil for decades, so a stump is not the end of it.' },
  pine:    { name: 'Patula pine',      sci: 'Pinus patula',        ap: 2, bank: 3, spread: 2, fruit: false,
             note: 'Planted for timber. The cones hold their seed until the heat opens them.' },
  bugweed: { name: 'Bugweed',          sci: 'Solanum mauritianum', ap: 1, bank: 2, spread: 4, fruit: true,
             note: 'Birds carry the fruit uphill. It fruits the whole year round.' },
  bramble: { name: 'American bramble', sci: 'Rubus cuneifolius',   ap: 1, bank: 2, spread: 3, fruit: true,
             note: 'Roots sucker back after cutting. It takes the light from everything under it.' }
};

var SP_KEYS = ['yellowwood', 'stinkwood', 'chestnut', 'knobwood'];
var SPECIES = {
  yellowwood: { name: 'Yellowwood',      sci: 'Podocarpus latifolius', cost: 4, token: 'mist', slow: true,  fruit: false, hollow: true,
                note: 'Slow, and it lives for centuries. The old ones grow hollow.' },
  stinkwood:  { name: 'White stinkwood', sci: 'Celtis africana',      cost: 3, token: 'rain', slow: false, fruit: true,  hollow: false,
                note: 'Shades the ground within a few seasons. Birds come for the fruit.' },
  chestnut:   { name: 'Cape chestnut',   sci: 'Calodendrum capense',  cost: 3, token: 'sun',  slow: false, fruit: false, hollow: false,
                note: 'Flowers feed the sunbirds and sugarbirds.' },
  knobwood:   { name: 'Forest knobwood', sci: 'Zanthoxylum davyi',    cost: 5, token: 'snow', slow: true,  fruit: true,  hollow: false,
                note: 'Thorny, and the seed is worth cracking open.' }
};

var DECOR_KEYS = ['bench', 'birdbath', 'sign', 'hide', 'lantern'];
var DECOR = {
  bench:    { name: 'Bench',     cost: 2, token: 'sun' },
  birdbath: { name: 'Bird bath', cost: 2, token: 'rain' },
  sign:     { name: 'Signpost',  cost: 2, token: 'mist' },
  hide:     { name: 'Bird hide', cost: 4, token: 'mist' },
  lantern:  { name: 'Lantern',   cost: 3, token: 'sun' }
};

var ALIEN_CODE = { none: 0, wattle: 1, pine: 2, bugweed: 3, bramble: 4 };
var ALIEN_FROM = [null, 'wattle', 'pine', 'bugweed', 'bramble'];
/* Everything that can stand on a tile, so a save keeps the things the player built as well as
   the things that grow. The sign is both a fixed place and a decoration; one code covers both. */
var OBJ_CODE = { house: 1, nursery: 2, bin: 3, sign: 4, jetty: 5,
                 bench: 6, birdbath: 7, hide: 8, lantern: 9 };
var OBJ_FROM = [null, 'house', 'nursery', 'bin', 'sign', 'jetty',
                'bench', 'birdbath', 'hide', 'lantern'];
var SP_CODE = { none: 0, yellowwood: 1, stinkwood: 2, chestnut: 3, knobwood: 4 };
var SP_FROM = [null, 'yellowwood', 'stinkwood', 'chestnut', 'knobwood'];
var TER_FROM = ['grass', 'forest', 'water', 'bank'];

var SEASON = [
  { tmax: 24, tmin: 13, rain: 3.2, snow: 0, wind: 12, cloud: 60 },
  { tmax: 24, tmin: 13, rain: 3.0, snow: 0, wind: 12, cloud: 58 },
  { tmax: 22, tmin: 12, rain: 2.6, snow: 0, wind: 11, cloud: 55 },
  { tmax: 20, tmin: 9,  rain: 1.8, snow: 0, wind: 11, cloud: 50 },
  { tmax: 17, tmin: 6,  rain: 1.0, snow: 0, wind: 12, cloud: 45 },
  { tmax: 15, tmin: 4,  rain: 0.6, snow: 0, wind: 13, cloud: 42 },
  { tmax: 15, tmin: 3,  rain: 0.7, snow: 1, wind: 14, cloud: 45 },
  { tmax: 17, tmin: 4,  rain: 1.0, snow: 1, wind: 15, cloud: 48 },
  { tmax: 20, tmin: 7,  rain: 1.6, snow: 0, wind: 14, cloud: 55 },
  { tmax: 21, tmin: 9,  rain: 2.6, snow: 0, wind: 13, cloud: 62 },
  { tmax: 22, tmin: 11, rain: 3.2, snow: 0, wind: 12, cloud: 64 },
  { tmax: 23, tmin: 12, rain: 3.3, snow: 0, wind: 12, cloud: 62 }
];

/* ============================================================ state */

var state = null, tool = 'cut', cv = null, ctx = null, els = {}, notesEl = null;
var actors = [], parrot = null, troop = null, binItems = 0, binFlash = 0;

function idx(c, r) { return r * COLS + c; }
function cell(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return state.tiles[idx(c, r)];
}

/* The hillside is laid out, not scattered: an old forest remnant along the top,
   a tarn in the top corner, the bank under it, open hillside below. */
function terrainAt(c, r) {
  if (r <= 1 && c >= 6) return 'water';
  if (r === 2 && c >= 6) return 'bank';
  if (r <= 1) return 'forest';
  return 'grass';
}

var PLACES = [[4, 7, 'house'], [1, 8, 'nursery'], [7, 7, 'bin'], [3, 5, 'sign'], [7, 1, 'jetty']];

function newState() {
  var t = [], r, c;
  binItems = 0;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      var ter = terrainAt(c, r);
      var alien = null, seeds = 0;
      if (ter === 'grass') {
        var near = 1 - (r - 2) / (ROWS - 3);
        var roll = Math.random();
        if (roll < 0.20 + 0.34 * near) {
          alien = roll < 0.10 + 0.16 * near ? 'wattle'
                : roll < 0.17 + 0.24 * near ? 'pine'
                : roll < 0.21 + 0.29 * near ? 'bugweed' : 'bramble';
          seeds = ALIENS[alien].bank;
        }
      }
      t.push({ ter: ter, alien: alien, seeds: seeds, sp: null, stage: 0, age: 0,
               hollow: false, obj: null });
    }
  }
  var i;
  for (i = 0; i < PLACES.length; i++) t[idx(PLACES[i][0], PLACES[i][1])].obj = PLACES[i][2];
  return {
    v: VERSION, day: 1, ap: AP_MAX,
    tokens: { sun: 0, mist: 2, rain: 4, snow: 0 },
    bag: { yellowwood: 0, stinkwood: 1, chestnut: 1, knobwood: 0 },
    decor: { bench: 0, birdbath: 0, sign: 0, hide: 0, lantern: 0 },
    tiles: t, weather: null, lastDayKey: dayKey(new Date()),
    seen: { seedbank: false, baboon: false, parrot: false, shade: false },
    log: [], cleared: 0, planted: 0, bought: 0, recycled: 0,
    board: null, qty: 1, pick: 'stinkwood'
  };
}

function dayKey(d) {
  var m = d.getMonth() + 1, dd = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd);
}

/* ============================================================ weather */

function one(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function num(a, i) {
  if (!a || a.length <= i || a[i] === null || a[i] === undefined) return 0;
  return Number(a[i]) || 0;
}

function weatherFrom(payload, month) {
  if (!payload || !payload.current || !payload.daily) return null;
  var d = payload.daily, c = payload.current;
  return { tmax: num(d.temperature_2m_max, 0), tmin: num(d.temperature_2m_min, 0),
           rain: num(d.precipitation_sum, 0), snow: num(d.snowfall_sum, 0),
           wind: num(d.wind_speed_10m_max, 0), cloud: one(c.cloud_cover),
           temp: one(c.temperature_2m), code: one(c.weather_code), month: month };
}

function fallbackFor(month) {
  var s = SEASON[month];
  return { tmax: s.tmax, tmin: s.tmin, rain: s.rain, snow: s.snow, wind: s.wind,
           cloud: s.cloud, temp: (s.tmax + s.tmin) / 2, code: s.cloud > 60 ? 3 : 0,
           month: month, fallback: true };
}

function classify(w) {
  return { wet: w.rain >= 1, heavy: w.rain >= 5, frost: w.tmin <= 2,
           mist: w.cloud >= 85 && w.wind < 16 && w.rain < 1,
           berg: w.wind >= 35, snow: w.snow > 0 };
}

function tokenOf(w) {
  var k = classify(w);
  if (k.snow) return 'snow';
  if (k.mist) return 'mist';
  if (k.wet) return 'rain';
  return 'sun';
}

function weatherWord(w) {
  var k = classify(w);
  if (k.snow) return 'Snow';
  if (k.heavy) return 'Heavy rain';
  if (k.wet) return 'Rain';
  if (k.mist) return 'Mist';
  if (k.berg) return 'Berg wind';
  if (k.frost) return 'Frost';
  if (w.cloud >= 60) return 'Cloudy';
  return 'Clear';
}

function fetchForecast(month) {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + SPOT.lat +
    '&longitude=' + SPOT.lon +
    '&current=temperature_2m,precipitation,cloud_cover,wind_speed_10m,weather_code' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,wind_speed_10m_max' +
    '&timezone=Africa%2FJohannesburg&forecast_days=1';
  if (typeof fetch !== 'function') return Promise.resolve(fallbackFor(month));
  return fetch(url).then(function (r) { return r.json(); })
    .then(function (j) { return weatherFrom(j, month) || fallbackFor(month); })
    .catch(function () { return fallbackFor(month); });
}

/* ============================================================ the day */

function matureAround(c, r) {
  var n = 0, dc, dr;
  for (dr = -1; dr <= 1; dr++) {
    for (dc = -1; dc <= 1; dc++) {
      if (!dc && !dr) continue;
      var t = cell(c + dc, r + dr);
      if (t && t.sp && t.stage === 3) n++;
    }
  }
  return n;
}

function count(pred) {
  var n = 0, i;
  for (i = 0; i < NTILES; i++) if (pred(state.tiles[i])) n++;
  return n;
}

function plantable(c, r) {
  var t = cell(c, r);
  return !!t && t.ter === 'grass' && !t.obj;
}

function stats() {
  var alien = count(function (t) { return !!t.alien; });
  var mature = count(function (t) { return t.sp && t.stage === 3; });
  var growing = count(function (t) { return t.sp && t.stage > 0 && t.stage < 3; });
  var grass = count(function (t) { return t.ter === 'grass'; });
  return { alien: alien, mature: mature, growing: growing, total: NTILES, grass: grass,
           alienPct: Math.round(alien / Math.max(1, grass) * 100),
           forestPct: Math.round(mature / Math.max(1, grass) * 100) };
}

function tickDay(w) {
  var k = classify(w);
  var line = [], r, c, t, i;

  var sprouted = 0;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      t = cell(c, r);
      if (t.ter !== 'grass' || t.obj) continue;
      if (!t.alien && t.seeds > 0 && k.wet) {
        var chance = Math.max(0.2, 0.55 - 0.12 * matureAround(c, r));
        if (Math.random() < chance) { t.alien = pickAlien(t); t.seeds -= 1; sprouted++; }
      }
      if (t.alien && Math.random() < 0.10 && t.seeds < 6) t.seeds += 1;
    }
  }
  if (sprouted) line.push(sprouted + ' alien seedling' + (sprouted === 1 ? '' : 's') + ' came up out of the seed bank.');

  var spread = 0;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      t = cell(c, r);
      if (!t.alien) continue;
      var def = ALIENS[t.alien];
      var tries = k.berg ? def.spread + 1 : def.spread;
      for (i = 0; i < tries; i++) {
        if (Math.random() > 0.18) continue;
        var dr = Math.random() < 0.7 ? 1 : (Math.random() < 0.5 ? 0 : -1);
        var t2 = cell(c + Math.floor(Math.random() * 3) - 1, r + dr);
        if (t2 && t2.ter === 'grass' && !t2.obj && t2.seeds < 9) { t2.seeds += 1; spread++; }
      }
    }
  }
  if (spread) line.push('Seed moved ' + spread + ' step' + (spread === 1 ? '' : 's') + ' down the hill.');

  var grew = 0, lost = 0;
  for (i = 0; i < NTILES; i++) {
    t = state.tiles[i];
    if (!t.sp || t.stage === 0 || t.stage === 3) continue;
    var sd = SPECIES[t.sp];
    var g = 1;
    if (w.rain >= 5) g += 2; else if (w.rain >= 1) g += 1;
    if (k.mist) g += 1;
    if (k.frost) g -= 1;
    if (k.berg) g -= 1;
    if (k.snow) g -= 1;
    if (sd.slow) g = Math.max(0, g - 0.5);
    if (t.stage === 1 && (k.frost || k.snow) && Math.random() < (k.snow ? 0.35 : 0.2)) {
      t.sp = null; t.stage = 0; t.age = 0; lost++; continue;
    }
    t.age += Math.max(0, g);
    if (t.age >= (sd.slow ? 7 : 4)) { t.stage = 3; t.age = 0; }
    else if (t.age >= (sd.slow ? 3 : 2)) t.stage = 2;
    if (g > 0) grew++;
  }
  if (grew) line.push(grew + ' tree' + (grew === 1 ? '' : 's') + ' grew.');
  if (lost) line.push(lost + ' seedling' + (lost === 1 ? '' : 's') + ' died in the cold.');

  var baboonLine = baboonPass();

  state.day += 1;
  state.ap = AP_MAX;
  note('Day ' + state.day + ' — ' + weatherWord(w).toLowerCase() + '. ' +
    (line.length ? line.join(' ') : 'The hillside held its own.'));
  if (baboonLine) note(baboonLine, 'warn');
  rollBoard(w);
  note(voiceFor(w), 'dim');
  parrotCheck();
  return line;
}

function pickAlien(t) {
  if (t.lastAlien) return t.lastAlien;
  var roll = Math.random();
  return roll < 0.4 ? 'wattle' : roll < 0.65 ? 'pine' : roll < 0.85 ? 'bugweed' : 'bramble';
}

function fruitingIndigenous() {
  var n = 0, i;
  for (i = 0; i < NTILES; i++) {
    var t = state.tiles[i];
    if (t.sp && t.stage === 3 && SPECIES[t.sp].fruit) n++;
  }
  return n;
}

function baboonPass() {
  if (state.day % 4 !== 0) return null;
  var r = 4 + Math.floor(Math.random() * (ROWS - 5));
  var settled = fruitingIndigenous() >= 2;
  var drops = settled ? 1 : 3, placed = 0, c;
  for (c = 0; c < COLS && placed < drops; c++) {
    var t = cell(c, r);
    if (t && t.ter === 'grass' && !t.obj && t.seeds < 9 && (t.alien || !t.sp)) { t.seeds += 1; placed++; }
  }
  troop = { row: r, x: -40, dir: 1, t: 0 };
  if (!state.seen.baboon) {
    state.seen.baboon = true;
    card('A troop came through',
      'Chacma baboons move along the hillside and drop the seed of whatever they ate. ' +
      'Bugweed and bramble fruit is what they find up here. Two mature fruiting trees and they ' +
      'stop to feed there instead of ranging the whole mountain.',
      'https://www.mdpi.com/1424-2818/16/3/168');
  }
  return settled
    ? 'The troop settled in the fruiting trees you planted, and left one lot of seed behind.'
    : 'A troop crossed the hillside and left ' + placed + ' lot' + (placed === 1 ? '' : 's') + ' of alien seed behind.';
}

function parrotCheck() {
  if (state.seen.parrot) return false;
  var i;
  for (i = 0; i < NTILES; i++) {
    var t = state.tiles[i];
    if (t.sp === 'yellowwood' && t.stage === 3) {
      t.hollow = true;
      state.seen.parrot = true;
      parrot = { x: -60, y: 120, tx: tileX(i % COLS, Math.floor(i / COLS)) + 20,
                 ty: tileY(Math.floor(i / COLS)) - 30, t: 0 };
      card('A Cape parrot lands in the yellowwood',
        'South Africa\u2019s only endemic parrot, and fewer than two thousand are left in the wild. ' +
        'It nests in the hollow of an old yellowwood, high off the ground, and it feeds on the seed ' +
        'of the trees that grow here. The Cape Parrot Project started in this village in 2009, ' +
        'growing indigenous seedlings in community nurseries and putting them back into the mistbelt.',
        'https://www.wildbirdtrust.com/projects/cape-parrot-project');
      note('A Cape parrot landed in the yellowwood you grew.', 'good');
      return true;
    }
  }
  return false;
}

/* ============================================================ the day's board */

var VOICES = {
  wet: ['The nursery grower: "Soft ground today. The wattle comes out easier."',
        'The parrot monitor: "Good rain for the seedlings. Good rain for the seed bank too."'],
  mist: ['The neighbour up the pass: "Mist like this is what a yellowwood wants."',
         'The nursery grower: "A mist day. Good day for putting things in the ground."'],
  frost: ['The nursery grower: "Cold one. The tender seedlings will feel it tonight."',
          'The parrot monitor: "The old forest takes frost. A seedling does not."'],
  berg: ['The neighbour up the pass: "Berg wind. It will carry seed clean off the ridge."',
         'The parrot monitor: "Wind like this moves seed a long way downhill."'],
  snow: ['The parrot monitor: "Snow on the Hogs. The parrots will be low today."',
         'The neighbour up the pass: "Snow. Not much grows on a day like this."'],
  clear: ['The nursery grower: "Clear and warm. A good day for the hillside."',
          'The parrot monitor: "Quiet day. Nothing moves much up here."']
};

function voiceFor(w) {
  var k = classify(w);
  var key = k.snow ? 'snow' : k.wet ? 'wet' : k.mist ? 'mist' : k.frost ? 'frost' : k.berg ? 'berg' : 'clear';
  var arr = VOICES[key];
  return arr[Math.floor(Math.random() * arr.length)];
}

function rollBoard(w) {
  var k = classify(w);
  var pool = [
    { text: 'Recycle three items at the bin', need: 3, metric: 'recycles' },
    { text: 'Buy one thing at the nursery', need: 1, metric: 'buys' }
  ];
  if (k.wet) pool.push({ text: 'Clear five aliens while the ground is soft', need: 5, metric: 'cuts' });
  if (k.mist) pool.push({ text: 'Plant two trees in under the mist', need: 2, metric: 'plants' });
  if (k.frost) pool.push({ text: 'Clear three aliens before the cold settles', need: 3, metric: 'cuts' });
  if (k.berg) pool.push({ text: 'Clear four aliens before the wind spreads seed', need: 4, metric: 'cuts' });
  if (k.snow) pool.push({ text: 'Plant one tree in the snow break', need: 1, metric: 'plants' });
  pool.push({ text: 'Plant one tree on the hillside', need: 1, metric: 'plants' });
  pool.push({ text: 'Collect thirteen tokens', need: 13, metric: 'tokens' });

  var tasks = [], seen = {}, i;
  for (i = 0; i < pool.length && tasks.length < 3; i++) {
    if (seen[pool[i].text]) continue;
    seen[pool[i].text] = true;
    tasks.push(pool[i]);
  }
  state.board = { day: state.day, cuts: 0, plants: 0, recycles: 0, buys: 0, tokens: 0,
                  tasks: tasks, claimed: false, reward: 10 };
  return state.board;
}

function boardTasks() { return state.board && state.board.tasks ? state.board.tasks : []; }
function taskGot(t) { return state.board ? Math.min(state.board[t.metric] || 0, t.need) : 0; }
function taskDone(t) { return taskGot(t) >= t.need; }
function boardDone() {
  var ts = boardTasks(), i;
  if (!ts.length) return false;
  for (i = 0; i < ts.length; i++) if (!taskDone(ts[i])) return false;
  return true;
}
function boardProgress(metric, n) {
  if (!state.board || state.board.claimed) return;
  state.board[metric] = (state.board[metric] || 0) + n;
}
function claimBoard() {
  if (!state.board || state.board.claimed || !boardDone()) return false;
  var tk = tokenOf(state.weather || fallbackFor(new Date().getMonth()));
  state.board.claimed = true;
  state.tokens[tk] += state.board.reward;
  boardProgress('tokens', state.board.reward);
  note('The board is done. The nursery pays ' + state.board.reward + ' ' + tk + ' tokens.', 'good');
  return true;
}

/* ============================================================ actions */

function clearAt(c, r) {
  var t = cell(c, r);
  if (!t || !t.alien || t.obj) return false;
  var def = ALIENS[t.alien];
  if (state.ap < def.ap) return false;
  state.ap -= def.ap;
  t.lastAlien = t.alien;
  t.alien = null;
  t.seeds += def.bank;
  state.cleared++;
  binItems += 1;
  if (!state.seen.seedbank) {
    state.seen.seedbank = true;
    card('The seed stays behind',
      def.name + ' (' + def.sci + ') is cut, and its seed is already in the ground — this one ' +
      'leaves ' + def.bank + ' lots of it. ' + def.note + ' Rain brings it up again. ' +
      'The cuttings go in the bin.', null);
  }
  return true;
}

function plantAt(c, r, spKey) {
  var t = cell(c, r);
  if (!t || t.sp || t.alien || !plantable(c, r)) return false;
  var def = SPECIES[spKey];
  if (!def) return false;
  var have = (state.bag && state.bag[spKey]) || 0;
  if (have > 0) state.bag[spKey] = have - 1;
  else if (state.tokens[def.token] >= def.cost) state.tokens[def.token] -= def.cost;
  else return false;
  state.ap = Math.max(0, state.ap - 1);
  t.sp = spKey; t.stage = 1; t.age = 0;
  state.planted++;
  return true;
}

function placeDecor(c, r, key) {
  var t = cell(c, r);
  if (!t || t.obj || t.alien || t.sp || !plantable(c, r)) return false;
  if (!DECOR[key] || !(state.decor[key] > 0)) return false;
  state.decor[key] -= 1;
  t.obj = key;
  return true;
}

function recycle() {
  if (binItems < BIN_LOAD) return false;
  var loads = Math.floor(binItems / BIN_LOAD);
  var items = loads * BIN_LOAD;
  var tk = tokenOf(state.weather || fallbackFor(new Date().getMonth()));
  binItems -= items;
  state.tokens[tk] += items;
  state.recycled += items;
  boardProgress('recycles', items);
  boardProgress('tokens', items);
  binFlash = 700;
  note('Emptied the bin: ' + items + ' items, ' + items + ' ' + tk + ' tokens.', 'good');
  return true;
}

function buy(key, qty) {
  qty = qty || 1;
  var def = SPECIES[key] || DECOR[key];
  if (!def) return false;
  var cost = def.cost * qty;
  if (state.tokens[def.token] < cost) return false;
  state.tokens[def.token] -= cost;
  state.bought += qty;
  boardProgress('buys', qty);
  if (SPECIES[key]) state.bag[key] = (state.bag[key] || 0) + qty;
  else state.decor[key] = (state.decor[key] || 0) + qty;
  return true;
}

function trade(from, to) {
  if (from === to || !state.tokens[from] || state.tokens[from] < 3) return false;
  state.tokens[from] -= 3;
  state.tokens[to] += 1;
  return true;
}

/* ============================================================ save */

function clamp(n, lo, hi) { n = Math.round(Number(n) || 0); return n < lo ? lo : n > hi ? hi : n; }
function pad2(x) { return x.length >= 2 ? x : '0' + x; }

function encodeSave(s) {
  var chars = '', i;
  for (i = 0; i < s.tiles.length; i++) {
    var t = s.tiles[i];
    var ter = t.ter === 'grass' ? 0 : t.ter === 'forest' ? 1 : t.ter === 'water' ? 2 : 3;
    chars += String(ter) + String(ALIEN_CODE[t.alien] || 0) + String(clamp(t.seeds, 0, 9)) +
             String(clamp(t.stage, 0, 3)) + String(SP_CODE[t.sp] || 0) +
             pad2(clamp(Math.round(t.age * 2), 0, 1295).toString(36)) +
             String(OBJ_CODE[t.obj] || 0);
  }
  var seen = (s.seen.seedbank ? 1 : 0) | (s.seen.baboon ? 2 : 0) | (s.seen.parrot ? 4 : 0) | (s.seen.shade ? 8 : 0);
  var bag = '', dec = '';
  for (i = 0; i < SP_KEYS.length; i++) bag += clamp(s.bag[SP_KEYS[i]] || 0, 0, 9);
  for (i = 0; i < DECOR_KEYS.length; i++) dec += clamp(s.decor[DECOR_KEYS[i]] || 0, 0, 9);
  var payload = { v: s.v, d: s.day, a: s.ap, s: seen, l: s.cleared, p: s.planted,
                  b: s.bought, y: s.recycled, k: s.lastDayKey, t: chars, g: bag, c: dec,
                  n: clamp(binItems, 0, 99),
                  tk: s.tokens.sun + '.' + s.tokens.mist + '.' + s.tokens.rain + '.' + s.tokens.snow };
  var body = b64encode(JSON.stringify(payload));
  return 'MB2-' + body + '-' + checksum(body);
}

function decodeTiles(str) {
  if (typeof str !== 'string' || str.length !== NTILES * 8) return null;
  var out = [], i;
  for (i = 0; i < NTILES; i++) {
    var c = str.slice(i * 8, i * 8 + 8);
    var ter = parseInt(c.charAt(0), 10);
    var a = parseInt(c.charAt(1), 10);
    var seeds = parseInt(c.charAt(2), 10);
    var stage = parseInt(c.charAt(3), 10);
    var sp = parseInt(c.charAt(4), 10);
    var age = parseInt(c.slice(5, 7), 36);
    var ob = parseInt(c.charAt(7), 10);
    if (!isFinite(ter) || !isFinite(a) || !isFinite(seeds) || !isFinite(stage) || !isFinite(sp) || !isFinite(age) || !isFinite(ob)) return null;
    if (ter > 3 || a > 4 || sp > 4 || stage > 3 || seeds > 9 || ob > 9) return null;
    out.push({ ter: TER_FROM[ter], alien: ALIEN_FROM[a] || null, seeds: seeds, stage: stage,
               sp: SP_FROM[sp] || null, age: age / 2, hollow: false, obj: OBJ_FROM[ob] || null });
  }
  return out;
}

function decodeSave(code) {
  if (typeof code !== 'string') return null;
  code = code.trim().replace(/\s+/g, '');
  var parts = code.split('-');
  if (parts.length !== 3 || parts[0] !== 'MB2') return null;
  if (checksum(parts[1]) !== parts[2]) return null;
  var p;
  try { p = JSON.parse(b64decode(parts[1])); } catch (e) { return null; }
  if (!p || p.v !== VERSION) return null;
  var tiles = decodeTiles(p.t);
  if (!tiles) return null;
  var s = newState();
  s.day = p.d; s.ap = p.a; s.cleared = p.l || 0; s.planted = p.p || 0;
  s.bought = p.b || 0; s.recycled = p.y || 0;
  s.lastDayKey = p.k || dayKey(new Date());
  s.seen = { seedbank: !!(p.s & 1), baboon: !!(p.s & 2), parrot: !!(p.s & 4), shade: !!(p.s & 8) };
  var tk = String(p.tk || '0.0.0.0').split('.');
  s.tokens = { sun: +tk[0] || 0, mist: +tk[1] || 0, rain: +tk[2] || 0, snow: +tk[3] || 0 };
  var g = String(p.g || '0000'), d = String(p.c || '00000'), i;
  for (i = 0; i < SP_KEYS.length; i++) s.bag[SP_KEYS[i]] = parseInt(g.charAt(i), 10) || 0;
  for (i = 0; i < DECOR_KEYS.length; i++) s.decor[DECOR_KEYS[i]] = parseInt(d.charAt(i), 10) || 0;
  s.tiles = tiles;
  for (i = 0; i < PLACES.length; i++) s.tiles[idx(PLACES[i][0], PLACES[i][1])].obj = PLACES[i][2];
  /* The bin is module state, not tile state, so it has to be restored alongside the tiles —
     otherwise a player who cuts two aliens and comes back finds the bin empty and the cuttings
     gone. decodeSave is the only thing that knows what was in it. */
  binItems = clamp(p.n || 0, 0, 99);
  return s;
}

function checksum(str) {
  var h = 5381, i;
  for (i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function b64encode(s) {
  var b = new TextEncoder().encode(s), bin = '', i;
  for (i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}
function b64decode(s) {
  var bin = atob(s), b = new Uint8Array(bin.length), i;
  for (i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);

}
function saveLocal() {
  try { if (typeof localStorage !== 'undefined') localStorage.setItem(SAVE_KEY, encodeSave(state)); } catch (e) {}
}
function loadLocal() {
  try {
    if (typeof localStorage === 'undefined') return null;
    var c = localStorage.getItem(SAVE_KEY);
    return c ? decodeSave(c) : null;
  } catch (e) { return null; }
}

/* ============================================================ geometry */

function tileSize(r) { return 64 + 1.5 * r; }
function tileX(c, r) { var ts = tileSize(r); return (W - ts * COLS) / 2 + c * ts; }
function tileY(r) { return Y0 + r * ROW_STEP; }

function hitTest(x, y) {
  var r, c;
  for (r = ROWS - 1; r >= 0; r--) {
    var ty = tileY(r), th = tileSize(r) * 0.94;
    if (y < ty || y > ty + th) continue;
    var ts = tileSize(r), x0 = tileX(0, r);
    c = Math.floor((x - x0) / ts);
    if (c < 0 || c >= COLS) continue;
    return { c: c, r: r };
  }
  return null;
}

/* ============================================================ drawing */

function jit(a, b, k) {
  var n = Math.sin(a * 12.9898 + b * 78.233 + k * 37.719) * 43758.5453;
  return n - Math.floor(n);
}

function now() {
  if (typeof performance !== 'undefined' && performance.now) return performance.now();
  return Date.now();
}

function squircle(cx, cy, w, h, p, wob, seed) {
  ctx.beginPath();
  var n = 22, i;
  for (i = 0; i <= n; i++) {
    var ang = i / n * Math.PI * 2;
    var ct = Math.cos(ang), st = Math.sin(ang);
    var k = wob ? 1 + 0.030 * Math.sin(ang * 5 + seed) : 1;
    var px = cx + (ct < 0 ? -1 : 1) * Math.pow(Math.abs(ct), 2 / p) * (w / 2) * k;
    var py = cy + (st < 0 ? -1 : 1) * Math.pow(Math.abs(st), 2 / p) * (h / 2) * k;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function ridgeY(x, humps, base, amp) {
  var v = 0, i;
  for (i = 0; i < humps.length; i++) {
    var h = humps[i], dx = (x - h[0]) / h[1];
    v += h[2] * Math.exp(-dx * dx * 1.7);
  }
  return base - amp * v;
}

function ridgeBand(humps, base, amp, colour) {
  ctx.beginPath();
  ctx.moveTo(0, SKY);
  var x;
  for (x = 0; x <= W; x += 8) ctx.lineTo(x, ridgeY(x, humps, base, amp));
  ctx.lineTo(W, SKY);
  ctx.closePath();
  ctx.fillStyle = colour;
  ctx.fill();
}

function drawSky(w) {
  var k = classify(w);
  var g = ctx.createLinearGradient(0, 0, 0, SKY);
  if (k.snow) { g.addColorStop(0, '#7d95a8'); g.addColorStop(1, '#c9d8de'); }
  else if (k.wet) { g.addColorStop(0, '#5b7688'); g.addColorStop(1, '#93aab6'); }
  else if (k.mist) { g.addColorStop(0, '#809389'); g.addColorStop(1, '#b8c6bb'); }
  else if (k.frost) { g.addColorStop(0, '#5d7f92'); g.addColorStop(1, '#adc6d1'); }
  else { g.addColorStop(0, '#7fb6d8'); g.addColorStop(1, '#cfe6f1'); }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, SKY);

  ridgeBand([[150, 150, 1], [400, 138, 0.94], [630, 150, 0.82]], 300, 170, 'rgba(96,134,122,0.60)');
  ridgeBand([[260, 190, 1], [560, 170, 0.88]], 330, 122, 'rgba(70,108,96,0.72)');
  ridgeBand([[150, 220, 1], [520, 200, 0.9]], 358, 86, 'rgba(48,82,70,0.86)');

  var i;
  for (i = 0; i < 17; i++) {
    var fx = 26 + i * 42 + jit(i, 1, 2) * 16;
    var fy = 338 + jit(i, 2, 3) * 14;
    ctx.fillStyle = i % 2 ? '#2e6745' : '#255a3a';
    ctx.beginPath();
    ctx.ellipse(fx, fy, 34 + jit(i, 3, 4) * 12, 23 + jit(i, 4, 5) * 8, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTile(c, r) {
  var t = cell(c, r);
  var ts = tileSize(r), x = tileX(c, r), y = tileY(r), h = ts * 0.94;
  var cx = x + ts / 2, cy = y + h / 2;

  squircle(cx, cy, ts * 0.99, h * 0.99, 3.2, true, c * 3.7 + r * 1.9);
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  if (t.ter === 'water') { g.addColorStop(0, '#93d2e6'); g.addColorStop(1, '#5aa6c8'); }
  else if (t.ter === 'bank') { g.addColorStop(0, '#7c5a3a'); g.addColorStop(1, '#553a24'); }
  else if (t.ter === 'forest') { g.addColorStop(0, '#37704b'); g.addColorStop(1, '#245238'); }
  else { g.addColorStop(0, '#82c066'); g.addColorStop(1, '#65a34f'); }
  ctx.fillStyle = g;
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + jit(c, r, 7) * 0.07).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(cx, cy - h * 0.18, ts * 0.32, h * 0.20, 0, 0, Math.PI * 2);
  ctx.fill();

  if (t.seeds > 0 && t.ter === 'grass' && !t.alien && !t.obj) {
    /* Seed left in the ground, waiting for rain. This is the thing the whole game turns on, and
       a single flat smudge was too easy to read as dirt, so it is a scatter of seeds now. */
    var sn = Math.min(4, t.seeds), sk;
    ctx.fillStyle = 'rgba(110,86,46,0.66)';
    for (sk = 0; sk < sn; sk++) {
      var ax = cx + (jit(c + sk, r, 21) - 0.5) * ts * 0.46;
      var ay = cy + (jit(c, r + sk, 31) - 0.5) * h * 0.40;
      ctx.beginPath();
      ctx.ellipse(ax, ay, ts * 0.043, h * 0.033, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function shadow(cx, cy, rx, ry) {
  ctx.fillStyle = 'rgba(30,60,40,0.20)';
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawAlien(kind, cx, base, s) {
  shadow(cx, base, s * 0.40, s * 0.13);
  var i;
  if (kind === 'pine') {
    ctx.fillStyle = '#6b5433';
    ctx.fillRect(cx - s * 0.05, base - s * 0.30, s * 0.10, s * 0.30);
    for (i = 0; i < 3; i++) {
      var yy = base - s * (0.30 + i * 0.22);
      var ww = s * (0.42 - i * 0.10);
      ctx.fillStyle = i === 2 ? '#4e7a3c' : '#3d6a31';
      ctx.beginPath();
      ctx.moveTo(cx, yy - s * 0.28);
      ctx.lineTo(cx + ww, yy);
      ctx.lineTo(cx - ww, yy);
      ctx.closePath();
      ctx.fill();
    }
  } else if (kind === 'wattle') {
    ctx.fillStyle = '#6b5433';
    ctx.fillRect(cx - s * 0.05, base - s * 0.44, s * 0.10, s * 0.44);
    ctx.fillStyle = '#9fb84a';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.60, s * 0.32, s * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8aa83c';
    ctx.beginPath(); ctx.ellipse(cx + s * 0.13, base - s * 0.74, s * 0.19, s * 0.17, 0, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'bugweed') {
    ctx.fillStyle = '#5f7a3c';
    ctx.fillRect(cx - s * 0.04, base - s * 0.24, s * 0.08, s * 0.24);
    ctx.fillStyle = '#8fae4c';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.42, s * 0.38, s * 0.29, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e0d264';
    for (i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(cx + (jit(i, 1, 3) - 0.5) * s * 0.56, base - s * 0.42 + (jit(i, 2, 4) - 0.5) * s * 0.36, s * 0.055, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    ctx.strokeStyle = '#7d9a44';
    ctx.lineWidth = Math.max(1.4, s * 0.045);
    for (i = 0; i < 7; i++) {
      var ang = i / 7 * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, base - s * 0.10);
      ctx.quadraticCurveTo(cx + Math.cos(ang) * s * 0.24, base - s * 0.20,
                           cx + Math.cos(ang) * s * 0.36, base - s * 0.06);
      ctx.stroke();
    }
    ctx.fillStyle = '#93b04e';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.16, s * 0.20, s * 0.12, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTree(sp, stage, cx, base, s, hollow) {
  var scale = stage === 1 ? 0.26 : stage === 2 ? 0.56 : 1;
  var hs = s * scale;
  if (stage === 1) {
    ctx.fillStyle = '#4f8a4a';
    ctx.beginPath(); ctx.ellipse(cx, base - hs * 0.16, hs * 0.17, hs * 0.17, 0, 0, Math.PI * 2); ctx.fill();
    return;
  }
  shadow(cx, base, hs * 0.42, hs * 0.13);
  ctx.fillStyle = '#5b4327';
  ctx.fillRect(cx - hs * 0.055, base - hs * 0.52, hs * 0.11, hs * 0.52);
  var tone = sp === 'chestnut' ? '#57a866' : sp === 'knobwood' ? '#3d8558' : sp === 'yellowwood' ? '#2f6d4a' : '#48965f';
  var dark = sp === 'chestnut' ? '#428a52' : sp === 'knobwood' ? '#2d6a45' : sp === 'yellowwood' ? '#255639' : '#377a4b';
  ctx.fillStyle = tone;
  ctx.beginPath(); ctx.ellipse(cx, base - hs * 0.72, hs * 0.50, hs * 0.36, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(cx + hs * 0.22, base - hs * 0.90, hs * 0.30, hs * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = tone;
  ctx.beginPath(); ctx.ellipse(cx - hs * 0.24, base - hs * 0.92, hs * 0.26, hs * 0.21, 0, 0, Math.PI * 2); ctx.fill();
  if (stage === 3 && hollow) {
    ctx.fillStyle = 'rgba(28,36,26,0.85)';
    ctx.beginPath(); ctx.ellipse(cx + hs * 0.06, base - hs * 0.40, hs * 0.09, hs * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (stage === 3 && sp === 'chestnut') {
    ctx.fillStyle = '#f2a8c4';
    var i;
    for (i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(cx + (jit(i, 3, 5) - 0.5) * hs * 0.9, base - hs * 0.72 + (jit(i, 4, 6) - 0.5) * hs * 0.5, hs * 0.05, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (stage === 3 && SPECIES[sp] && SPECIES[sp].fruit) {
    ctx.fillStyle = '#e0c060';
    ctx.beginPath(); ctx.arc(cx - hs * 0.30, base - hs * 0.62, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + hs * 0.32, base - hs * 0.78, 2.4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawHouse(cx, base, s) {
  shadow(cx, base, s * 0.54, s * 0.15);
  ctx.fillStyle = '#b98f5c';
  squircle(cx, base - s * 0.30, s * 0.94, s * 0.58, 5, false, 0); ctx.fill();
  ctx.fillStyle = '#6d4f30';
  squircle(cx, base - s * 0.22, s * 0.76, s * 0.38, 5, false, 0); ctx.fill();
  ctx.fillStyle = '#f2d79c';
  squircle(cx, base - s * 0.20, s * 0.64, s * 0.29, 5, false, 0); ctx.fill();
  ctx.fillStyle = '#8a5f34';
  ctx.fillRect(cx - s * 0.22, base - s * 0.25, s * 0.15, s * 0.06);
  ctx.fillStyle = '#c99a52';
  ctx.fillRect(cx + s * 0.10, base - s * 0.30, s * 0.13, s * 0.15);
  ctx.fillStyle = '#f8e8b4';
  ctx.beginPath(); ctx.arc(cx + s * 0.165, base - s * 0.345, s * 0.042, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9a558';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.60, base - s * 0.52);
  ctx.quadraticCurveTo(cx, base - s * 1.00, cx + s * 0.60, base - s * 0.52);
  ctx.quadraticCurveTo(cx, base - s * 0.62, cx - s * 0.60, base - s * 0.52);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#a8853f';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.60, base - s * 0.52);
  ctx.quadraticCurveTo(cx, base - s * 0.62, cx + s * 0.60, base - s * 0.52);
  ctx.lineTo(cx + s * 0.55, base - s * 0.47);
  ctx.quadraticCurveTo(cx, base - s * 0.57, cx - s * 0.55, base - s * 0.47);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8d6b4a';
  ctx.fillRect(cx + s * 0.29, base - s * 0.86, s * 0.10, s * 0.23);
}

function drawNursery(cx, base, s) {
  shadow(cx, base, s * 0.50, s * 0.14);
  ctx.fillStyle = '#4a5a4e';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.46, base - s * 0.06);
  ctx.quadraticCurveTo(cx, base - s * 0.58, cx + s * 0.46, base - s * 0.06);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(220,235,220,0.20)';
  ctx.lineWidth = 1;
  var i;
  for (i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.40 + i * s * 0.05, base - s * 0.08);
    ctx.quadraticCurveTo(cx, base - s * 0.54, cx + s * 0.40 - i * s * 0.05, base - s * 0.08);
    ctx.stroke();
  }
  ctx.fillStyle = '#7a5a38';
  ctx.fillRect(cx - s * 0.42, base - s * 0.06, s * 0.84, s * 0.09);
  ctx.fillStyle = '#8fbf5a';
  for (i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.ellipse(cx - s * 0.32 + i * s * 0.128, base - s * 0.10, s * 0.042, s * 0.052, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBin(cx, base, s, full) {
  shadow(cx, base, s * 0.28, s * 0.10);
  ctx.fillStyle = '#4f7fa8';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.21, base - s * 0.38);
  ctx.lineTo(cx + s * 0.21, base - s * 0.38);
  ctx.lineTo(cx + s * 0.16, base - s * 0.02);
  ctx.lineTo(cx - s * 0.16, base - s * 0.02);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3d6a8f';
  ctx.fillRect(cx - s * 0.24, base - s * 0.42, s * 0.48, s * 0.06);
  ctx.fillStyle = '#8fb8d4';
  ctx.fillRect(cx - s * 0.10, base - s * 0.29, s * 0.20, s * 0.17);
  if (full) {
    ctx.fillStyle = '#7d9a44';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.45, s * 0.19, s * 0.085, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6b8a38';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx - s * 0.06, base - s * 0.48); ctx.lineTo(cx - s * 0.12, base - s * 0.58); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.04, base - s * 0.48); ctx.lineTo(cx + s * 0.10, base - s * 0.56); ctx.stroke();
  }
}

function drawSign(cx, base, s) {
  shadow(cx, base, s * 0.20, s * 0.08);
  ctx.fillStyle = '#7a5a38';
  ctx.fillRect(cx - s * 0.045, base - s * 0.56, s * 0.09, s * 0.56);
  ctx.fillStyle = '#b58a4e';
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.32, base - s * 0.60);
  ctx.lineTo(cx + s * 0.28, base - s * 0.60);
  ctx.lineTo(cx + s * 0.38, base - s * 0.53);
  ctx.lineTo(cx + s * 0.28, base - s * 0.46);
  ctx.lineTo(cx - s * 0.32, base - s * 0.46);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(90,66,38,0.7)';
  ctx.fillRect(cx - s * 0.24, base - s * 0.555, s * 0.40, s * 0.024);
  ctx.fillRect(cx - s * 0.24, base - s * 0.515, s * 0.28, s * 0.024);
}

function drawJetty(cx, base, s) {
  var i;
  ctx.fillStyle = '#8a6a44';
  for (i = 0; i < 3; i++) ctx.fillRect(cx - s * 0.28 + i * s * 0.24, base - s * 0.15, s * 0.065, s * 0.17);
  ctx.fillStyle = '#a8825a';
  ctx.fillRect(cx - s * 0.40, base - s * 0.21, s * 0.80, s * 0.085);
  ctx.fillStyle = 'rgba(60,90,80,0.25)';
  ctx.beginPath(); ctx.ellipse(cx, base - s * 0.11, s * 0.40, s * 0.065, 0, 0, Math.PI * 2); ctx.fill();
}

function drawDecor(kind, cx, base, s) {
  if (kind === 'bench') {
    shadow(cx, base, s * 0.24, s * 0.08);
    ctx.fillStyle = '#9a7442';
    ctx.fillRect(cx - s * 0.24, base - s * 0.19, s * 0.48, s * 0.055);
    ctx.fillRect(cx - s * 0.24, base - s * 0.30, s * 0.48, s * 0.048);
    ctx.fillRect(cx - s * 0.20, base - s * 0.19, s * 0.048, s * 0.19);
    ctx.fillRect(cx + s * 0.15, base - s * 0.19, s * 0.048, s * 0.19);
  } else if (kind === 'birdbath') {
    shadow(cx, base, s * 0.18, s * 0.07);
    ctx.fillStyle = '#a9b2b0';
    ctx.fillRect(cx - s * 0.05, base - s * 0.32, s * 0.10, s * 0.32);
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.36, s * 0.22, s * 0.085, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fb4cc';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.36, s * 0.17, s * 0.055, 0, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 'sign') {
    drawSign(cx, base, s);
  } else if (kind === 'hide') {
    shadow(cx, base, s * 0.34, s * 0.11);
    ctx.fillStyle = '#7d6a4a';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.36, base);
    ctx.lineTo(cx - s * 0.30, base - s * 0.48);
    ctx.lineTo(cx + s * 0.30, base - s * 0.48);
    ctx.lineTo(cx + s * 0.36, base);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a3226';
    ctx.fillRect(cx - s * 0.15, base - s * 0.38, s * 0.30, s * 0.15);
    ctx.fillStyle = '#5b5138';
    ctx.fillRect(cx - s * 0.40, base - s * 0.54, s * 0.80, s * 0.065);
  } else if (kind === 'lantern') {
    shadow(cx, base, s * 0.13, s * 0.06);
    ctx.fillStyle = '#5a5245';
    ctx.fillRect(cx - s * 0.03, base - s * 0.44, s * 0.06, s * 0.44);
    ctx.fillStyle = '#f2d98a';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.50, s * 0.105, s * 0.125, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(242,217,138,0.22)';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.50, s * 0.22, s * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawRowEntities(r) {
  var c;
  for (c = 0; c < COLS; c++) {
    var t = cell(c, r);
    var ts = tileSize(r), cx = tileX(c, r) + ts / 2, base = tileY(r) + ts * 0.72;
    if (t.alien) drawAlien(t.alien, cx, base, ts * 0.92);
    else if (t.sp) drawTree(t.sp, t.stage, cx, base, ts * 0.92, t.hollow);
    if (t.obj === 'house') drawHouse(cx, base, ts * 1.02);
    else if (t.obj === 'nursery') drawNursery(cx, base, ts * 0.96);
    else if (t.obj === 'bin') drawBin(cx, base, ts * 0.90, binItems >= BIN_LOAD);
    else if (t.obj === 'sign') drawSign(cx, base, ts * 0.88);
    else if (t.obj === 'jetty') drawJetty(cx, base, ts * 0.96);
    else if (DECOR[t.obj]) drawDecor(t.obj, cx, base, ts * 0.88);
  }
}

function drawCritter(kind, cx, base, s) {
  shadow(cx, base, s * 0.24, s * 0.08);
  var i;
  if (kind === 'bushbuck') {
    ctx.fillStyle = '#8a5f3c';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.26, s * 0.23, s * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * 0.22, base - s * 0.44, s * 0.085, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6f4a2c';
    ctx.fillRect(cx - s * 0.15, base - s * 0.16, s * 0.05, s * 0.16);
    ctx.fillRect(cx + s * 0.09, base - s * 0.16, s * 0.05, s * 0.16);
    ctx.strokeStyle = '#d8cbb0';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx + s * 0.25, base - s * 0.52); ctx.lineTo(cx + s * 0.31, base - s * 0.66); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s * 0.17, base - s * 0.52); ctx.lineTo(cx + s * 0.13, base - s * 0.66); ctx.stroke();
  } else if (kind === 'monkey') {
    ctx.fillStyle = '#6b5a44';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.30, s * 0.15, s * 0.19, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, base - s * 0.53, s * 0.105, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c9b394';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.51, s * 0.065, s * 0.075, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6b5a44';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.05, base - s * 0.43);
    ctx.quadraticCurveTo(cx - s * 0.28, base - s * 0.29, cx - s * 0.22, base - s * 0.06);
    ctx.stroke();
  } else if (kind === 'porcupine') {
    ctx.fillStyle = '#4a4238';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.15, s * 0.23, s * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e0d8c4';
    ctx.lineWidth = 1.4;
    for (i = 0; i < 7; i++) {
      var bx = cx - s * 0.19 + i * s * 0.062;
      ctx.beginPath();
      ctx.moveTo(bx, base - s * 0.21);
      ctx.lineTo(bx - s * 0.04, base - s * 0.40);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#2f6d5a';
    ctx.beginPath(); ctx.ellipse(cx, base - s * 0.34, s * 0.14, s * 0.19, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8503c';
    ctx.beginPath(); ctx.arc(cx + s * 0.13, base - s * 0.51, s * 0.052, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3f8a72';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.05, base - s * 0.43);
    ctx.lineTo(cx - s * 0.32, base - s * 0.19);
    ctx.lineTo(cx - s * 0.02, base - s * 0.25);
    ctx.closePath(); ctx.fill();
  }
}

function drawActors(dt) {
  var i;
  for (i = actors.length - 1; i >= 0; i--) {
    var a = actors[i];
    a.t += dt;
    if (a.t > a.life) { actors.splice(i, 1); continue; }
    var ts = tileSize(a.row);
    ctx.globalAlpha = Math.min(1, Math.min(a.t, a.life - a.t) / 300);
    drawCritter(a.kind, a.x, tileY(a.row) + ts * 0.74, ts * 0.60);
    ctx.globalAlpha = 1;
    a.x += a.dir * a.speed * dt;
  }
  if (troop) {
    troop.t += dt;
    troop.x += troop.dir * 0.055 * dt;
    if (troop.x > W + 70) troop = null;
    else {
      var ty = tileY(troop.row) + tileSize(troop.row) * 0.74;
      for (i = 0; i < 4; i++) drawCritter('monkey', troop.x - i * 16, ty, tileSize(troop.row) * 0.52);
    }
  }
  if (parrot) {
    parrot.t += dt;
    var p = Math.min(1, parrot.t / 2200);
    parrot.x = -60 + (parrot.tx + 60) * p;
    parrot.y = 120 + (parrot.ty - 120) * p - Math.sin(p * Math.PI) * 40;
    /* This bird is the payoff of the whole game, and it used to be a six-pixel smudge that
       vanished against the leaves. It is drawn bigger now, with its own halo so it reads against
       a green canopy, and with the red forehead patch that makes it a Cape parrot rather than
       any parrot. */
    var bob = Math.sin(parrot.t / 260) * 3.2;
    var px = parrot.x, py = parrot.y + bob;
    var pg = ctx.createRadialGradient(px, py, 0, px, py, 36);
    pg.addColorStop(0, 'rgba(255,248,214,0.55)');
    pg.addColorStop(1, 'rgba(255,248,214,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(px, py, 36, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#4e8a44';
    ctx.lineWidth = 4.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px - 10, py);
    ctx.lineTo(px - 31, py - Math.sin(parrot.t / 90) * 9);
    ctx.stroke();

    ctx.fillStyle = '#6ea35a';
    ctx.beginPath(); ctx.ellipse(px, py, 16, 11, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5b8f4b';
    ctx.beginPath(); ctx.ellipse(px - 3, py + 2, 9, 6, -0.3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#d9a83f';
    ctx.beginPath(); ctx.arc(px + 13, py - 7, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c8552f';
    ctx.beginPath(); ctx.arc(px + 16, py - 12, 3.7, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e8d9a8';
    ctx.beginPath();
    ctx.moveTo(px + 19, py - 9);
    ctx.lineTo(px + 26, py - 6);
    ctx.lineTo(px + 19, py - 3);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#2c2c22';
    ctx.beginPath(); ctx.arc(px + 15, py - 9, 1.7, 0, Math.PI * 2); ctx.fill();
  }
}

function drawWeather(w) {
  var k = classify(w);
  var i, t = now();
  if (k.wet) {
    var drops = k.heavy ? 150 : 90;
    ctx.strokeStyle = 'rgba(214,236,246,0.5)';
    ctx.lineWidth = 1.5;
    for (i = 0; i < drops; i++) {
      var x = (jit(i, 1, 1) * W + t * 0.06 * (1 + jit(i, 2, 2))) % W;
      var y = (jit(i, 3, 3) * H + t * 0.55) % H;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 2, y + 14);
      ctx.stroke();
    }
  }
  if (k.snow) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (i = 0; i < 90; i++) {
      var sx = (jit(i, 4, 4) * W + Math.sin(t / 2400 + i) * 22) % W;
      var sy = (jit(i, 5, 5) * H + t * 0.05) % H;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.6 + jit(i, 6, 6) * 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  if (k.mist) {
    /* The pools used to be a circular radial gradient poured into a flat ellipse, so the gradient
       was still opaque where the ellipse stopped — a hard seam across the top and bottom of every
       pool, and a hard cut where one ran off the canvas edge. Scaling the context lets the
       gradient and the shape be the same ellipse. The positions are also kept a radius clear of
       the edges so nothing is sliced by the boundary. */
    for (i = 0; i < 4; i++) {
      var mx = 200 + i * 108 + Math.sin(t / (3400 + i * 700)) * 34;
      var my = 430 + i * 155;
      var rr = 190;
      ctx.save();
      ctx.translate(mx, my);
      ctx.scale(1, 0.34);
      var mg = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
      mg.addColorStop(0, 'rgba(234,244,240,0.19)');
      mg.addColorStop(0.55, 'rgba(234,244,240,0.075)');
      mg.addColorStop(1, 'rgba(234,244,240,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  if (k.frost && !k.snow) {
    ctx.fillStyle = 'rgba(226,242,250,0.32)';
    for (i = 0; i < 40; i++) {
      ctx.beginPath();
      ctx.arc(jit(i, 7, 7) * W, 380 + jit(i, 8, 8) * (H - 380), 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

var _last = 0;
function frame(ts) {
  var t = typeof ts === 'number' ? ts : now();
  var dt = _last ? Math.max(0, Math.min(60, t - _last)) : 16;
  _last = t;
  if (!ctx) return;
  var w = state.weather || fallbackFor(new Date().getMonth());
  /* Clear the whole canvas first. drawSky only paints the sky band, so without this the tile
     field and the margins are never erased — and every translucent thing drawn over them (mist,
     rain, frost sheen) builds up frame after frame. It looked fine in a single screenshot and
     turned the seams between tiles solid white after a few seconds of play. */
  ctx.clearRect(0, 0, W, H);
  drawSky(w);
  var r, c;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) drawTile(c, r);
    drawRowEntities(r);
  }
  drawActors(dt);
  drawWeather(w);
  if (binFlash > 0) {
    binFlash -= dt;
    ctx.fillStyle = 'rgba(255,244,200,' + Math.max(0, binFlash / 700 * 0.20) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}

/* ============================================================ ui */

function note(text, cls) {
  state.log.push({ d: state.day, t: text });
  if (state.log.length > 40) state.log.shift();
  if (notesEl) {
    var p = document.createElement('p');
    p.textContent = text;
    if (cls) p.className = cls;
    notesEl.appendChild(p);
    while (notesEl.childNodes && notesEl.childNodes.length > 12 && notesEl.firstChild) {
      notesEl.removeChild(notesEl.firstChild);
    }
  }
}

function showModal(el) { if (el) el.hidden = false; }
function hideModal(el) { if (el) el.hidden = true; }

function card(title, body, link) {
  if (!els.mCard) return;
  els.cardTitle.textContent = title;
  els.cardBody.textContent = body;
  if (link) { els.cardLink.href = link; els.cardLink.hidden = false; }
  else els.cardLink.hidden = true;
  showModal(els.mCard);
}

function renderTokens() {
  var bar = els.tokenBar;
  if (!bar) return;
  var html = '', i;
  for (i = 0; i < TOKENS.length; i++) {
    html += '<div class="tk">' + TOKEN_ICON[TOKENS[i]] + '<span>' + state.tokens[TOKENS[i]] + '</span></div>';
  }
  bar.innerHTML = html;
}

function renderHud() {
  var w = state.weather;
  if (!w) return;
  if (els.wxIcon) els.wxIcon.innerHTML = TOKEN_ICON[tokenOf(w)];
  if (els.wxText) {
    els.wxText.textContent = Math.round(w.temp) + '\u00b0C \u00b7 ' +
      Math.round(w.wind) + ' km/h \u00b7 ' + weatherWord(w);
  }
  renderTokens();
  if (els.binBadge) els.binBadge.textContent = String(binItems);
  if (els.btnBox) {
    if (binItems >= BIN_LOAD) els.btnBox.className = 'boxbtn ready';
    else els.btnBox.className = 'boxbtn';
  }
  renderDock();
}

function renderDock() {
  var dock = els.dock;
  if (!dock) return;
  var wanted = ['cut'].concat(SP_KEYS);
  var i;
  for (i = 0; i < DECOR_KEYS.length; i++) if (state.decor[DECOR_KEYS[i]] > 0) wanted.push(DECOR_KEYS[i]);
  var sig = wanted.join(',');
  if (dock._sig !== sig) {
    dock.textContent = '';
    for (i = 0; i < wanted.length; i++) {
      var k = wanted[i];
      var isCut = k === 'cut';
      var def = isCut ? null : (SPECIES[k] || DECOR[k]);
      var btn = document.createElement('button');
      btn.className = 'dock' + (isCut ? ' cut' : '');
      btn.setAttribute('data-tool', k);
      btn.setAttribute('aria-pressed', k === tool ? 'true' : 'false');
      btn.appendChild(mkLabel(isCut ? 'Cut' : def.name.split(' ').pop(),
                              isCut ? 'the aliens' : (SPECIES[k] ? def.cost + ' ' + def.token : 'place it')));
      btn.addEventListener('click', mkPicker(k));
      dock.appendChild(btn);
    }
    dock._sig = sig;
  }
  var kids = dock.childNodes, n;
  for (n = 0; n < kids.length; n++) {
    var el = kids[n];
    if (!el || !el.getAttribute) continue;
    var tk = el.getAttribute('data-tool');
    el.setAttribute('aria-pressed', tk === tool ? 'true' : 'false');
    var sp = SPECIES[tk];
    if (sp) el.disabled = !(state.bag[tk] > 0) && state.tokens[sp.token] < sp.cost;
  }
}

function mkLabel(a, b) {
  var frag = document.createDocumentFragment();
  var e1 = document.createElement('b'); e1.textContent = a;
  var e2 = document.createElement('span'); e2.textContent = b;
  frag.appendChild(e1); frag.appendChild(e2);
  return frag;
}
function mkPicker(k) { return function () { tool = k; renderHud(); }; }

function renderBoard() {
  if (!els.boardList) return;
  var ts = boardTasks(), i;
  els.boardList.textContent = '';
  for (i = 0; i < ts.length; i++) {
    var t = ts[i], got = taskGot(t), done = taskDone(t);
    var row = document.createElement('div');
    row.className = 'task' + (done ? ' done' : '');
    var box = document.createElement('div');
    box.className = 'box';
    box.textContent = done ? '\u2713' : '';
    var body = document.createElement('div');
    body.className = 'body';
    var lab = document.createElement('div');
    lab.className = 'label';
    lab.textContent = t.text;
    var bar = document.createElement('div');
    bar.className = 'bar';
    var fill = document.createElement('i');
    fill.style.width = Math.round(got / t.need * 100) + '%';
    bar.appendChild(fill);
    body.appendChild(lab); body.appendChild(bar);
    row.appendChild(box); row.appendChild(body);
    els.boardList.appendChild(row);
  }
  if (els.boardDate) {
    els.boardDate.textContent = new Date().toLocaleDateString('en-ZA',
      { weekday: 'long', day: 'numeric', month: 'long' });
  }
  if (els.boardReward) {
    var tk = tokenOf(state.weather || fallbackFor(new Date().getMonth()));
    els.boardReward.innerHTML = TOKEN_ICON[tk] + ' ' + (state.board ? state.board.reward : 10);
  }
}

function renderShop() {
  var w = state.weather || fallbackFor(new Date().getMonth());
  if (els.shopDate) {
    els.shopDate.textContent = weatherWord(w) + ' at the nursery \u00b7 ' +
      new Date().toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  fillShopRow(els.shopSeeds, SP_KEYS);
  fillShopRow(els.shopDecor, DECOR_KEYS);
  var pick = state.pick;
  if (els.shopName) els.shopName.textContent = pick ? (SPECIES[pick] || DECOR[pick]).name : 'pick something';
  if (els.qty) els.qty.textContent = String(state.qty);
  if (els.btnBuy) {
    if (pick) {
      var def = SPECIES[pick] || DECOR[pick];
      var total = def.cost * state.qty;
      els.btnBuy.innerHTML = 'purchase for ' + TOKEN_ICON[def.token] + ' ' + total;
      els.btnBuy.disabled = state.tokens[def.token] < total;
    } else {
      els.btnBuy.textContent = 'pick something first';
      els.btnBuy.disabled = true;
    }
  }
  if (els.tradeRow) {
    var html = 'short? trade 3 of one for 1:';
    var i;
    for (i = 0; i < TOKENS.length; i++) {
      html += ' <button data-trade="' + TOKENS[i] + '">' + TOKENS[i] + '</button>';
    }
    els.tradeRow.innerHTML = html;
  }
}

function fillShopRow(host, keys) {
  if (!host) return;
  host.textContent = '';
  var i;
  for (i = 0; i < keys.length; i++) {
    (function (k) {
      var def = SPECIES[k] || DECOR[k];
      var el = document.createElement('div');
      el.className = 'item';
      el.setAttribute('data-key', k);
      el.setAttribute('aria-pressed', state.pick === k ? 'true' : 'false');
      var ic = document.createElement('canvas');
      ic.width = 46; ic.height = 46;
      el.appendChild(ic);
      var nm = document.createElement('div');
      nm.textContent = def.name;
      var pr = document.createElement('div');
      pr.className = 'price';
      pr.innerHTML = TOKEN_ICON[def.token] + ' ' + def.cost;
      el.appendChild(nm); el.appendChild(pr);
      el.addEventListener('click', function () { state.pick = k; renderShop(); });
      host.appendChild(el);
      drawShopIcon(ic, k);
    })(keys[i]);
  }
}

function drawShopIcon(canvasEl, key) {
  if (!canvasEl || !canvasEl.getContext) return;
  var g = canvasEl.getContext('2d');
  if (!g) return;
  var saved = ctx;
  ctx = g;
  if (SPECIES[key]) drawTree(key, 3, 23, 42, 46, false);
  else drawDecor(key, 23, 42, 46);
  ctx = saved;
}

/* ============================================================ interaction */

function act(c, r) {
  var t = cell(c, r);
  if (!t) return;
  if (t.obj === 'bin') {
    if (recycle()) { saveLocal(); renderHud(); renderBoard(); }
    return;
  }
  if (t.obj === 'nursery') { renderShop(); showModal(els.mShop); return; }
  if (t.obj === 'house') { renderBoard(); showModal(els.mBoard); return; }
  if (t.obj) return;

  if (tool === 'cut') {
    if (clearAt(c, r)) {
      boardProgress('cuts', 1);
      spawnCritter(c, r);
      saveLocal(); renderHud(); renderBoard();
    }
    return;
  }
  if (DECOR[tool]) {
    if (placeDecor(c, r, tool)) { saveLocal(); renderHud(); }
    return;
  }
  if (plantAt(c, r, tool)) {
    boardProgress('plants', 1);
    if (matureAround(c, r) >= 2 && !state.seen.shade) {
      state.seen.shade = true;
      card('The shade does the work',
        'Indigenous canopy closes over the ground, and the alien seed under it comes up far less. ' +
        'Two or three mature trees around a patch and the clearing holds itself.', null);
    }
    saveLocal(); renderHud(); renderBoard();
  }
}

function spawnCritter(c, r) {
  if (Math.random() > 0.22) return;
  var kinds = ['bushbuck', 'monkey', 'porcupine', 'turaco'];
  actors.push({ kind: kinds[Math.floor(Math.random() * kinds.length)],
                row: r, x: tileX(c, r) + 12, dir: Math.random() < 0.5 ? -1 : 1,
                speed: 0.018 + Math.random() * 0.026, t: 0, life: 4200 + Math.random() * 2600 });
  if (actors.length > 8) actors.shift();
}

/* ============================================================ boot */

function boot() {
  var ids = ['cv', 'wxIcon', 'wxText', 'tokenBar', 'btnGear', 'btnBox', 'binBadge', 'dock', 'notes',
             'codeIn', 'btnSave', 'btnLoad', 'mBoard', 'boardDate', 'boardList', 'boardReward',
             'boardClose', 'mShop', 'shopDate', 'shopSeeds', 'shopDecor', 'shopName', 'qty',
             'qMinus', 'qPlus', 'btnBuy', 'tradeRow', 'shopClose', 'mCard', 'cardTitle', 'cardBody',
             'cardLink', 'cardOk'];
  var i;
  for (i = 0; i < ids.length; i++) els[ids[i]] = document.getElementById(ids[i]);
  notesEl = els.notes;
  cv = els.cv;
  if (cv && cv.getContext) ctx = cv.getContext('2d');

  state = loadLocal() || newState();

  var month = new Date().getMonth();
  state.weather = fallbackFor(month);
  if (!state.board) rollBoard(state.weather);

  var today = dayKey(new Date());
  var newDay = state.lastDayKey !== today;

  /* Wait for the real forecast before rolling the day. Ticking against the season average and
     then swapping the live weather in afterwards meant the field note described a different day
     from the one the weather pill showed, and the day's rain was a guess rather than the day's
     actual rain. Offline, fetchForecast resolves to the same season average, so this still runs. */
  fetchForecast(month).then(function (w) {
    state.weather = w;
    if (newDay) {
      state.ap = AP_MAX;
      state.lastDayKey = today;
      tickDay(w);
      saveLocal();
    } else {
      note('Day ' + state.day + '. ' + weatherWord(w) + ' over the ridge.', 'dim');
    }
    renderHud(); renderBoard(); renderShop();
  });

  if (els.boardClose) els.boardClose.addEventListener('click', function () { hideModal(els.mBoard); });
  if (els.shopClose) els.shopClose.addEventListener('click', function () { hideModal(els.mShop); });
  if (els.cardOk) els.cardOk.addEventListener('click', function () { hideModal(els.mCard); });
  if (els.btnGear) els.btnGear.addEventListener('click', function () { renderBoard(); showModal(els.mBoard); });
  if (els.btnBox) els.btnBox.addEventListener('click', function () { renderShop(); showModal(els.mShop); });
  if (els.qMinus) els.qMinus.addEventListener('click', function () { state.qty = Math.max(1, state.qty - 1); renderShop(); });
  if (els.qPlus) els.qPlus.addEventListener('click', function () { state.qty = Math.min(9, state.qty + 1); renderShop(); });
  if (els.btnBuy) els.btnBuy.addEventListener('click', function () {
    if (!state.pick) return;
    if (buy(state.pick, state.qty)) { saveLocal(); renderShop(); renderHud(); renderBoard(); }
  });
  if (els.tradeRow) els.tradeRow.addEventListener('click', function (ev) {
    var to = ev.target && ev.target.getAttribute ? ev.target.getAttribute('data-trade') : null;
    if (!to || !state.pick) return;
    var def = SPECIES[state.pick] || DECOR[state.pick];
    if (trade(to, def.token)) { saveLocal(); renderShop(); renderHud(); }
  });
  if (els.btnSave) els.btnSave.addEventListener('click', function () {
    var code = encodeSave(state);
    if (els.codeIn) els.codeIn.value = code;
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).catch(function () {});
    }
    note('Save code ready. Send it to yourself on WhatsApp and it is yours for good.', 'good');
  });
  if (els.btnLoad) els.btnLoad.addEventListener('click', function () {
    var s = decodeSave(els.codeIn ? els.codeIn.value : '');
    if (!s) { note('That code did not read. Check for a missing character.', 'warn'); return; }
    state = s;
    if (els.notes) els.notes.textContent = '';
    note('Save code loaded. Day ' + state.day + '.', 'good');
    saveLocal(); renderHud(); renderBoard(); renderShop();
  });

  if (cv && cv.addEventListener) {
    var dragging = false;
    var pick = function (ev) {
      var box = cv.getBoundingClientRect ? cv.getBoundingClientRect() : null;
      if (!box || !box.width) return null;
      return hitTest((ev.clientX - box.left) / box.width * W, (ev.clientY - box.top) / box.height * H);
    };
    cv.addEventListener('pointerdown', function (ev) { dragging = true; var p = pick(ev); if (p) act(p.c, p.r); });
    cv.addEventListener('pointermove', function (ev) { if (dragging) { var p = pick(ev); if (p) act(p.c, p.r); } });
    cv.addEventListener('pointerup', function () { dragging = false; });
    cv.addEventListener('pointercancel', function () { dragging = false; });
    cv.addEventListener('pointerleave', function () { dragging = false; });
  }

  renderHud(); renderBoard(); renderShop();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  else frame(0);
}

/* ============================================================ exports */

var API = {
  VERSION: VERSION, GRID: { COLS: COLS, ROWS: ROWS, NTILES: NTILES },
  ALIENS: ALIENS, SPECIES: SPECIES, DECOR: DECOR, TOKENS: TOKENS,
  ALIEN_KEYS: ALIEN_KEYS, SP_KEYS: SP_KEYS, DECOR_KEYS: DECOR_KEYS, SEASON: SEASON,
  AP_MAX: AP_MAX, BIN_LOAD: BIN_LOAD, PLACES: PLACES,
  newState: newState, getState: function () { return state; }, setState: function (s) { state = s; },
  setTool: function (t) { tool = t; }, terrainAt: terrainAt,
  tickDay: tickDay, clearAt: clearAt, plantAt: plantAt, placeDecor: placeDecor,
  buy: buy, trade: trade, recycle: recycle,
  getBin: function () { return binItems; }, setBin: function (n) { binItems = n; },
  encodeSave: encodeSave, decodeSave: decodeSave, checksum: checksum,
  weatherFrom: weatherFrom, fallbackFor: fallbackFor, classify: classify,
  weatherWord: weatherWord, tokenOf: tokenOf, baboonPass: baboonPass, parrotCheck: parrotCheck,
  fruitingIndigenous: fruitingIndigenous, matureAround: matureAround, plantable: plantable,
  stats: stats, hitTest: hitTest, tileX: tileX, tileY: tileY, tileSize: tileSize,
  rollBoard: rollBoard, boardTasks: boardTasks, boardProgress: boardProgress,
  boardDone: boardDone, claimBoard: claimBoard, taskGot: taskGot, taskDone: taskDone,
  voiceFor: voiceFor, VOICES: VOICES,
  parrotState: function () { return parrot ? { x: parrot.x, y: parrot.y, t: parrot.t } : null; },
  troopState: function () { return troop ? { x: troop.x, row: troop.row } : null; },
  actors: function () { return actors; },
  frame: frame, boot: boot, note: note, renderHud: renderHud,
  renderShop: renderShop, renderBoard: renderBoard
};

if (typeof globalThis !== 'undefined') globalThis.__MB = API;

if (typeof document !== 'undefined' && document.getElementById) {
  try { boot(); } catch (e) { if (typeof console !== 'undefined') console.error(e); }
}

})();
</script>
